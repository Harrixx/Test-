/* Bars & Beef: a rebrand of Mad Gossip. Tabs: Studio, Map, The Beef, Cypher, Crib. Base look below was candy-pastel and sparkly: a pink-to-lilac-to-sky gradient sky, white glass cards, a jewel-tone gradient board, bubbly rounded type. Made for an 18-year-old: bright, cute, a bit extra. */
:root{
  --bg:#ffe1f0;          /* page base under the gradient */
  --night:#3a1650;       /* deep plum: text on bright buttons */
  --wood:rgba(255,255,255,.82);   /* glass cards */
  --wood-hi:#ffe6f4;     /* raised pink surfaces */
  --cell:#f3e8ff;        /* soft lilac fills */
  --cream:#3a1650;       /* main text */
  --muted:#8a64a3;       /* secondary text */
  --neon:#ff3d9a;        /* hot pink accent */
  --amber:#ffae1a;       /* coins, stars */
  --mint:#1fd1a5;        /* ready to serve */
  --violet:#8b5cf6;      /* tokens */
  --sky:#38bdf8;
  --peach:#ff8a5c;
  --line:rgba(139,92,246,.16);
  --glow:0 10px 30px rgba(255,61,154,.16), 0 2px 6px rgba(139,92,246,.10);
  --f-sign:"Pacifico", "Brush Script MT", cursive;
  --f-ui:"Fredoka", "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-hand:"Caveat", "Comic Sans MS", cursive;
  color-scheme:light;
}
[hidden]{display:none!important}
*{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
/* games get tapped fast: stop the phone treating two taps as double-tap-to-zoom */
html,body,button,.cell,.item,.stage,.portrait{touch-action:manipulation}
.board{touch-action:none}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--cream);font-family:var(--f-ui);font-size:15px;font-weight:500;
  background-image:
    radial-gradient(circle at 12% 18%, rgba(255,255,255,.9) 0 1.5px, transparent 2.5px),
    radial-gradient(circle at 78% 9%, rgba(255,255,255,.9) 0 1.5px, transparent 2.5px),
    radial-gradient(circle at 88% 46%, rgba(255,255,255,.8) 0 1.2px, transparent 2px),
    radial-gradient(circle at 6% 66%, rgba(255,255,255,.8) 0 1.2px, transparent 2px),
    linear-gradient(165deg,#ffc8e4 0%,#f3d1ff 38%,#d9dcff 64%,#c6f1ff 100%);
  background-attachment:fixed;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
.app{max-width:460px;margin:0 auto;padding:10px 16px calc(88px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.view{display:flex;flex-direction:column;gap:12px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.sign{font-family:var(--f-sign);font-weight:400;font-size:30px;line-height:1.15;margin:0;padding-right:4px;
  background:linear-gradient(90deg,#ff3d9a,#a855f7 50%,#ff8a5c);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 0 #fff) drop-shadow(0 4px 10px rgba(255,61,154,.35))}
.sign::after{content:" ✨";-webkit-text-fill-color:initial;font-family:var(--f-ui);font-size:18px}
.sign.flicker{animation:flicker 3.2s infinite}
@keyframes flicker{0%,18%,22%,60%,64%,100%{opacity:1}20%,62%{opacity:.35}}
.stats{display:flex;gap:5px;flex-wrap:wrap}
.stat{display:flex;align-items:center;gap:3px;background:var(--wood);border:1.5px solid #fff;border-radius:999px;padding:3px 9px 3px 6px;font-weight:600;font-variant-numeric:tabular-nums;font-size:13px;box-shadow:var(--glow)}
.stat small{font-size:10px;color:var(--muted);font-weight:500;margin-left:2px}
.stat.energy{cursor:pointer}
.stat.tok{color:var(--violet)}
.stat.plank{color:#e0662f}

/* avatars */
.ava{width:52px;height:52px;border-radius:50%;overflow:hidden;flex:none;box-shadow:0 0 0 3px #fff,0 4px 12px rgba(139,92,246,.3);background:var(--cell)}
.ava svg{display:block;width:100%;height:100%}
.ava.emoji{display:grid;place-items:center;font-size:26px}

/* counter */
.counter{background:linear-gradient(160deg,#fff 0%,#fff0f8 100%);border:2px solid #fff;border-radius:22px;padding:12px 6px 10px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;box-shadow:var(--glow);position:relative}
.counter::before{content:"✦ in the studio ✦";position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:linear-gradient(90deg,#ff3d9a,#a855f7);color:#fff;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:2px 10px;border-radius:999px;white-space:nowrap}
.patron{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;position:relative;transition:transform .35s, opacity .35s}
.patron.leaving{transform:translateY(-14px);opacity:0}
.patron.arriving{animation:arrive .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes arrive{from{transform:translateY(14px);opacity:0}}
.pname{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.order{display:flex;gap:3px}
.chip{position:relative;width:34px;height:34px;border-radius:12px;background:linear-gradient(135deg,#c084fc,#f472b6);border:2px solid #fff;display:grid;place-items:center;box-shadow:0 3px 8px rgba(168,85,247,.3)}
.chip.have{background:linear-gradient(135deg,#34d399,#38bdf8);box-shadow:0 0 0 2px var(--mint),0 4px 12px rgba(31,209,165,.45)}
.chip.have::after{content:"✓";position:absolute;right:-6px;top:-7px;background:var(--mint);color:#fff;font-size:10px;font-weight:800;width:16px;height:16px;border-radius:50%;display:grid;place-items:center;border:2px solid #fff}
.serve{font-size:11px;font-weight:700;letter-spacing:.03em;padding:5px 10px;border-radius:999px;background:var(--cell);color:var(--muted)}
.serve.ready{background:linear-gradient(135deg,#1fd1a5,#38bdf8);color:#fff;box-shadow:0 4px 12px rgba(31,209,165,.45);animation:nudge 1.4s infinite}
@keyframes nudge{0%,100%{filter:brightness(1)}50%{filter:brightness(1.15)}}
.reward{font-size:10px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}

/* fix-up strip */
.story{display:flex;align-items:center;gap:10px;background:var(--wood);border:2px solid #fff;border-radius:18px;padding:8px 10px;box-shadow:var(--glow)}
.story .txt{flex:1;min-width:0}
.story .ch{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--neon);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.story .task{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{font-weight:700;padding:8px 14px;border-radius:999px;background:#fff;border:1.5px solid var(--line);white-space:nowrap;box-shadow:0 2px 6px rgba(139,92,246,.12)}
.btn.go{background:linear-gradient(135deg,#ffae1a,#ff3d9a);color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(255,61,154,.4)}
.btn.tok{background:linear-gradient(135deg,#8b5cf6,#d946ef);color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(139,92,246,.35)}
.btn.plank{background:linear-gradient(135deg,#ffb067,#ff6f91);color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(255,111,145,.35)}
.btn[disabled]{opacity:.4;cursor:default;box-shadow:none}
.book{font-size:22px;padding:6px 8px;position:relative}
.book .dot{position:absolute;top:2px;right:2px;width:10px;height:10px;border-radius:50%;background:var(--neon);border:2px solid #fff}

/* board */
.board{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;padding:8px;border-radius:24px;border:3px solid #fff;touch-action:none;
  background:linear-gradient(140deg,#8b5cf6 0%,#d946ef 45%,#ff5fa2 75%,#ff9a5c 100%);box-shadow:0 14px 34px rgba(217,70,239,.35)}
.cell{aspect-ratio:1;max-width:100%;background:rgba(255,255,255,.2);border-radius:12px;display:grid;place-items:center;position:relative;box-shadow:inset 0 0 0 1px rgba(255,255,255,.28)}
.cell.sel{box-shadow:inset 0 0 0 3px #fff;background:rgba(255,255,255,.38)}
.cell.target{box-shadow:inset 0 0 0 3px var(--mint);background:rgba(31,209,165,.4)}
.item{font-size:min(6.8vw,28px);line-height:1;position:relative;display:grid;place-items:center;width:100%;height:100%;cursor:grab}
.item.pop{animation:pop .25s ease-out}
.item.pop::before{content:"✨";position:absolute;top:-6px;right:-4px;font-size:14px;animation:sparkle .7s ease-out forwards;pointer-events:none}
@keyframes sparkle{from{opacity:1}to{transform:translateY(-14px);opacity:0}}
@keyframes fxpop{from{opacity:0}to{opacity:1}}
.fx.popfx{animation:fxpop .45s ease-out}
@keyframes pop{from{opacity:0}to{opacity:1}}
.item.dragging{opacity:.25}
.pips{position:absolute;bottom:3px;left:0;right:0;display:flex;justify-content:center;gap:2px}
.pips i{width:4px;height:4px;border-radius:50%;background:#fff;box-shadow:0 0 3px rgba(255,255,255,.9)}
.cell.wanted::before{content:"";position:absolute;top:3px;right:3px;width:9px;height:9px;border-radius:50%;background:var(--mint);border:2px solid #fff;z-index:1}
.gen .item{background:rgba(255,255,255,.45);border-radius:12px;box-shadow:inset 0 0 0 2px #fff,0 0 14px rgba(255,255,255,.6)}
.gen .item::after{content:"TAP";position:absolute;bottom:2px;font-size:8px;font-weight:700;letter-spacing:.12em;color:#fff;background:var(--neon);padding:0 4px;border-radius:4px}
.gen.locked .item{filter:grayscale(1) opacity(.6);box-shadow:inset 0 0 0 1px rgba(255,255,255,.5);background:none}
.gen.locked .item::after{content:attr(data-lock);background:rgba(58,22,80,.5)}
.ghost{position:fixed;pointer-events:none;z-index:50;font-size:36px;transform:translate(-50%,-60%);filter:drop-shadow(0 6px 10px rgba(139,92,246,.5))}

/* info tray */
.tray{min-height:58px;background:var(--wood);border:2px solid #fff;border-radius:18px;padding:8px 12px;display:flex;align-items:center;gap:10px;box-shadow:var(--glow)}
.tray .big{font-size:28px;background:linear-gradient(135deg,#c084fc,#f472b6);border-radius:14px;padding:4px;display:grid;place-items:center}
.tray .meta{flex:1;min-width:0}
.tray .nm{font-weight:700}
.tray .ladder{font-size:15px;letter-spacing:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:linear-gradient(90deg,#c084fc,#f472b6);border-radius:8px;padding:1px 4px;display:inline-block;max-width:100%}
.tray .ladder b{filter:drop-shadow(0 0 4px #fff)}
.tray .ladder span{opacity:.35}
.tray .hint{color:var(--muted);font-size:13px}

/* karaoke */
.stage{position:relative;height:340px;border-radius:24px;overflow:hidden;border:3px solid #fff;cursor:pointer;touch-action:manipulation;box-shadow:0 14px 34px rgba(217,70,239,.35);
  background:
    radial-gradient(50% 55% at 50% 38%, rgba(255,255,255,.4), transparent 70%),
    repeating-linear-gradient(90deg, #ff6fb5 0 18px, #f0559f 18px 36px)}
.stage::after{content:"";position:absolute;left:0;right:0;bottom:0;height:84px;background:linear-gradient(#a855f7,#6d28d9);border-top:4px solid #fff}
.spot{position:absolute;left:50%;top:-20px;width:240px;height:300px;transform:translateX(-50%);background:conic-gradient(from 160deg at 50% 0, transparent 0 8deg, rgba(255,255,255,.3) 8deg 32deg, transparent 32deg);pointer-events:none}
.disco{position:absolute;left:50%;top:44px;transform:translateX(-50%);font-size:26px;z-index:2;pointer-events:none;animation:spin 3s linear infinite}
@keyframes spin{to{transform:translateX(-50%) rotate(360deg)}}
.singer{position:absolute;left:50%;top:76px;width:150px;transform:translateX(-50%);z-index:2;pointer-events:none;transform-origin:50% 100%}
.singer .ava{width:150px;height:150px;box-shadow:0 0 0 5px #fff,0 0 0 9px #ffd84d,0 0 40px rgba(255,255,255,.8)}
.singer.bop{animation:bop .22s ease-out}
@keyframes bop{50%{transform:translateX(-50%) rotate(-3deg)}}
.mic{position:absolute;left:calc(50% + 46px);top:186px;font-size:34px;z-index:3;pointer-events:none;transform:rotate(-20deg)}
.songcard{position:absolute;left:12px;top:12px;right:12px;z-index:3;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.songcard .now{background:rgba(255,255,255,.9);border-radius:14px;padding:6px 10px;min-width:0;color:var(--cream)}
.songcard .k{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--neon);font-weight:700}
.songcard .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.combo{background:rgba(255,255,255,.9);border-radius:14px;padding:6px 10px;text-align:right;flex:none}
.combo b{font-size:20px;color:var(--violet);font-variant-numeric:tabular-nums}
.crowd{position:absolute;left:0;right:0;bottom:6px;z-index:4;display:flex;justify-content:center;gap:2px;pointer-events:none}
.crowd .ava{width:56px;height:56px;margin-bottom:-14px}
.crowd .ava:nth-child(odd){animation:sway 1.4s ease-in-out infinite}
.crowd .ava:nth-child(even){animation:sway 1.4s ease-in-out infinite reverse}
@keyframes sway{50%{transform:translateY(-6px) rotate(4deg)}}
.float{position:absolute;z-index:6;pointer-events:none;font-weight:700;color:#fff;font-size:20px;text-shadow:0 2px 0 var(--violet),0 0 10px rgba(139,92,246,.8);animation:rise .9s ease-out forwards}
.float.mus{color:#ffd84d;font-size:22px}
@keyframes rise{to{transform:translateY(-80px);opacity:0}}
.tapme{position:absolute;left:0;right:0;top:252px;text-align:center;z-index:3;font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:12px;color:#fff;text-shadow:0 1px 4px rgba(109,40,217,.8);pointer-events:none}
.meter{height:10px;background:#fff;border-radius:999px;overflow:hidden;border:1.5px solid #fff;box-shadow:inset 0 0 0 1px var(--line)}
.meter i{display:block;height:100%;background:linear-gradient(90deg,#8b5cf6,#ff3d9a,#ffae1a);width:0;transition:width .15s;border-radius:999px}
.meterrow{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:4px}
.shop{background:var(--wood);border:2px solid #fff;border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--glow)}
.shop h2{margin:0;font-size:18px}
.shop p{margin:0;color:var(--muted);font-size:13px}
.sitem{display:flex;align-items:center;gap:10px}
.sitem .ic{font-size:24px;width:40px;height:40px;text-align:center;display:grid;place-items:center;background:var(--wood-hi);border-radius:14px}
.sitem .d{flex:1;min-width:0}
.sitem .d b{display:block}
.sitem .d span{font-size:12px;color:var(--muted)}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:2px solid #fff;box-shadow:0 -6px 24px rgba(139,92,246,.15);padding:6px 16px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:6px}
.tab{flex:1;max-width:200px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px;border-radius:16px;color:var(--muted);font-size:12px;font-weight:600;position:relative}
.tab .i{font-size:22px}
.tab[aria-selected="true"]{color:var(--neon);background:linear-gradient(135deg,#ffe3f1,#f3e8ff)}
.tab .badge{position:absolute;top:2px;left:calc(50% + 10px);background:var(--violet);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:999px;font-variant-numeric:tabular-nums;border:1.5px solid #fff}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:linear-gradient(135deg,#3a1650,#6d28d9);color:#fff;font-weight:600;padding:9px 16px;border-radius:999px;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none;max-width:calc(100% - 32px);text-align:center;box-shadow:0 8px 24px rgba(109,40,217,.35)}
.toast.on{opacity:1}

/* beef note after serving */
.note{position:fixed;left:50%;top:calc(90px + env(safe-area-inset-top,0px));transform:translateX(-50%) rotate(-1.5deg);width:min(360px,calc(100% - 40px));background:linear-gradient(135deg,#fff5fb,#ffe3f1);color:var(--cream);border:2px solid #fff;border-radius:18px;padding:12px 14px;z-index:55;box-shadow:0 14px 34px rgba(255,61,154,.3);font-family:var(--f-hand);font-size:22px;line-height:1.15;animation:pin .35s cubic-bezier(.3,1.6,.5,1);display:flex;gap:10px;align-items:flex-start}
.note .ava{width:46px;height:46px}
.note .who{font-family:var(--f-ui);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:4px;display:flex;justify-content:space-between;gap:6px}
.note .new{color:#fff;background:var(--neon);padding:0 6px;border-radius:999px}
@keyframes pin{from{transform:translateX(-50%) rotate(-1.5deg) translateY(-10px);opacity:0}}

/* overlays */
.overlay{position:fixed;inset:0;background:rgba(58,22,80,.38);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:70;display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.overlay.center{align-items:center}
.scene{width:min(440px,100%);background:linear-gradient(160deg,#fff,#fff0f8);border:2px solid #fff;border-radius:24px;padding:14px 16px;display:flex;gap:12px;cursor:pointer;animation:arrive .3s ease-out;box-shadow:0 18px 40px rgba(109,40,217,.3)}
.scene:focus{outline:none}
.scene .ava{width:72px;height:72px}
.scene .say{flex:1;min-width:0}
.scene .who{font-weight:700;color:var(--neon);font-size:13px;letter-spacing:.04em}
.scene .line{font-size:17px;line-height:1.4;margin-top:2px;text-wrap:pretty}
.scene .line.narr{font-style:italic;color:var(--muted)}
.scene .line.letter{font-family:var(--f-hand);font-size:23px;color:var(--cream)}
.scene .more{font-size:11px;color:var(--muted);text-align:right;margin-top:6px}
.card{width:min(440px,100%);max-height:80vh;overflow:auto;background:linear-gradient(160deg,#fff,#fff0f8);border:2px solid #fff;border-radius:24px;padding:18px;box-shadow:0 18px 40px rgba(109,40,217,.3)}
.card h2{margin:0 0 4px;font-size:21px;text-wrap:balance}
.card p{margin:4px 0 12px;color:var(--muted);line-height:1.45}
.card .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.gb-who{display:flex;align-items:center;gap:10px;margin:16px 0 6px;font-weight:700}
.gb-who .ava{width:40px;height:40px}
.gb-who small{color:var(--muted);font-weight:500}
.gb-line{font-family:var(--f-hand);font-size:20px;line-height:1.2;padding:4px 0 4px 50px;color:var(--cream)}
.gb-line.locked{font-family:var(--f-ui);font-size:13px;color:var(--muted);opacity:.7}
.chapter-card{text-align:center}
.chapter-card .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--neon);font-weight:700}
.chapter-card h2{font-family:var(--f-sign);font-weight:400;font-size:28px;margin:6px 0;background:linear-gradient(90deg,#ff3d9a,#a855f7);-webkit-background-clip:text;background-clip:text;color:transparent}
.squad{display:flex;justify-content:center;margin:6px 0 10px}
.squad .ava{width:40px;height:40px;margin:0 -5px}
.reset{font-size:12px;color:var(--muted);text-decoration:underline;padding:4px;align-self:center}

/* drawn items */
.drink{display:block;width:92%;height:92%;overflow:visible;filter:drop-shadow(0 2px 2px rgba(58,22,80,.35))}
.chip .drink{width:26px;height:26px}
.tray .big .drink{width:40px;height:40px}
.ladder .drink{display:inline-block;width:22px;height:22px;vertical-align:middle}
.ladder span .drink{opacity:.35}
.ghost .drink{width:48px;height:48px}

/* The Beef (feed) */
.feedhead{background:linear-gradient(135deg,#ff3d9a,#a855f7);color:#fff;border:2px solid #fff;border-radius:22px;padding:14px 16px;box-shadow:var(--glow)}
.feedhead h2{margin:0;font-size:24px;font-family:var(--f-sign);font-weight:400}
.feedhead p{margin:4px 0 0;color:rgba(255,255,255,.92);font-size:13px;line-height:1.4}
.post{background:var(--wood);border:2px solid #fff;border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--glow)}
.post.fresh{animation:arrive .4s ease-out;box-shadow:0 0 0 3px rgba(255,61,154,.35),var(--glow)}
.phead{display:flex;align-items:center;gap:10px}
.phead .ava{width:44px;height:44px}
.phead .who{flex:1;min-width:0}
.phead b{display:block}
.phead small{color:var(--muted);font-size:12px}
.about{display:inline-flex;align-items:center;gap:5px;background:var(--wood-hi);border-radius:999px;padding:2px 9px 2px 2px;font-size:12px;font-weight:600;color:var(--neon);white-space:nowrap}
.about .ava{width:22px;height:22px;box-shadow:none}
.ptext{font-size:16px;line-height:1.4;text-wrap:pretty}
.replies{display:flex;flex-direction:column;gap:6px;background:var(--cell);border-radius:16px;margin-left:12px;padding:8px 10px}
.reply{display:flex;gap:8px;align-items:flex-start;font-size:14px;line-height:1.35}
.reply .ava{width:26px;height:26px;box-shadow:0 0 0 2px #fff}
.reply b{margin-right:4px}
.pfoot{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.like{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:999px;border:1.5px solid var(--line);font-weight:600;background:#fff}
.like.on{color:#fff;border-color:transparent;background:linear-gradient(135deg,#ff3d9a,#ff8a5c)}
.like .bonus{color:#e0662f;font-size:11px}
.empty{color:var(--muted);text-align:center;padding:20px}

/* home */
.room{position:relative;aspect-ratio:4/3;max-width:100%;border-radius:24px;overflow:hidden;border:3px solid #fff;box-shadow:var(--glow)}
.wall{position:absolute;left:0;right:0;top:0;bottom:30%}
.wall.l0{background:radial-gradient(30% 20% at 20% 70%,rgba(0,0,0,.18),transparent),radial-gradient(25% 30% at 80% 30%,rgba(0,0,0,.14),transparent),#b4a59a}
.wall.l1{background:#ffd6e8}
.wall.l2{background:repeating-linear-gradient(90deg,#fde4f2 0 14px,#e9d5ff 14px 28px)}
.wall.l3{background:linear-gradient(#ffd0e6 0,#ffb4c8 30%,#a5e3f5 30.1%,#a5e3f5 62%,#5b9fd6 62.1%,#4a86c0 100%)}
.floor{position:absolute;left:0;right:0;bottom:0;height:30%;background:repeating-linear-gradient(90deg,#c9a07e 0 34px,#b98f6d 34px 36px)}
.floor.l3{background:#f5b8d4}
.skirting{position:absolute;left:0;right:0;bottom:30%;height:6px;background:#fff}
.rug{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);width:58%;height:20%;border-radius:50%}
.rug.l1{background:repeating-linear-gradient(90deg,#ff8fb8 0 10px,#ffd36b 10px 20px,#8fd3ff 20px 30px)}
.rug.l2{background:radial-gradient(circle,#ffd36b 0 18%,#c084fc 19% 60%,#ffd36b 61% 66%,#8b5cf6 67%)}
.rug.l3{background:radial-gradient(circle,#fff 0 30%,#f9a8d4 31% 70%,#fff 71%)}
.fx{position:absolute;transform:translate(-50%,-50%);line-height:1;display:grid;place-items:center;transition:transform .2s}
.fx.sel{outline:3px dashed var(--neon);outline-offset:4px;border-radius:10px}
.fx.lv0{filter:grayscale(.95) brightness(.8)}
.fx.lv3{filter:drop-shadow(0 0 8px rgba(255,255,255,.95))}
.win{left:22%;top:26%;width:30%;height:38%;border:5px solid #fff;border-radius:8px;background:linear-gradient(#ffc6e0 0 30%,#a5e3f5 30% 58%,#4a86c0 58%);overflow:visible}
.win.lv0{border-color:#9a8f86}
.win .boat{position:absolute;left:30%;top:42%;font-size:clamp(12px,4vw,18px)}
.win .crack{position:absolute;inset:0;width:100%;height:100%}
.win .cur{position:absolute;top:-8px;bottom:-6px;width:28%;background:repeating-linear-gradient(90deg,#ff8fb8 0 6px,#ff6fa5 6px 12px);border-radius:0 0 10px 10px}
.win .cur.l{left:-12%}.win .cur.r{right:-12%}
.win .seat{position:absolute;left:-14%;right:-14%;bottom:-16px;height:14px;background:#c084fc;border-radius:8px;box-shadow:0 3px 0 #8b5cf6}
.frame{border:4px solid #fff;background:#fff;border-radius:6px;padding:2px;box-shadow:0 4px 10px rgba(0,0,0,.15)}
.frame.gold{border-color:#ffcf4a;box-shadow:0 0 0 2px #e0a800,0 0 16px rgba(255,207,74,.8)}
.squadpic{display:flex}
.squadpic .ava{width:clamp(28px,8vw,38px)!important;height:clamp(28px,8vw,38px)!important}
.frame .ava{width:clamp(44px,13vw,60px);height:clamp(44px,13vw,60px);border-radius:3px;box-shadow:none}
.hlist{display:flex;flex-direction:column;gap:8px}
.hrow{display:flex;align-items:center;gap:10px;background:var(--wood);border:2px solid #fff;border-radius:18px;padding:8px 10px;box-shadow:var(--glow)}
.hrow.sel{box-shadow:0 0 0 3px rgba(255,61,154,.4),var(--glow)}
.hrow .ic{font-size:22px;width:40px;height:40px;display:grid;place-items:center;background:var(--wood-hi);border-radius:14px}
.hrow .d{flex:1;min-width:0}
.hrow .d b{display:block}
.hrow .d span{font-size:12px;color:var(--muted)}
.lvl{display:flex;gap:3px;margin-top:3px}
.lvl i{width:16px;height:5px;border-radius:3px;background:var(--cell)}
.lvl i.on{background:linear-gradient(90deg,#ff6f91,#ffb067)}
.comfort{background:var(--wood);border:2px solid #fff;border-radius:18px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--glow)}
.comfort .meterrow{margin:0}

/* ---- v2: one screen, no page scroll; waist-up portraits; level map ---- */
html,body{overflow:hidden}
.app{height:100%;box-sizing:border-box;padding:8px 16px calc(64px + env(safe-area-inset-bottom,0px));gap:8px}
.view{flex:1;min-height:0;gap:8px}
.top{flex-wrap:nowrap;gap:6px}
.sign{font-size:21px}
.sign::after{content:none}
.stats{gap:3px;flex-wrap:nowrap}
.stat{font-size:12px;padding:2px 6px 2px 4px;gap:2px;border-width:1px}
.stat small{display:none}

/* portraits: the whole person from the waist up, never a circle */
.ava{border-radius:14px;box-shadow:0 0 0 2px #fff,0 3px 8px rgba(139,92,246,.25)}
.ava[class*="ph-"]{background:var(--ph) 50% 3%/150% auto no-repeat,var(--tint)}
.portrait{background:var(--ph) 50% 0/100% auto no-repeat,var(--tint);border-radius:16px;border:2px solid #fff;box-shadow:0 4px 12px rgba(139,92,246,.25);position:relative;overflow:hidden;box-sizing:border-box}

/* the bar */
.counter{padding:14px 6px 8px;gap:6px}
.patron{gap:5px}
.bubble{position:relative;background:#fff;border-radius:14px;padding:3px;display:flex;gap:3px;box-shadow:0 3px 10px rgba(139,92,246,.22);min-height:34px;align-items:center;justify-content:center}
.bubble::after{content:"";position:absolute;bottom:-5px;left:50%;width:10px;height:10px;background:#fff;transform:translateX(-50%) rotate(45deg)}
.bubble .chip{width:30px;height:30px;border-width:1.5px;z-index:1}
.patron .portrait{width:100%;height:clamp(64px,12vh,104px)}
.nametag{position:absolute;left:3px;right:3px;bottom:3px;background:rgba(255,255,255,.9);border-radius:999px;font-size:11px;font-weight:700;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:1px 4px;color:var(--cream)}
.serve{width:100%;padding:4px 2px}
.story{padding:5px 8px;gap:8px;border-radius:16px}
.story .txt{cursor:pointer}
.lvbadge{flex:none;width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#ff3d9a,#a855f7);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:16px;line-height:1;border:2px solid #fff;box-shadow:0 3px 10px rgba(255,61,154,.35)}
.lvbadge small{font-size:8px;letter-spacing:.1em}
.tray{min-height:0;padding:4px 10px;border-radius:16px;gap:8px}
.tray .big{font-size:18px;padding:2px;border-radius:10px}
.tray .big .drink{width:26px;height:26px}
.tray .ladder .drink{width:17px;height:17px}
.tray .hint{font-size:12px;line-height:1.25}
.tray .btn{padding:4px 10px;font-size:13px}
.boardwrap{flex:1;min-height:0;container-type:size;display:flex;justify-content:center;align-items:center}
.board{box-sizing:border-box;width:min(100cqw,calc(100cqh * 7 / 9));height:min(100cqh,calc(100cqw * 9 / 7));grid-template-rows:repeat(9,1fr);padding:6px;gap:4px;border-radius:20px}
.cell{aspect-ratio:auto;border-radius:10px;min-width:0;min-height:0}
.item{font-size:clamp(13px,calc(min(100cqw,100cqh * 7 / 9) / 7 * .52),30px)}

/* the selected-item tray slides over the level strip, so the board never resizes */
.strip{position:relative}
.strip .tray{position:absolute;inset:0;z-index:3;animation:arrive .2s ease-out;background:#fff}
.tray .meta .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-height:700px){
  .counter{padding:12px 4px 6px;gap:4px}
  .patron .portrait{height:62px}
  .bubble{min-height:30px}
  .bubble .chip{width:26px;height:26px}
  .chip .drink{width:22px;height:22px}
  .serve{padding:3px 2px;font-size:10px}
  .lvbadge{width:34px;height:34px}
  .story{padding:4px 8px}
  .story .btn{padding:6px 10px}
}

/* customer recipe card */
.howbtn{display:block;width:100%;padding:0;position:relative;border-radius:16px}
.howtag{position:absolute;top:3px;right:3px;background:var(--neon);color:#fff;font-size:9px;font-weight:700;padding:1px 5px;border-radius:999px;border:1.5px solid #fff;pointer-events:none}
button.bubble{font:inherit;cursor:pointer;width:100%}
.recipecard{max-height:86vh}
.rhead{display:flex;gap:12px;align-items:center;margin-bottom:8px}
.rhead .portrait{width:74px;height:96px;flex:none}
.rhead .k{font-size:11px;color:var(--neon);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.rhead h2{font-size:17px;line-height:1.25;margin:2px 0 0}
.recipe{background:var(--cell);border-radius:18px;padding:10px;margin-top:8px}
.rname{display:flex;align-items:center;gap:8px;font-size:16px}
.rname .drink{width:34px;height:34px;background:linear-gradient(135deg,#c084fc,#f472b6);border-radius:10px;padding:2px}
.rladder{display:flex;align-items:center;gap:2px;overflow-x:auto;padding:8px 0 4px}
.rstep{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;width:58px;text-align:center}
.rstep .drink{width:40px;height:40px;background:linear-gradient(135deg,#c084fc,#f472b6);border-radius:12px;padding:3px;border:2px solid #fff;box-sizing:border-box}
.rstep.got .drink{background:linear-gradient(135deg,#34d399,#38bdf8)}
.rstep.goal .drink{box-shadow:0 0 0 3px var(--neon)}
.rstep small{font-size:10px;line-height:1.1;font-weight:600}
.rstep i{font-size:9px;color:#0f9f7c;font-style:normal;font-weight:700}
.rarrow{flex:none;font-size:10px;font-weight:700;color:var(--violet);white-space:nowrap}
.recipe ol{margin:6px 0 4px;padding-left:20px;font-size:13px;line-height:1.45}
.rstat{margin:4px 0 8px!important;font-size:13px;font-weight:600;color:var(--cream)!important}
.findgen{font-size:13px;padding:6px 12px}
.cell.flash{animation:flash .6s ease-in-out 4}
@keyframes flash{50%{box-shadow:inset 0 0 0 4px #fff,0 0 18px #fff;background:rgba(255,255,255,.6)}}

/* tutorial spotlight + coach */
#tutHole{position:fixed;z-index:65;border-radius:16px;border:3px solid #fff;box-shadow:0 0 0 9999px rgba(40,10,60,.45),0 0 24px rgba(255,255,255,.9);pointer-events:none;animation:holepulse 1.2s ease-in-out infinite}
@keyframes holepulse{50%{box-shadow:0 0 0 9999px rgba(40,10,60,.45),0 0 4px rgba(255,255,255,.6)}}
#tutCoach{position:fixed;left:50%;transform:translateX(-50%);width:min(420px,calc(100% - 24px));z-index:66;display:flex;gap:10px;align-items:flex-end;background:linear-gradient(160deg,#fff,#fff0f8);border:2px solid #fff;border-radius:22px;padding:10px 12px;box-shadow:0 14px 36px rgba(109,40,217,.35);animation:arrive .3s ease-out;box-sizing:border-box}
#tutCoach.up{top:calc(8px + env(safe-area-inset-top,0px))}
#tutCoach.down{bottom:calc(70px + env(safe-area-inset-bottom,0px))}
#tutCoach .portrait{width:58px;height:76px;flex:none;border-radius:14px}
#tutCoach .cbody{flex:1;min-width:0}
#tutCoach .cwho{font-size:12px;font-weight:700;color:var(--neon);display:flex;justify-content:space-between}
#tutCoach .cwho span{color:var(--muted);font-weight:600}
#tutCoach .ctext{font-size:15px;line-height:1.35;margin:2px 0 6px}
#tutCoach .crow{display:flex;justify-content:space-between;align-items:center;gap:8px}
#tutCoach .crow .btn{padding:6px 14px}
#tutCoach .cdo{font-size:13px;font-weight:700;color:var(--violet);animation:nudge 1.4s infinite}

/* logo */
.sign{line-height:0;padding:0;background:none;-webkit-background-clip:border-box;background-clip:border-box;filter:drop-shadow(0 3px 6px rgba(255,61,154,.3))}
.sign .logo{display:block;height:42px;width:auto}
.cardlogo{display:block;width:min(240px,70%);height:auto;margin:-4px auto 4px}
@media (max-height:700px){ .sign .logo{height:36px} .cardlogo{width:min(190px,60%)} }

/* level road map */
.mapcard{flex:1;min-height:0;border-radius:24px;border:3px solid #fff;overflow:hidden;background:linear-gradient(#ffd9ec 0%,#ecdcff 45%,#c9ecff 100%);box-shadow:var(--glow)}
#mapSvg{width:100%;height:100%;display:block}
#mapSvg [data-lv]{cursor:pointer}
.node-cur{animation:throb 1.3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes throb{50%{opacity:.5}}
.mappanel{background:var(--wood);border:2px solid #fff;border-radius:20px;padding:8px 10px;display:flex;align-items:center;gap:10px;box-shadow:var(--glow)}
.mappanel .portrait{width:54px;height:68px;flex:none;border-radius:14px}
.mappanel .d{flex:1;min-width:0}
.mappanel .k{font-size:11px;color:var(--neon);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.mappanel b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mappanel small{color:var(--muted);font-size:12px}

/* karaoke */
.stage{flex:1;min-height:190px;height:auto}
.singer{top:auto;bottom:62px;width:auto;height:62%;aspect-ratio:3/4}
.singer .portrait{width:100%;height:100%;border:4px solid #fff;border-radius:22px;box-shadow:0 0 0 4px #ffd84d,0 0 40px rgba(255,255,255,.8)}
.disco{top:62px;left:22px;transform:none;animation:none}
.mic{top:auto;bottom:84px}
.tapme{top:auto;bottom:60px;z-index:5}
.crowd{bottom:2px;gap:3px}
.crowd .portrait{width:42px;height:54px;border-radius:12px;border-width:1.5px}
.karameter .meterrow{margin-bottom:2px}
.shop{padding:8px 12px;gap:5px;border-radius:18px}
.shop p{display:none}
.shop h2{font-size:15px}
#shopList{gap:5px!important}
.sitem{gap:8px}
.sitem .ic{width:30px;height:30px;font-size:17px;border-radius:10px}
.sitem .d b{font-size:14px}
.sitem .d span{font-size:11px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sitem .btn{padding:5px 10px;font-size:13px}

/* home */
.room{flex:1;min-height:0;aspect-ratio:auto}
.comfort{padding:6px 10px;gap:4px}
.hlist{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.hrow{min-width:0;flex-direction:column;gap:2px;padding:6px 4px;border-radius:14px;text-align:center;align-items:center}
.hrow .ic{width:26px;height:26px;font-size:15px;border-radius:8px}
.hrow .d{width:100%}
.hrow .d b{font-size:11px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow .d span{display:none}
.hrow .lvl{justify-content:center}
.hrow .btn{padding:3px 9px;font-size:12px}

/* The Beef */
.feedhead{padding:8px 14px}
.feedhead h2{font-size:20px}
.feedhead p{font-size:12px}
#feedList{flex:1;min-height:0;overflow:auto;padding:4px 2px 8px;overscroll-behavior:contain}

/* scenes */
.scene .portrait{width:80px;height:104px;flex:none}

/* tabs */
.tabs{padding:4px 8px calc(4px + env(safe-area-inset-bottom,0px));gap:2px}
.tab{font-size:11px;padding:5px 2px}
.tab .i{font-size:20px}

/* ===== Bars & Beef look: a studio at night. Ink-purple ground, gold and hot-pink neon, white sticker outlines. ===== */
:root{
  --bg:#120a1f; --night:#160b26; --wood:rgba(36,20,60,.86); --wood-hi:#3a2158; --cell:#2a1844;
  --cream:#f6eeff; --muted:#bba7dc; --neon:#ff3d9a; --amber:#ffd64a; --mint:#2ee6a6; --violet:#a78bfa;
  --line:rgba(255,255,255,.14); --glow:0 10px 30px rgba(0,0,0,.45),0 0 0 1px rgba(167,139,250,.12);
  --f-logo:"Bungee","Arial Black",system-ui,sans-serif;
  color-scheme:dark;
}
body{background-color:var(--bg);background-image:
  radial-gradient(circle at 12% 18%, rgba(255,138,31,.7) 0 1px, transparent 2px),
  radial-gradient(circle at 78% 9%, rgba(255,255,255,.7) 0 1px, transparent 2px),
  radial-gradient(circle at 88% 46%, rgba(255,61,154,.7) 0 1px, transparent 2px),
  radial-gradient(60% 40% at 85% 0%, rgba(255,61,154,.22), transparent 70%),
  radial-gradient(70% 50% at 0% 100%, rgba(124,58,237,.28), transparent 70%),
  linear-gradient(170deg,#1c0f33 0%,#120a1f 55%,#0b0614 100%)}
/* logo */
.sign{filter:none}
.sign .logo{display:inline-flex;align-items:baseline;gap:4px;height:auto;font-family:var(--f-logo);font-size:22px;line-height:1;letter-spacing:.02em;white-space:nowrap}
.sign .logo b{font-weight:400;color:var(--amber);text-shadow:0 2px 0 #000,0 0 14px rgba(255,138,31,.35)}
.sign .logo i{font-style:normal;color:var(--neon);font-size:.8em;text-shadow:0 0 12px rgba(255,61,154,.8)}
.cardlogo{display:flex;justify-content:center;margin:0 auto 6px}
.cardlogo .logo{font-size:34px}
@media (max-height:700px){ .sign .logo{font-size:19px} .cardlogo .logo{font-size:28px} }
/* surfaces that were white become dark glass */
.counter,.scene,.card,#tutCoach{background:linear-gradient(160deg,#2a1747,#1a0e2e)}
.bubble,.bubble::after{background:#2f1b4f}
.btn{background:#2f1b4f;color:var(--cream);box-shadow:none}
.like{background:#2f1b4f}
.strip .tray{background:#241339}
.nametag{background:rgba(18,10,31,.85);color:var(--cream)}

.tabs{background:rgba(18,10,31,.9);border-top-color:rgba(255,255,255,.12);box-shadow:0 -6px 24px rgba(0,0,0,.4)}
.tab[aria-selected="true"]{background:linear-gradient(135deg,#3a1d5c,#2a1747);color:var(--amber)}
.meter{background:#2a1844;border-color:rgba(255,255,255,.15)}
.note{background:linear-gradient(135deg,#2f1b4f,#1f1235);color:var(--cream);border-color:rgba(255,255,255,.7)}
.serve{background:#2a1844}
.counter::before{background:linear-gradient(90deg,#ffd64a,#ff3d9a);color:#160b26}
.story .ch{color:var(--amber)}
/* the board: a neon mixing desk */
.board{background:linear-gradient(140deg,#4c1d95 0%,#7e22ce 40%,#db2777 80%,#f59e0b 120%);box-shadow:0 14px 34px rgba(124,58,237,.45),0 0 30px rgba(255,61,154,.25)}
.cell{background:rgba(10,4,20,.35);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.gen .item{background:rgba(255,255,255,.18)}
.drink{filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
/* cypher stage: graffiti wall under purple lights */
.stage{background:
  radial-gradient(50% 55% at 50% 38%, rgba(255,138,31,.25), transparent 70%),
  repeating-linear-gradient(0deg, #2a1440 0 22px, #241136 22px 24px),
  #2a1440}
.stage::after{background:linear-gradient(#ff3d9a,#7e22ce)}
/* map at night */
.mapcard{background:linear-gradient(#1c0f33 0%,#2a1650 50%,#3b1d5c 100%)}
/* recipe card */
.recipe{background:#2f1b4f}
.rstat{color:var(--cream)!important}
.feedhead{background:linear-gradient(135deg,#ff3d9a,#7e22ce)}

/* ===== Bars & Beef: URBAN. Night-time brick and concrete, sodium street-light yellow, spray-paint red,
   subway blue. Hard black outlines and offset shadows like stickers and flyers on a wall. ===== */
:root{
  --bg:#111113; --night:#0e0e10; --wood:#1c1c20; --wood-hi:#2b2b31; --cell:#222227;
  --cream:#f6e7c8; --muted:#a6a39b; --neon:#e8261c; --amber:#ff8a1f; --mint:#2ee6a6; --violet:#3d7bff;
  --line:rgba(255,255,255,.12); --glow:4px 4px 0 #000;
  --f-ui:"Barlow","Arial",system-ui,sans-serif; --f-cond:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-tag:"Permanent Marker","Comic Sans MS",cursive; --f-hand:"Permanent Marker","Comic Sans MS",cursive;
  color-scheme:dark;

<script>
(() => {
'use strict';
const COLS = 7, ROWS = 9, N = COLS * ROWS;
const E_BASE = 100, E_REGEN_MS = 20000;
const SAVE_KEY = 'barsbeef.v1';

/* ---------- caricatures (drawn as SVG) ---------- */
function shade(hex, a){
  const n = parseInt(hex.slice(1),16), ch = [n>>16, n>>8&255, n&255];
  return '#' + ch.map(v => Math.max(0,Math.min(255,Math.round(a<0 ? v*(1+a) : v+(255-v)*a)))).map(v=>v.toString(16).padStart(2,'0')).join('');
}
function face(L){
  const s = L.skin, sd = shade(s,-.18), h = L.hair || '#333', ink = '#2a1712';
  const ey = 44, eyeL = 39, eyeR = 61;
  let o = `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect width="100" height="100" fill="${L.bg}"/>`;
  // hair behind the head
  if (L.hairStyle==='long') o += `<path d="M18 44 Q12 80 22 98 L78 98 Q88 80 82 44 Z" fill="${h}"/>`;
  if (L.hairStyle==='pony') o += `<path d="M72 26 Q96 46 84 86 Q80 62 68 42Z" fill="${h}"/>`;
  if (L.hairStyle==='bouffant') o += `<ellipse cx="50" cy="44" rx="42" ry="34" fill="${h}"/>`;
  // body + neck
  o += `<path d="M8 100 Q10 80 50 78 Q90 80 92 100 Z" fill="${L.shirt}"/>`;
  o += `<rect x="43" y="64" width="14" height="16" fill="${sd}"/>`;
  const acc = L.acc;
  if (acc==='dogcollar') o += `<path d="M38 79 Q50 84 62 79 L62 83 Q50 88 38 83Z" fill="#fff"/><rect x="47" y="80" width="6" height="5" fill="#fff"/>`;
  if (acc==='chain') o += `<path d="M28 84 Q50 100 72 84" stroke="#e8b830" stroke-width="3.5" fill="none" stroke-dasharray="3 1.5"/><circle cx="50" cy="93" r="5" fill="#e8b830" stroke="#a87c10"/>`;
  if (acc==='pearls') o += [30,36,42,50,58,64,70].map((x,i)=>`<circle cx="${x}" cy="${83+[0,2.5,4,5,4,2.5,0][i]}" r="2.3" fill="#f6f1e6"/>`).join('');
  if (acc==='whistle') o += `<path d="M40 79 L52 92" stroke="#f2f2f2" stroke-width="1.5"/><rect x="50" y="90" width="9" height="5" rx="2" fill="#c0c4c8"/>`;
  if (acc==='scrubs') o += `<path d="M40 79 L50 90 L60 79" stroke="${shade(L.shirt,-.3)}" stroke-width="2.5" fill="none"/>`;
  if (acc==='collarup') o += `<path d="M30 82 L42 72 L46 84Z M70 82 L58 72 L54 84Z" fill="${shade(L.shirt,.15)}"/>`;
  // ears
  o += `<ellipse cx="21" cy="50" rx="6" ry="8" fill="${s}"/><ellipse cx="79" cy="50" rx="6" ry="8" fill="${s}"/>`;
  if (L.earrings==='hoop') o += `<circle cx="20" cy="60" r="4" fill="none" stroke="#e8b830" stroke-width="1.6"/><circle cx="80" cy="60" r="4" fill="none" stroke="#e8b830" stroke-width="1.6"/>`;
  if (L.earrings==='drop') o += `<circle cx="20" cy="59" r="2.6" fill="#7ad7f0"/><circle cx="80" cy="59" r="2.6" fill="#7ad7f0"/>`;
  // head
  const head = {
    oval:`<ellipse cx="50" cy="46" rx="29" ry="32" fill="${s}"/>`,
    round:`<ellipse cx="50" cy="47" rx="31" ry="30" fill="${s}"/>`,
    long:`<ellipse cx="50" cy="45" rx="26" ry="34" fill="${s}"/>`,
    jaw:`<ellipse cx="50" cy="44" rx="29" ry="29" fill="${s}"/><ellipse cx="50" cy="60" rx="27" ry="18" fill="${s}"/>`,
  }[L.head || 'oval'];
  o += head;
  if (L.blush) o += `<circle cx="31" cy="57" r="6" fill="#ff6b6b" opacity=".28"/><circle cx="69" cy="57" r="6" fill="#ff6b6b" opacity=".28"/>`;
  if (L.freckles) o += [[30,54],[34,57],[29,58],[66,54],[70,57],[71,53]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="1" fill="${shade(s,-.35)}"/>`).join('');
  if (L.wrinkles) o += `<path d="M36 27 Q43 25 50 27 Q57 25 64 27 M38 31 Q50 29 62 31 M28 46 l-4 -2 M28 49 l-4 1 M72 46 l4 -2 M72 49 l4 1" stroke="${sd}" stroke-width="1.2" fill="none" stroke-linecap="round"/>`;
  // eyes
  const big = L.eyes==='wide', rx = big?7:6, ry = big?8:6.5, px = L.eyes==='side'?2.6:0.6;
  for (const ex of [eyeL, eyeR]){
    o += `<ellipse cx="${ex}" cy="${ey}" rx="${rx}" ry="${ry}" fill="#fff"/>`;
    o += `<circle cx="${ex+px}" cy="${ey+1}" r="${big?3.4:3}" fill="${ink}"/><circle cx="${ex+px+1}" cy="${ey}" r="1" fill="#fff"/>`;
    if (L.eyes==='sleepy') o += `<path d="M${ex-rx-1} ${ey+.5} A${rx+1} ${ry+1} 0 0 1 ${ex+rx+1} ${ey+.5} Z" fill="${s}"/><path d="M${ex-rx} ${ey+.5} L${ex+rx} ${ey+.5}" stroke="${ink}" stroke-width="1.4"/>`;
    if (L.lashes) o += `<path d="M${ex-rx} ${ey-3} l-3 -3 M${ex-rx+3} ${ey-ry+1} l-1 -4 M${ex+rx} ${ey-3} l3 -3 M${ex+rx-3} ${ey-ry+1} l1 -4" stroke="${ink}" stroke-width="1.3" stroke-linecap="round"/>`;
  }
  // brows
  const bc = L.brow || shade(h,-.25), by = ey - ry - 4;
  const brows = {
    flat:`M${eyeL-7} ${by} L${eyeL+7} ${by} M${eyeR-7} ${by} L${eyeR+7} ${by}`,
    up:`M${eyeL-7} ${by+1} L${eyeL+7} ${by-3} M${eyeR-7} ${by-3} L${eyeR+7} ${by+1}`,
    angry:`M${eyeL-7} ${by-3} L${eyeL+7} ${by+2} M${eyeR-7} ${by+2} L${eyeR+7} ${by-3}`,
    raised:`M${eyeL-7} ${by-5} Q${eyeL} ${by-10} ${eyeL+7} ${by-5} M${eyeR-7} ${by} L${eyeR+7} ${by}`,
  }[L.brows || 'flat'];
  o += `<path d="${brows}" stroke="${bc}" stroke-width="3.6" stroke-linecap="round" fill="none"/>`;
  // facial hair (under the mouth)
  const fh = L.beardColor || h;
  if (L.beard==='beard') o += `<path d="M21 46 Q20 86 50 92 Q80 86 79 46 Q76 68 62 71 Q50 66 38 71 Q24 68 21 46Z" fill="${fh}"/>`;
  if (L.beard==='stubble') o += `<path d="M23 52 Q24 84 50 88 Q76 84 77 52 Q72 70 50 70 Q28 70 23 52Z" fill="${fh}" opacity=".28"/>`;
  // nose
  const nose = {
    big:`<ellipse cx="50" cy="56" rx="8.5" ry="7.5" fill="${sd}"/><circle cx="46" cy="59" r="1.4" fill="${shade(s,-.45)}"/><circle cx="54" cy="59" r="1.4" fill="${shade(s,-.45)}"/>`,
    pointy:`<path d="M48 44 Q51 52 60 60 Q53 63 46 60 Z" fill="${sd}"/>`,
    red:`<circle cx="50" cy="56" r="8" fill="#d9665e"/><circle cx="47" cy="53" r="2" fill="#fff" opacity=".45"/>`,
    button:`<ellipse cx="50" cy="56" rx="4.5" ry="3.5" fill="${L.noseColor || sd}"/>`,
  }[L.nose || 'button'];
  o += nose;
  // mouth
  const lips = L.lips || '#6b1f24', my = 68;
  const mouth = {
    grin:`<path d="M36 ${my-3} Q50 ${my+12} 64 ${my-3} Z" fill="#4a1518" stroke="${lips}" stroke-width="${L.lips?2.5:0}"/><path d="M38 ${my-2} L62 ${my-2} Q60 ${my+2} 57 ${my+2} L43 ${my+2} Q40 ${my+2} 38 ${my-2}Z" fill="#fff"/>`,
    smile:`<path d="M40 ${my-2} Q50 ${my+6} 60 ${my-2}" stroke="${lips}" stroke-width="2.8" fill="none" stroke-linecap="round"/>`,
    smirk:`<path d="M41 ${my} Q53 ${my+3} 61 ${my-5}" stroke="${lips}" stroke-width="2.8" fill="none" stroke-linecap="round"/>`,
    o:`<ellipse cx="50" cy="${my+1}" rx="4.5" ry="5.5" fill="#4a1518"/>`,
    frown:`<path d="M41 ${my+3} Q50 ${my-4} 59 ${my+3}" stroke="${lips}" stroke-width="2.8" fill="none" stroke-linecap="round"/>`,
    pursed:`<ellipse cx="50" cy="${my}" rx="5" ry="3.2" fill="${lips}"/>`,
  }[L.mouth || 'smile'];
  o += mouth;
  // moustache (over the lip)
  const tc = L.tacheColor || fh;
  if (L.tache==='tache') o += `<path d="M35 64 Q42 56 50 60 Q58 56 65 64 Q58 62 50 64 Q42 62 35 64Z" fill="${tc}"/>`;
  if (L.tache==='handlebar') o += `<path d="M30 56 Q33 66 43 62 Q48 59 50 61 Q52 59 57 62 Q67 66 70 56 Q70 66 58 66 Q52 66 50 64 Q48 66 42 66 Q30 66 30 56Z" fill="${tc}"/>`;
  // glasses
  if (L.glasses==='round') o += `<g fill="rgba(255,255,255,.12)" stroke="#1e1e1e" stroke-width="2"><circle cx="${eyeL}" cy="${ey}" r="9"/><circle cx="${eyeR}" cy="${ey}" r="9"/></g><path d="M48 ${ey} Q50 ${ey-2} 52 ${ey}" stroke="#1e1e1e" stroke-width="2" fill="none"/>`;
  if (L.glasses==='specs') o += `<path d="M30 ${ey} A9 8 0 0 0 48 ${ey} Z M52 ${ey} A9 8 0 0 0 70 ${ey} Z" fill="rgba(255,255,255,.12)" stroke="#b08a3e" stroke-width="1.8"/><path d="M48 ${ey} L52 ${ey}" stroke="#b08a3e" stroke-width="1.8"/>`;
  if (L.glasses==='shades') o += `<path d="M28 ${ey-6} H48 V${ey+3} Q48 ${ey+8} 40 ${ey+8} H34 Q28 ${ey+8} 28 ${ey+2}Z M52 ${ey-6} H72 V${ey+2} Q72 ${ey+8} 66 ${ey+8} H60 Q52 ${ey+8} 52 ${ey+3}Z" fill="#111"/><path d="M48 ${ey-4} H52" stroke="#111" stroke-width="2.5"/><path d="M32 ${ey-3} l6 0 M56 ${ey-3} l6 0" stroke="#fff" opacity=".35" stroke-width="1.6"/>`;
  // hair on top
  const hairTop = {
    short:`<path d="M20 44 Q17 11 50 11 Q83 11 80 44 Q76 25 50 23 Q24 25 20 44Z" fill="${h}"/>`,
    quiff:`<path d="M20 44 Q17 13 46 11 Q40 2 62 3 Q86 6 80 44 Q76 25 50 23 Q24 25 20 44Z" fill="${h}"/><path d="M48 6 Q62 2 74 12" stroke="#fff" opacity=".3" stroke-width="2" fill="none"/>`,
    slick:`<path d="M20 44 Q17 12 50 12 Q83 12 80 44 Q78 26 62 21 Q40 20 26 32 Q22 38 20 44Z" fill="${h}"/><path d="M34 18 Q50 13 70 18" stroke="#fff" opacity=".28" stroke-width="2" fill="none"/>`,
    bald:`<path d="M19 50 Q16 32 27 28 Q24 38 25 50Z M81 50 Q84 32 73 28 Q76 38 75 50Z" fill="${h}"/><ellipse cx="42" cy="22" rx="8" ry="4" fill="#fff" opacity=".22"/>`,
    curly:[[22,38],[26,26],[34,17],[45,12],[56,12],[67,17],[75,26],[79,38],[40,20],[52,18],[63,21]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="9" fill="${h}"/>`).join(''),
    bun:`<circle cx="50" cy="9" r="10" fill="${h}"/><path d="M20 44 Q17 13 50 13 Q83 13 80 44 Q76 26 50 24 Q24 26 20 44Z" fill="${h}"/>`,
    long:`<path d="M19 50 Q14 10 50 10 Q86 10 81 50 Q78 26 60 22 Q50 30 34 28 Q24 34 19 50Z" fill="${h}"/>`,
    pony:`<path d="M20 44 Q17 11 50 11 Q83 11 80 44 Q76 25 50 22 Q24 25 20 44Z" fill="${h}"/>`,
    bouffant:`<ellipse cx="50" cy="20" rx="38" ry="18" fill="${h}"/><path d="M30 14 Q50 4 70 14" stroke="#fff" opacity=".3" stroke-width="2.5" fill="none"/>`,
    helmet:`<path d="M15 50 Q12 4 50 4 Q88 4 85 50 Q80 46 78 30 Q60 26 50 30 Q40 26 22 30 Q20 46 15 50Z" fill="${h}"/><path d="M24 18 Q50 8 76 18" stroke="#fff" opacity=".35" stroke-width="3" fill="none"/>`,
    crop:`<path d="M22 40 Q21 15 50 15 Q79 15 78 40 Q74 23 50 21 Q26 23 22 40Z" fill="${h}"/>`,
  }[L.hairStyle] || '';
  o += hairTop;
  if (L.hatShades) o += `<path d="M30 20 H48 V25 Q48 28 42 28 H36 Q30 28 30 24Z M52 20 H70 V24 Q70 28 64 28 H58 Q52 28 52 25Z" fill="#1a1a1a"/><path d="M48 21 H52" stroke="#1a1a1a" stroke-width="2"/>`;
  // hats
  const hc = L.hatColor || '#333';
  if (L.hat==='beanie') o += `<path d="M17 40 Q17 4 50 4 Q83 4 83 40 Z" fill="${hc}"/><rect x="15" y="31" width="70" height="11" rx="4" fill="${shade(hc,-.25)}"/><circle cx="50" cy="5" r="6" fill="${shade(hc,.35)}"/>`;
  if (L.hat==='cap') o += `<path d="M19 36 Q20 8 50 8 Q80 8 81 36 Z" fill="${hc}"/><rect x="18" y="30" width="64" height="7" fill="${shade(hc,-.3)}"/><path d="M18 36 Q50 48 82 36 Q50 42 18 36Z" fill="#111"/><circle cx="50" cy="22" r="4" fill="#e8b830"/>`;
  if (L.hat==='captain') o += `<ellipse cx="50" cy="20" rx="36" ry="13" fill="#f4f4f4"/><rect x="18" y="22" width="64" height="11" fill="#1f2d4a"/><path d="M22 33 Q50 48 78 33 Q50 40 22 33Z" fill="#111"/><circle cx="50" cy="27" r="4" fill="#e8b830"/><path d="M38 30 Q50 34 62 30" stroke="#e8b830" stroke-width="1.5" fill="none"/>`;
  return o + '</svg>';
}

const CHAPTERS = [
  { title:'First Night in the Booth',
    intro:[
      [null,"Northside. One studio, one label boss, and zero secrets that survive a cypher."],
      [null,"Your Auntie Ro produced every classic that came out of The Booth. A month ago she vanished and left the studio to you. Plot twist."],
      ['imani',"Yo! You must be Ro's niece. I'm Imani, I DJ the Friday cyphers. We've literally been waiting for you."],
      ['poppy',"Don't panic. We'll show you how the studio works. Step by step. I've made a checklist."],
      ['leo',"Right, enough chat. Make us something. This city talks when the music's good."]],
    tasks:[
      { name:'Dust off the mixing desk', cost:1, scene:[
        ['leo',"Ro never missed a Friday session. Twenty years. Then one Friday, nothing. Booth locked, lights off."],
        ['leo',"I engineered her last session that morning. She saved the file as 'DON'T SELL'. Then she left."]]},
      { name:'Fix the ON AIR sign', cost:2, scene:[
        [null,"The neon buzzes, coughs, and holds. ON AIR. Ro's sign. The whole block can see it."],
        ['ruby',"Word is Ro owed money to half the scene."],
        ['poppy',"Word is wrong. I checked. She paid everyone in cash. Including studio time for kids who couldn't afford it."]]},
      { name:"Find Ro's hard drive", cost:2, scene:[
        [null,"Behind the speaker stack there's a hard drive with your name on it."],
        ['letter',"If you're hearing this, don't sell. Whatever Rex Royale offers. Keep the mics on and listen. The booth talks. — Ro"]]},
      { name:'Fix the old turntables', cost:3, scene:[
        [null,"The turntables scratch back to life. Imani grins and takes over."],
        ['imani',"Heads up. Rex Royale's car is outside. Tinted windows. Engine running."],
        [null,"He doesn't come in. An envelope slides under the door: an offer to buy The Booth. Tonight only."],
        ['zara',"Rip it up. Actually, no. Frame it. Evidence."]]},
      { name:'Open the doors for the cypher', cost:3, scene:[
        [null,"Night air rolls in. On the doorstep: a gold mic tied with a red ribbon."],
        ['rafi',"That's Ro's mic. Nobody touches that mic."],
        ['rafi',"She had it with her when she left. So either she was just here... or someone's been in her flat."]]},
    ]},
  { title:'Beef on the Block',
    intro:[
      [null,"Word spreads that The Booth is open again. The whole crew has basically moved in."],
      ['leo',"Also? Rex Royale has a tour bus by the river that only moves at night. Not being dramatic. Just saying."],
      [null,"The record press is warmed up. New sounds unlocked."]],
    tasks:[
      { name:'Hang the gold records', cost:3, scene:[
        ['finn',"Saw Rex Royale at the radio station at 3am. With lawyers. In sunglasses."],
        ['finn',"Nobody wears sunglasses at 3am for a good reason."]]},
      { name:"Put up Ro's old photos", cost:3, scene:[
        [null,"One photo stops you: Ro in the booth with a little girl in a yellow jacket and headphones far too big for her."],
        ['imani',"...that's me. I was seven. She gave me my first decks. I've never told anyone that."]]},
      { name:'Unlock the vault', cost:4, scene:[
        [null,"The vault opens. Inside: a desk, a dusty drum machine, and a ledger in Ro's handwriting."],
        [null,"Studio time, paid in cash, for every young artist on the block. For eleven years."],
        ['rafi',"And all the gear I make beats on? She paid for it. Told me it was a 'grant'."]]},
      { name:'Fix the vocal booth', cost:4, scene:[
        ['lily',"Okay. I need to say something. I work for Rex Royale's label."],
        ['lily',"He wants every artist on this block on a terrible contract. And this studio turned into luxury flats."],
        ['zara',"Lily. Babe. You're on the wrong team."],
        ['lily',"I KNOW. I'm switching."]]},
      { name:'Graffiti the shutters', cost:5, scene:[
        [null,"It's late. Poppy stays behind while you save the session files, holding an old festival wristband."],
        ['poppy',"'Ro, Artist Pass.' Scanned at the Southside open mic. Every week this month."],
        ['poppy',"She isn't missing. She's hiding. And she's been reading up on music contracts."]]},
    ]},
  { title:'Battle for the Block',
    intro:[
      [null,"The council vote on Rex's luxury flats is in nine days. He's moved it to a Tuesday morning. Sneaky."],
      ['sofia',"Leave Tuesday to me. I'm singing at every club on the block. Every set ends with 'Save The Booth'."],
      [null,"The merch stand is open. Time to dress the part."]],
    tasks:[
      { name:'Set up the stage lights', cost:4, scene:[
        ['ruby',"I've told everyone at my sessions. They've told everyone at their shows."],
        ['poppy',"And my blog's front page is now one headline: 'Who wants to sell our studio?'"]]},
      { name:'Build the cypher stage', cost:5, scene:[
        [null,"Rafi and Finn bolt down the last speaker. The council agrees to hold the vote at The Booth: the town hall's sound system mysteriously broke."],
        ['finn',"Funny how that happened right after Rafi went in there with a screwdriver."],

function migrate(s){
  if (s.tut === undefined) s.tut = s.served > 0 ? -1 : 0;
  if (s.cast !== 2){ s.cast = 2; s.feed = []; s.feedUnread = 0; s.heard = {}; s.patrons = []; if (s.kara) s.kara.who = 'imani'; }
  while (s.board.length < N) s.board.push(null);
  s.tokens ??= 0; s.planks ??= 0; s.home ??= {}; s.feed ??= []; s.feedUnread ??= 0;
  // only items from the current chains are kept
  s.board = s.board.map(b => {
    if (!b) return b;
    if (b.g) return CHAINS[b.g] ? b : null;
    if (!CHAINS[b.c]) b.c = OLD_CHAINS[b.c] || 'brew';
    return b;
  });
  s.patrons = (s.patrons||[]).filter(p => p.order.every(o => CHAINS[o.c]));
  s.kara ??= { who:'imani', song:0, cheers:0 };
  s.patrons = (s.patrons||[]).filter(p => PEOPLE[p.who]);
  return s;
}

function ensureGens(announce){
  for (const c of Object.keys(CHAINS)){
    let i = S.board.findIndex(b => b && b.g===c);
    if (i < 0){
      const home = CHAINS[c].home;
      i = S.board[home] ? nearestEmpty(home) : home;
      if (i < 0) continue; // board full; try again next time
      S.board[i] = { g:c };
    }
    const was = S.board[i].locked;
    S.board[i].locked = !unlocked(c);
    if (announce && was && !S.board[i].locked) toast(`New unlock: ${CHAINS[c].gen[1]}! Obsessed 😍`);
  }
}

/* ---------- energy ---------- */
function tickEnergy(){
  const now = Date.now();
  if (S.energy >= eMax()){ S.eTs = now; return; }
  const gained = Math.floor((now - S.eTs)/E_REGEN_MS);
  if (gained > 0){ S.energy = Math.min(eMax(), S.energy + gained); S.eTs += gained*E_REGEN_MS; if (S.energy>=eMax()) S.eTs = now; }
}

/* ---------- patrons & orders ---------- */
const SEATS = 4;
function townsfolk(){ return Object.keys(PEOPLE).filter(k => PEOPLE[k].from <= S.ch); }
function availablePeople(){
  const here = new Set(S.patrons.map(p=>p.who));
  return townsfolk().filter(k => !here.has(k));
}
function makeOrder(){
  const cap = Math.min(MAX_T, 1 + Math.floor(S.served/3));
  const count = S.served < 3 ? 1 : (Math.random() < .45 ? 2 : 1);
  const chains = Object.keys(CHAINS).filter(unlocked);
  const order = [];
  for (let i=0;i<count;i++){
    const c = pick(chains);
    const t = Math.max(1, Math.min(cap, 1 + rnd(cap) - (Math.random()<.4 && cap>2 ? 1 : 0)));
    order.push({c,t});
  }
  const val = order.reduce((s,o)=>s + (1<<o.t), 0);
  const stars = val >= 12 ? 2 : 1;
  return { order, coins: 4 + val*3, stars, planks: stars + 1 };
}
const squadOf = keys => keys.filter(k => PEOPLE[k].photo);
function newPatron(){
  const avail = availablePeople(); if (!avail.length) return null;
  // the photo squad are the main characters: three times as likely to walk in
  const pool = avail.concat(squadOf(avail), squadOf(avail));
  return { who: pick(pool), ...makeOrder(), fresh:true };
}
function fillPatrons(){ while (S.patrons.length < SEATS){ const p = newPatron(); if(!p) break; S.patrons.push(p); } }

function findCells(order){
  const used = new Set(), cells = [];
  for (const o of order){
    let found = -1;
    for (let i=0;i<N;i++){ const b=S.board[i]; if (b && !b.g && b.c===o.c && b.t===o.t && !used.has(i)){ found=i; break; } }
    if (found<0) return null;
    used.add(found); cells.push(found);
  }
  return cells;
}

      const ok = S.board.some(b=>b && !b.g && b.c===o.c && b.t===o.t);
      if (ok) S.board.forEach((b,j)=>{ if(b && !b.g && b.c===o.c && b.t===o.t) wanted.add(j); });
      return `<div class="chip ${ok?'have':''}" title="${CHAINS[o.c].items[o.t][0]}">${art(o.c,o.t)}</div>`;
    }).join('');
    return `<div class="patron ${p.fresh?'arriving':''}" data-i="${i}">
      <button class="bubble" data-how="${i}" title="How do I make this?">${chips}</button>
      <button class="howbtn" data-how="${i}" aria-label="How do I make ${who.name}'s order?">${portrait(who, 'named')}<span class="howtag">how? 👆</span></button>
      <button class="serve ${cells?'ready':''}" data-serve="${i}" ${cells?'':'aria-disabled="true"'}>${cells?'Serve 💅':'Waiting…'}</button></div>`;
  }).join('');
  S.patrons.forEach(p=>delete p.fresh);

  if (S.ch < CHAPTERS.length){
    const ch = CHAPTERS[S.ch], t = ch.tasks[S.task];
    $('lvBadge').innerHTML = `<small>LEVEL</small>${levelNow()+1}`;
    $('chLabel').textContent = `Chapter ${S.ch+1} · ${ch.title} · tap for map`;
    $('taskLabel').textContent = t.name;
    $('taskBtn').textContent = `Play ⭐${t.cost}`;
    $('taskBtn').classList.toggle('go', S.stars >= t.cost);
  } else {
    $('lvBadge').innerHTML = '🏆';
    $('chLabel').textContent = 'All 15 levels done · tap for map';
    $('taskLabel').textContent = 'Keep making hits. Keep the beef coming. 🔥';
    $('taskBtn').textContent = 'Replay';
    $('taskBtn').classList.remove('go');
  }
  $('bookDot').hidden = !S.bookNew;

  const html = [];
  for (let i=0;i<N;i++){
    const b = S.board[i];
    let inner = '', cls = 'cell';
    if (b && b.g){
      cls += ' gen' + (b.locked ? ' locked' : '');
      inner = `<div class="item" data-lock="CH ${CHAINS[b.g].unlock+1}">${genOf(b)[0]}</div>`;
    } else if (b){
      inner = `<div class="item ${i===popAt?'pop':''}">${art(b.c,b.t)}<span class="pips">${'<i></i>'.repeat(b.t+1)}</span></div>`;
      if (wanted.has(i)) cls += ' wanted';
    }
    if (i===sel) cls += ' sel';
    html.push(`<div class="${cls}" data-cell="${i}">${inner}</div>`);
  }
  $('board').innerHTML = html.join('');
  popAt = -1;
  renderTray();
  tutPlace();
}

/* ---------- bar actions ---------- */
function nearestEmpty(from){
  const fr = Math.floor(from/COLS), fc = from%COLS;
  let best=-1, bd=1e9;
  for (let i=0;i<N;i++){
    if (S.board[i]) continue;
    const d=Math.hypot(Math.floor(i/COLS)-fr, i%COLS-fc);
    if (d<bd){ bd=d; best=i; }
  }
  return best;
}
function produce(i){
  const g = S.board[i];
  if (g.locked){ toast(`The ${genOf(g)[1]} unlocks in chapter ${CHAINS[g.g].unlock+1}. Patience, bestie.`); render(); return; }
  tickEnergy();
  if (S.energy <= 0){ openEnergy(); return; }
  const to = nearestEmpty(i);
  if (to < 0){ toast("Board's full, bestie. Merge or sell something 💅"); return; }
  if (S.energy >= eMax()) S.eTs = Date.now();
  S.energy--;
  S.board[to] = { c:g.g, t: (Math.random()<.12 && !(S.tut>=0 && S.tut<4)) ? 1 : 0 };
  popAt = to; save(); render(); tutEvent('pour');
}
function moveOrMerge(from, to){
  if (from===to){ render(); return; }
  const a = S.board[from], b = S.board[to];
  if (a && b && !a.g && !b.g && a.c===b.c && a.t===b.t && a.t<MAX_T){
    S.board[to] = { c:a.c, t:a.t+1 }; S.board[from] = null;
    popAt = to; sel = to;
    tutEvent('merge');
    if (a.t+1 === MAX_T) toast(`${itemName(S.board[to])}! That's a banger, that 🔥`);
    else if (a.t+1 >= 3 && Math.random() < .5) toast(`${itemName(S.board[to])}. ${pick(SLAY)}`);
  } else {
    S.board[to] = a; S.board[from] = b; sel = to;
  }
  save(); render();
}
function serve(i){
  const p = S.patrons[i];
  const cells = findCells(p.order);
  if (!cells){ toast(`${PEOPLE[p.who].name} is still waiting on that, no cap.`); return; }
  cells.forEach(c=>{ S.board[c]=null; if (c===sel) sel=-1; });
  S.coins += p.coins; S.stars += p.stars; S.planks += (p.planks||2); S.served++;
  S.energy = Math.min(eMax() + 50, S.energy + 2);
  const who = PEOPLE[p.who];
  const heard = S.heard[p.who] || (S.heard[p.who] = []);
  const unheard = who.gossip.map((_,k)=>k).filter(k=>!heard.includes(k));
  const k = unheard.length ? pick(unheard) : rnd(who.gossip.length);
  const isNew = !heard.includes(k);
  if (isNew){ heard.push(k); S.bookNew = true; }
  showNote(who, who.gossip[k], isNew);
  const posted = unlockPost();
  const el = document.querySelector(`.patron[data-i="${i}"]`);
  if (el) el.classList.add('leaving');
  S.patrons.splice(i,1);
  const np = newPatron(); if (np) S.patrons.splice(i,0,np);
  save(); updateBadges();
  toast(`${pick(SLAY)} +${p.coins}💵 +${p.stars}⭐ +${p.planks||2}💎`);
  if (posted) setTimeout(()=>toast('New beef just dropped 🔥'), 2100);
  tutEvent('serve');
  setTimeout(render, 320);
}
let noteT;
function showNote(who, text, isNew){
  document.querySelectorAll('.note').forEach(n=>n.remove());
  const n = document.createElement('div');
  n.className = 'note';
  n.innerHTML = `${avatar(who)}<div><div class="who"><span>${who.name} is talking 🔥</span>${isNew?'<span class="new">NEW BEEF</span>':''}</div>${text}</div>`;
  n.onclick = () => n.remove();
  document.body.appendChild(n);
  clearTimeout(noteT); noteT = setTimeout(()=>n.remove(), 4500);
}

function mult(){ return combo >= 30 ? 3 : combo >= 10 ? 2 : 1; }

function renderShop(){
  $('shopList').innerHTML = SHOP.map(it=>{
    let desc = it.desc;
    if (it.id==='upgrade'){
      const b = sel>=0 ? S.board[sel] : null;

    }

function shopUsable(id){
  if (id==='upgrade'){ const b = sel>=0 ? S.board[sel] : null; return !!(b && !b.g && b.t<MAX_T); }
  if (id==='crate') return S.board.some(b=>!b);
  return true;
}
function buy(id){
  const it = SHOP.find(x=>x.id===id);
  if (!it || S.tokens < it.cost || !shopUsable(id)) return;
  S.tokens -= it.cost;
  if (id==='energy'){ S.energy += 30; toast('+30 ⚡ Main character energy restored'); }
  if (id==='star'){ S.stars += 1; toast('+1 ⭐ Iconic.'); }
  if (id==='reroll'){ S.patrons = S.patrons.map(p=>({ who:p.who, ...makeOrder(), fresh:true })); toast('New requests! Studio time on the house 🎧'); }
  if (id==='crate'){
    const c = pick(Object.keys(CHAINS).filter(unlocked));
    const to = nearestEmpty(N-1);
    S.board[to] = { c, t:2 }; popAt = to; sel = to;
    toast(`Mystery drop: ${itemName(S.board[to])} 📦`);
  }
  if (id==='upgrade'){ const b = S.board[sel]; S.board[sel] = { c:b.c, t:b.t+1 }; popAt = sel; toast(`Glow up! It's a ${itemName(S.board[sel])} now ✨`); }
  save(); render();
}
function cheer(e){
  const now = performance.now();
  combo = (now - lastTap < 450) ? combo + 1 : 0;
  lastTap = now;
  const m = mult();
  S.tokens += m;
  S.kara.cheers++;
  const r = $('stage').getBoundingClientRect();
  const x = (e.clientX ?? r.left + r.width/2) - r.left, y = (e.clientY ?? r.top + r.height/2) - r.top;
  floatAt(x, y, `+${m}🎟️`, '');
  if (Math.random() < .5) floatAt(x + (Math.random()*60-30), y - 10, pick(['♪','♫','♬']), 'mus');
  const sg = $('singer'); sg.classList.remove('bop'); void sg.offsetWidth; sg.classList.add('bop');
  $('tapme').hidden = true;
  if (S.kara.cheers >= ENCORE){
    S.tokens += 25; S.planks += 1;
    toast(`ENCORE! They ate that 🔥 +25 🎟️ +1 💎`);
    S.kara.cheers = 0;
    S.kara.song++;
    S.kara.who = pick(squadOf(townsfolk()).filter(k=>k!==S.kara.who));
  }
  renderStats();
  renderKaraoke();
  updateBadge();

}
function floatAt(x, y, text, cls){
  const f = document.createElement('div');
  f.className = 'float ' + cls; f.textContent = text;
  f.style.left = (x-18)+'px'; f.style.top = (y-20)+'px';
  $('stage').appendChild(f);

}
function updateBadges(){

/* ---------- level road map ---------- */
const LEVELS = CHAPTERS.flatMap((c,ci) => c.tasks.map((t,ti) => ({ ch:ci, t:ti, task:t,
  star: (t.scene.find(l => l[0] && l[0] !== 'letter') || ['imani'])[0] })));
const levelNow = () => Math.min(LEVELS.length, S.ch * 5 + S.task);
function lvPos(i){
  const row = Math.floor(i/3), col = i % 3;
  return [[62,180,298][row % 2 ? 2-col : col], 530 - row*96];
}
function renderMap(){
  const cur = levelNow(), pts = LEVELS.map((_,i) => lvPos(i)), top = [180, 52];
  const LINE = ['#e8261c','#ff8a1f','#3d7bff'];
  let o = `<defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="rgba(255,255,255,.05)" stroke-width="1"/></pattern></defs>
    <rect width="360" height="580" fill="url(#grid)"/>
    <path d="M0 470 C80 440 120 500 200 470 S320 430 360 455 V490 C300 470 240 520 180 500 S60 470 0 505Z" fill="#1d4ed8" opacity=".22"/>
    <text x="14" y="26" font-size="13" font-weight="800" fill="#f6e7c8" font-family="Barlow Condensed, Arial Narrow, sans-serif" letter-spacing="2">NORTHSIDE UNDERGROUND</text>
    <text x="14" y="40" font-size="10" fill="#a6a39b" font-family="Barlow, sans-serif">Ride the lines to save The Booth</text>`;
  // track: each chapter's stations on its own coloured line, joined to the next chapter
  CHAPTERS.forEach((c,ci) => {
    const seg = pts.slice(ci*5, ci*5+5).concat(ci < CHAPTERS.length-1 ? [pts[ci*5+5]] : [top]);
    const d = 'M' + seg.map(p => p.join(' ')).join(' L');
    o += `<path d="${d}" fill="none" stroke="#000" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="${d}" fill="none" stroke="${LINE[ci]}" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" opacity="${cur >= ci*5 ? 1 : .35}"/>`;
  });
  if (cur < LEVELS.length){
    const [x,y] = pts[cur], who = LEVELS[cur].star, left = x > 200;
    o += `<image href="${CUTS[who]}" x="${left ? x-102 : x+24}" y="${y-92}" width="78" height="104" preserveAspectRatio="xMidYMin meet"/>`;
  }
  CHAPTERS.forEach((c,ci) => {
    const label = `${['Red','Orange','Blue'][ci]} Line · ${c.title}`, w = Math.round(label.length * 5.6 + 26);
    const [x,y] = pts[ci*5], lx = Math.max(w/2 + 6, Math.min(354 - w/2, x));
    o += `<g><rect x="${lx - w/2}" y="${y-58}" width="${w}" height="20" rx="4" fill="#0e0e10" stroke="${LINE[ci]}" stroke-width="2"/>
      <rect x="${lx - w/2 + 6}" y="${y-52}" width="8" height="8" rx="2" fill="${LINE[ci]}"/>
      <text x="${lx + 6}" y="${y-44}" text-anchor="middle" font-size="11" font-weight="700" fill="#f6e7c8" font-family="Barlow Condensed, Arial Narrow, sans-serif">${label}</text></g>`;
  });
  LEVELS.forEach((L,i) => {
    const [x,y] = pts[i], done = i < cur, now = i === cur, col = LINE[L.ch];
    o += `<g data-lv="${i}" role="button" aria-label="Level ${i+1}: ${L.task.name}">
      ${now ? `<circle cx="${x}" cy="${y}" r="28" fill="#ff8a1f" opacity=".3" class="node-cur"/>` : ''}
      <circle cx="${x}" cy="${y}" r="${now?20:16}" fill="${done ? col : now ? '#ff8a1f' : '#f6e7c8'}" stroke="#000" stroke-width="4"/>
      <text x="${x}" y="${y+5}" text-anchor="middle" font-size="${now?16:13}" font-weight="800" font-family="Barlow Condensed, Arial Narrow, sans-serif" fill="${done ? (L.ch===1?'#000':'#fff') : now ? '#000' : '#6b6b6b'}">${done ? '✓' : i+1}</text>
      ${!done && !now ? `<text x="${x+12}" y="${y-10}" font-size="10">🔒</text>` : ''}</g>`;
  });
  const won = cur >= LEVELS.length;
  o += `<g data-lv="${LEVELS.length}"><rect x="${top[0]-26}" y="${top[1]-22}" width="52" height="44" rx="8" fill="${won ? '#ff8a1f' : '#f6e7c8'}" stroke="#000" stroke-width="4"/>
    <text x="${top[0]}" y="${top[1]+9}" text-anchor="middle" font-size="22">🏆</text>
    <text x="${top[0]+34}" y="${top[1]+5}" font-size="12" font-weight="800" fill="#ff8a1f" font-family="Barlow Condensed, Arial Narrow, sans-serif" letter-spacing="1">THE BOOTH</text></g>`;
  $('mapSvg').innerHTML = o;
  const p = $('mapPanel');
  if (won){
    p.innerHTML = `${portrait(PEOPLE.poppy)}<div class="d"><div class="k">All ${LEVELS.length} stops done 🏆</div><b>You saved The Booth. Periodt.</b><small>Keep serving to collect every bit of beef.</small></div><button class="btn" id="mapPlay">Replay</button>`;
    return;
  }
  const L = LEVELS[cur], can = S.stars >= L.task.cost;
  p.innerHTML = `${portrait(PEOPLE[L.star])}<div class="d"><div class="k">Stop ${cur+1} of ${LEVELS.length} · ${['Red','Orange','Blue'][L.ch]} Line</div><b>${L.task.name}</b>
    <small>${can ? `Ready! You have ⭐${S.stars}` : `Needs ⭐${L.task.cost}, you have ⭐${S.stars}. Serve artists or win battles.`}</small></div>
    <button class="btn ${can?'go':''}" id="mapPlay">Play ⭐${L.task.cost}</button>`;
}

function tapLevel(i){
  const cur = levelNow();
  if (i === cur) return doTask();
  if (i < cur && LEVELS[i]) return playScene(LEVELS[i].task.scene);
  if (i >= LEVELS.length) return toast(cur >= LEVELS.length ? 'The Booth is saved 🏆 Certified banger.' : 'Finish every level to save The Booth 🏆');

}

const tutWait = st => typeof st.wait === 'function' ? st.wait() : st.wait;
function tutEnter(){
  while (S.tut >= 0 && S.tut < TUT.length && TUT[S.tut].skip && TUT[S.tut].skip()) S.tut++;
  if (S.tut >= TUT.length){ S.tut = -1; }
  if (S.tut >= 0 && TUT[S.tut].enter){ TUT[S.tut].enter(); }
  save(); render(); tutPlace();
}
function tutNext(){
  if (S.tut < 0) return;
  if (TUT[S.tut].last){ S.tut = -1; save(); tutPlace(); toast("Tutorial done. You ate that 🔥"); return; }
  S.tut++; tutEnter();
}
function tutEvent(name){
  if (!S || S.tut < 0 || S.tut >= TUT.length) return;
  if (tutWait(TUT[S.tut]) === name) tutNext();
}
function tutPlace(){
  const hole = $('tutHole'), coach = $('tutCoach');
  const busy = $('layer').innerHTML.trim() !== '';
  if (!S || S.tut < 0 || S.tut >= TUT.length || busy || tab !== 'bar'){
    hole.hidden = coach.hidden = true;
    return;
  }
  const st = TUT[S.tut], els = (st.target ? st.target() : []).filter(Boolean);
  let midY = innerHeight * .6;
  if (els.length){
    const rs = els.map(e => e.getBoundingClientRect());
    const x1 = Math.min(...rs.map(r=>r.left)) - 6, y1 = Math.min(...rs.map(r=>r.top)) - 6;
    const x2 = Math.max(...rs.map(r=>r.right)) + 6, y2 = Math.max(...rs.map(r=>r.bottom)) + 6;
    Object.assign(hole.style, { left:x1+'px', top:y1+'px', width:(x2-x1)+'px', height:(y2-y1)+'px' });
    hole.hidden = false; midY = (y1+y2)/2;
  } else hole.hidden = true;
  const who = PEOPLE[st.who], wait = tutWait(st);
  coach.className = midY > innerHeight * .5 ? 'up' : 'down';
  coach.innerHTML = `${portrait(who)}<div class="cbody"><div class="cwho">${who.name} <span>${S.tut+1}/${TUT.length}</span></div><div class="ctext">${st.text}</div>
    <div class="crow"><button class="reset" id="tutSkip">Skip tour</button>${wait==='next'?`<button class="btn go" id="tutNextBtn">${st.last?'Let\'s go 💅':'Next ➜'}</button>`:'<span class="cdo">Your turn 👆</span>'}</div></div>`;
  coach.hidden = false;
  $('tutSkip').onclick = () => { S.tut = -1; save(); tutPlace(); };
  if ($('tutNextBtn')) $('tutNextBtn').onclick = tutNext;
}

/* ---------- the Battle tab: rap battles, Fill the Bar, and Hype ---------- */
let mode = 'battle', BT = null, FB = null, arenaTimer = null, pickingMc = false;
const stopTimer = () => { clearInterval(arenaTimer); arenaTimer = null; };
const shuffle = a => a.map(x => [Math.random(), x]).sort((p,q) => p[0]-q[0]).map(p => p[1]);
const twoLines = t => t.split(' / ').map(x => `<span>${x}</span>`).join('');
function setMode(m){
  mode = m; stopTimer();
  for (const k of ['battle','fill','hype']){ $(k+'Pane').hidden = k !== m; document.querySelector(`.mode[data-mode="${k}"]`).setAttribute('aria-selected', k === m); }
  if (m === 'hype'){ $('singer').dataset.who = ''; combo = 0; renderKaraoke(); }
  if (m === 'battle') renderBattle();
  if (m === 'fill') renderFill();
}
function runTimer(ms, barId, onEnd){
  stopTimer();
  const end = Date.now() + ms;
  arenaTimer = setInterval(() => {
    const left = end - Date.now(), bar = $(barId);
    if (bar) bar.style.width = Math.max(0, left / ms * 100) + '%';
    if (left <= 0){ stopTimer(); onEnd(); }
  }, 80);
}

/* rap battle */
function mcKey(){ if (!PEOPLE[S.mc]) S.mc = 'zara'; return S.mc; }
function renderBattle(){
  const P = $('battlePane'), mc = PEOPLE[mcKey()];
  S.beat ??= {};
  if (!BT){
    const keys = pickingMc ? Object.keys(PEOPLE) : Object.keys(PEOPLE).filter(k => k !== mc.key);
    P.innerHTML = `<div class="bsel">
      <div class="bhead">${portrait(mc)}<div class="bh-txt"><div class="k">Your MC</div><b>${mc.name}</b><small>${pickingMc ? 'Pick who raps for you' : 'Repping you in every battle'}</small></div>

      <div class="tape">${pickingMc ? 'Choose your MC' : 'Who are you battling?'}</div>
      <div class="bgrid">${keys.map(k => `<button class="bcard" data-opp="${k}">${portrait(PEOPLE[k], 'named')}
        ${pickingMc ? (k === mc.key ? '<span class="tag">YOU</span>' : '') : `<span class="tag">${'🔥'.repeat(BATTLES[k].diff)}</span>${S.beat[k] ? '<span class="crown">👑</span>' : ''}`}</button>`).join('')}</div>
      <div class="bnote">${pickingMc ? '' : `First win against someone: +1 ⭐ and 40 🎟️. Beaten ${Object.keys(S.beat).length} of ${Object.keys(PEOPLE).length - 1}.`}</div></div>`;
    $('pickMc').onclick = () => { pickingMc = !pickingMc; renderBattle(); };
    P.querySelectorAll('[data-opp]').forEach(b => b.onclick = () => {
      if (pickingMc){ S.mc = b.dataset.opp; pickingMc = false; save(); renderBattle(); toast(`${PEOPLE[S.mc].name} is your MC now 🎤`); return; }
      startBattle(b.dataset.opp);
    });
    return;
  }
  const opp = PEOPLE[BT.opp], R = BATTLES[BT.opp].rounds[BT.round];
  const meter = Math.max(4, Math.min(96, 50 + (BT.you - BT.them) * 6));
  let mid = '';
  if (BT.phase === 'pick'){
    mid = `<div class="spit them"><b>${opp.name}</b>${twoLines(R[0])}</div>
      <div class="bopts">${BT.opts.map((o,i) => `<button class="bopt" data-o="${i}">${twoLines(o[0])}</button>`).join('')}</div>
      <div class="btimer"><i id="btBar"></i></div>`;
  } else if (BT.phase === 'reveal'){
    const L = BT.last, cls = L.pts >= 3 ? 'fire' : L.pts > 0 ? 'mid' : 'flop';
    mid = `<div class="spit them small"><b>${opp.name}</b>${twoLines(R[0])}</div>
      <div class="spit you ${cls}"><b>${mc.name}</b>${L.line ? twoLines(L.line) : '<span>...(silence)</span>'}</div>
      <div class="react ${cls}">${L.react}<small>${mc.name} +${Math.max(0,L.pts)} · ${opp.name} +${L.theirs}</small></div>
      <button class="btn go" id="bNext">${BT.round >= 2 ? 'See who won 🏆' : 'Next round ➜'}</button>`;
  } else {
    const won = BT.you > BT.them, draw = BT.you === BT.them;
    mid = `<div class="bresult ${won ? 'won' : 'lost'}"><div class="big">${won ? 'YOU WON 👑' : draw ? 'DRAW 🤝' : 'YOU LOST 💀'}</div>
      <p>${won ? `${mc.name} sent ${opp.name} home. The crowd won't stop talking about it.` : draw ? 'Too close to call. Run it back?' : `${opp.name} took it this time. Rematch?`}</p>
      <div class="loot">${BT.loot}</div>
      <div class="row"><button class="btn" id="bBack">Pick someone else</button><button class="btn go" id="bAgain">Rematch 🔁</button></div></div>`;
  }
  P.innerHTML = `<div class="bfight">
    <div class="bvs"><div class="side you">${portrait(mc)}<b>${mc.name}</b><span class="pts">${BT.you}</span></div>
      <div class="vs">VS<small>${BT.phase === 'done' ? 'Final' : `Round ${BT.round+1}/3`}</small></div>
      <div class="side them">${portrait(opp)}<b>${opp.name}</b><span class="pts">${BT.them}</span></div></div>
    <div class="crowdbar" aria-label="Crowd"><i style="width:${meter}%"></i><span>CROWD</span></div>
    ${mid}</div>`;
  if (BT.phase === 'pick'){
    P.querySelectorAll('[data-o]').forEach(b => b.onclick = () => answerBattle(+b.dataset.o));
    runTimer(10000, 'btBar', () => answerBattle(-1));
  }
  if ($('bNext')) $('bNext').onclick = nextRound;
  if ($('bBack')) $('bBack').onclick = () => { BT = null; renderBattle(); };
  if ($('bAgain')) $('bAgain').onclick = () => startBattle(BT.opp);
}
function startBattle(k){
  BT = { opp:k, round:0, you:0, them:0, phase:'pick', opts:shuffle(BATTLES[k].rounds[0][1]) };
  renderBattle();
}
function answerBattle(i){
  if (!BT || BT.phase !== 'pick') return;
  stopTimer();
  const o = i >= 0 ? BT.opts[i] : [null, -2];
  const d = BATTLES[BT.opp].diff, theirs = d >= 3 ? 2 + rnd(2) : d === 2 ? 1 + rnd(3) : rnd(3);
  BT.you += Math.max(0, o[1]); BT.them += theirs;
  BT.last = { line:o[0], pts:o[1], theirs, react: i < 0 ? 'Too slow! ⏰' : pick(CROWD[o[1]]) };
  BT.phase = 'reveal';
  renderBattle();
}
function nextRound(){
  if (BT.round >= 2) return finishBattle();
  BT.round++; BT.phase = 'pick'; BT.opts = shuffle(BATTLES[BT.opp].rounds[BT.round][1]);
  renderBattle();
}
function finishBattle(){
  const won = BT.you > BT.them, mc = mcKey(), opp = BT.opp;
  let loot;
  if (won){
    S.tokens += 40; loot = '+40 🎟️';
    if (!S.beat[opp]){ S.beat[opp] = true; S.stars += 1; loot += ' · +1 ⭐ first win'; }
    battlePost(mc, opp);
  } else {
    S.tokens += 10; loot = '+10 🎟️ for showing up';
    if (BT.you < BT.them) battlePost(opp, mc);
  }
  BT.phase = 'done'; BT.loot = loot;
  save(); renderStats(); updateBadges(); renderBattle();
}
function battlePost(w, l){
  const W = PEOPLE[w].name, L = PEOPLE[l].name;
  const by = pick(Object.keys(PEOPLE).filter(k => k !== w && k !== l));
  const text = pick([
    `${W} just battled ${L} at The Booth and the crowd went MAD 🔥 ${L} is not okay 😭`,
    `Live from the cypher: ${W} vs ${L}. Not even close. ${W} took it 👑`,
    `${L} stepped to ${W} tonight. Big mistake. The whole block heard it 📢`,
    `${W} ended ${L}'s whole career tonight. Funeral's on Friday ⚰️ (they're fine)`,
    `Somebody check on ${L}. ${W} just took them APART in the cypher 💀`]);
  S.feed.unshift({ id:'b' + Date.now(), ts:Date.now(), liked:false, custom:{ by, about:l, text, replies:[
    [l, pick(['Rematch. Tomorrow. Bring tissues.','I was warming up.','The mic was broken. Allegedly.','My mum said I won.'])],
    [w, pick(['Any time 🎤',"Bars don't lie.",'Tell them I said hi 👋','Next.'])]] } });
  S.feedUnread++;
}
