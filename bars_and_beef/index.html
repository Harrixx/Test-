function playScene(lines, done){
  let k = 0;
  const step = () => {
    if (k >= lines.length){ closeLayer(); done && done(); return; }
    const [who, text] = lines[k++];
    let ava = '', name = '', cls = 'line';
    if (who===null){ cls += ' narr'; }
    else if (who==='letter'){ ava = `<div class="ava emoji" style="background:${ROSA.look.bg}">💾</div>`; name = 'A message from Ro'; cls += ' letter'; }
    else { const s = speaker(who); ava = portrait(s); name = s.name; }
    $('layer').innerHTML = `<div class="overlay" id="sceneOv"><div class="scene" role="dialog" aria-live="polite" tabindex="0">${ava}
      <div class="say">${name?`<div class="who">${name}</div>`:''}<div class="${cls}">${fmt(text)}</div>
      <div class="more">${k<lines.length?'Tap to continue':'Tap to close'}</div></div></div></div>`;
    const ov = $('sceneOv'); ov.onclick = step;
    tutPlace();
    ov.querySelector('.scene').focus();
    ov.onkeydown = e => { if (e.key==='Enter'||e.key===' '){ e.preventDefault(); step(); } };
  };
  step();
}
function chapterCard(kicker, title, sub, btn, done){
  $('layer').innerHTML = `<div class="overlay center"><div class="card chapter-card">
    <div class="cardlogo">${$('sign').innerHTML}</div>
    <div class="k">${kicker}</div><h2>${title}</h2><div class="squad">${squadOf(Object.keys(PEOPLE)).map(k=>avatar(PEOPLE[k])).join('')}</div><p>${sub}</p>
    <div class="row" style="justify-content:center"><button class="btn go" id="ccBtn">${btn}</button></div></div></div>`;
  $('ccBtn').onclick = () => { closeLayer(); done && done(); };
  tutPlace();
  $('ccBtn').focus();
}
function maybeIntro(){
  if (S.ch >= CHAPTERS.length || S.introSeen[S.ch]) return;
  const ch = CHAPTERS[S.ch];
  chapterCard(`Chapter ${S.ch+1}`, ch.title, `${ch.tasks.length} things on the to-do list. Serve artists to earn ⭐.`, "Let's go 💅", () => {
    playScene(ch.intro, () => { S.introSeen[S.ch]=true; save(); render(); });
  });
}
function doTask(){
  if (S.ch >= CHAPTERS.length){
    const all = CHAPTERS.flatMap((c,i)=>[[null, `Chapter ${i+1}: ${c.title}`], ...c.intro, ...c.tasks.flatMap(t=>t.scene)]);
    playScene(all); return;
  }
  const ch = CHAPTERS[S.ch], t = ch.tasks[S.task];
  if (S.stars < t.cost){ toast(`You need ${t.cost - S.stars} more ⭐. Go serve someone, bestie.`); return; }
  tutEvent('level');
  S.stars -= t.cost; S.task++;
  const lvDone = levelNow();
  const finished = S.task >= ch.tasks.length;
  save(); render();
  playScene(t.scene, () => {
    toast(`Level ${lvDone} complete! That's a banger, that 🔥`);
    if (tab==='map') renderMap();
    if (!finished) return;
    const wasLast = S.ch === CHAPTERS.length-1;
    S.ch++; S.task = 0; S.coins += 50; S.energy = Math.max(S.energy, eMax());
    ensureGens(true); fillPatrons(); save(); render();
    if (wasLast) chapterCard('The end', 'The Booth is saved', 'You finished the story and honestly? You ate. Artists keep coming and there is still beef to collect.', 'Keep making hits 🎧');
    else chapterCard(`Chapter ${S.ch}: ate and left no crumbs`, CHAPTERS[S.ch-1].title, 'Bonus: 💵50 and a full tank of ⚡. New sounds unlocked 👀', 'Next chapter, let\'s gooo', maybeIntro);
  });
}
function openRecipe(i){
  const p = S.patrons[i]; if (!p) return;
  const who = PEOPLE[p.who];
  const have = (c,t) => S.board.filter(b => b && !b.g && b.c===c && b.t===t).length;
  const blocks = p.order.map(o => {
    const C = CHAINS[o.c], [gE, gN] = C.gen, name = C.items[o.t][0];
    const best = [...Array(o.t+1).keys()].reverse().find(t => have(o.c,t) > 0);
    const ladder = C.items.slice(0, o.t+1).map((x,t) =>
      `<div class="rstep ${have(o.c,t)?'got':''} ${t===o.t?'goal':''}">${art(o.c,t)}<small>${x[0]}</small>${have(o.c,t)?`<i>×${have(o.c,t)} on board</i>`:''}</div>`
    ).join('<div class="rarrow">2× ➜</div>');
    const steps = [`<li>Tap the <b>${gE} ${gN}</b> to make a <b>${C.items[0][0]}</b>.</li>`]
      .concat(C.items.slice(1, o.t+1).map((x,k) => `<li>Drag two <b>${C.items[k][0]}</b> together to make a <b>${x[0]}</b>.</li>`));
    const status = have(o.c,o.t) ? `You've already got one. Hit Serve 💅`
      : best !== undefined ? `You've got a ${C.items[best][0]} already, so you're ${o.t-best} merge${o.t-best>1?'s':''} away.`
      : `Start from scratch: that's ${1<<o.t} taps for ${C.items[0][0]} in total.`;
    return `<div class="recipe"><div class="rname">${art(o.c,o.t)}<b>${name}</b></div>
      <div class="rladder">${ladder}</div><ol>${steps.join('')}</ol><p class="rstat">${status}</p>
      <button class="btn tok findgen" data-gen="${o.c}">Find the ${gE} ${gN}</button></div>`;
  }).join('');
  const ready = !!findCells(p.order);
  setTimeout(() => tutEvent('recipe'));
  $('layer').innerHTML = `<div class="overlay center"><div class="card recipecard">
    <div class="rhead">${portrait(who)}<div><div class="k">${who.name} · ${who.role}</div>
      <h2>“Yo, can you make me ${p.order.length>1?'these':'this'}? Here's how 👇”</h2></div></div>
    ${blocks}
    <div class="row" style="margin-top:10px">${ready?'<button class="btn" id="rServe">Serve now 💅</button>':''}<button class="btn go" id="rOk">Got it ✨</button></div></div></div>`;
  $('rOk').onclick = closeLayer;
  if (ready) $('rServe').onclick = () => { closeLayer(); serve(i); };
  document.querySelectorAll('.findgen').forEach(b => b.onclick = () => {
    const gi = S.board.findIndex(x => x && x.g === b.dataset.gen);
    closeLayer();
    if (gi < 0) return;
    sel = gi; render();
    const cell = document.querySelector(`[data-cell="${gi}"]`);
    if (cell){ cell.classList.add('flash'); setTimeout(()=>cell.classList.remove('flash'), 2400); }
  });
}
/* ---------- choose your artist ---------- */
let pickSel = null;
function openCharSelect(switching){
  pickSel = S.me || null;
  const draw = () => {
    $('layer').innerHTML = `<div class="overlay center"><div class="card pickcard-wrap">
      <div class="cardlogo">${$('sign').innerHTML}</div>
      <div class="tape">Choose your artist</div>
      <p class="picksub">${switching ? 'Switch who you play as. Your progress stays.' : "Pick who you are. You'll write, record, battle and fight your way from open mic to headliner."}</p>
      <div class="pickgrid">${Object.keys(PEOPLE).map(k => `<button class="pickcard ${pickSel===k?'on':''}" data-pick="${k}" aria-pressed="${pickSel===k}">
        ${portrait(PEOPLE[k])}<span class="pn"><b>${PEOPLE[k].name}</b><small>${PEOPLE[k].tag}</small></span></button>`).join('')}</div>
      <div class="row" style="justify-content:center;margin-top:12px">${switching ? '<button class="btn" id="pickCancel">Cancel</button>' : ''}
        <button class="btn go" id="pickGo" ${pickSel ? '' : 'disabled'}>${pickSel ? `Play as ${PEOPLE[pickSel].name} 🎤` : 'Pick an artist'}</button></div></div></div>`;
    document.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => { pickSel = b.dataset.pick; draw(); });
    if ($('pickCancel')) $('pickCancel').onclick = closeLayer;
    $('pickGo').onclick = () => {
      if (!pickSel) return;
      S.me = pickSel; S.kara.who = pickSel; BT = null;
      S.patrons = []; fillPatrons(); save(); closeLayer(); render(); updateBadges();
      toast(`You're ${PEOPLE[pickSel].name}. Let's get it 🎤`);
      if (!switching) maybeIntro();
    };
    tutPlace();
  };
  draw();
}
function openEnergy(){
  const cost = 40;
  $('layer').innerHTML = `<div class="overlay center"><div class="card">
    <h2>Running on empty? 😮‍💨</h2>
    <p>Energy comes back 1 every ${E_REGEN_MS/1000} seconds, and every serve gives you 2. Buy 50 ⚡ for 💵${cost}, or win battles on the Battle tab for 🎟️ tokens.</p>
    <div class="row"><button class="btn" id="eNo">Nah, I'm good</button><button class="btn tok" id="eKara">Battle 🎤</button><button class="btn go" id="eYes" ${S.coins<cost?'disabled':''}>Buy 50 ⚡</button></div></div></div>`;
  $('eNo').onclick = closeLayer;
  $('eKara').onclick = () => { closeLayer(); setTab('karaoke'); };
  $('eYes').onclick = () => { if (S.coins<cost) return; S.coins-=cost; S.energy+=50; save(); closeLayer(); render(); };
}
function openBook(){
  S.bookNew = false; save(); render();
  const total = Object.values(PEOPLE).reduce((s,p)=>s+p.gossip.length,0);
  const got = Object.values(S.heard).reduce((s,a)=>s+a.length,0);
  const body = Object.entries(PEOPLE).map(([k,p])=>{
    const heard = S.heard[k] || [];
    const lines = p.gossip.map((g,i)=> heard.includes(i) ? `<div class="gb-line">“${g}”</div>` : '').join('');
    const left = p.gossip.length - heard.length;
    const lockTxt = p.from > S.ch ? `Arrives in chapter ${p.from+1}.` : (left ? `${left} more beef to hear. Serve ${p.name} again.` : '');
    return `<div class="gb-who">${avatar(p)}<span>${p.name} <small>· ${p.role}</small></span></div>${lines}${lockTxt?`<div class="gb-line locked">${lockTxt}</div>`:''}`;
  }).join('');
  $('layer').innerHTML = `<div class="overlay center"><div class="card">
    <h2>The Beef Book 📓</h2><p>${got} of ${total} rumours collected. Everything said in the studio ends up in here. Everything.</p>
    ${body}
    <div class="row" style="margin-top:14px;justify-content:space-between"><button class="reset" id="bkReset">Start over</button><button class="btn" id="bkSwitch">Switch artist</button><button class="btn go" id="bkClose">Close</button></div></div></div>`;
  $('bkClose').onclick = closeLayer;
  $('bkReset').onclick = confirmReset;
  $('bkSwitch').onclick = () => openCharSelect(true);
}
function confirmReset(){
  $('layer').innerHTML = `<div class="overlay center"><div class="card">
    <h2>Start over? 😳</h2><p>Your board, cash, stars, tokens, ice, crib, story progress and beef will be wiped.</p>
    <div class="row"><button class="btn" id="rNo">Keep playing</button><button class="btn go" id="rYes">Start again</button></div></div></div>`;
  $('rNo').onclick = closeLayer;
  $('rYes').onclick = () => { S = freshState(); ensureGens(); sel=-1; save(); closeLayer(); render(); openCharSelect(false); };
}

/* ---------- input: tap & drag on the board ---------- */
let down = null, ghost = null;
const cellAt = (x,y) => { const el = document.elementFromPoint(x,y); const c = el && el.closest('[data-cell]'); return c ? +c.dataset.cell : -1; };
$('board').addEventListener('pointerdown', e => {
  const c = e.target.closest('[data-cell]'); if (!c) return;
  const i = +c.dataset.cell;
  down = { i, x:e.clientX, y:e.clientY, dragging:false };
  if (S.board[i]) $('board').setPointerCapture(e.pointerId);
});
$('board').addEventListener('pointermove', e => {
  if (!down || !S.board[down.i]) return;
  if (!down.dragging && Math.hypot(e.clientX-down.x, e.clientY-down.y) > 7){
    down.dragging = true;
    const b = S.board[down.i];
    ghost = document.createElement('div'); ghost.className='ghost';
    ghost.innerHTML = b.g ? genOf(b)[0] : art(b.c,b.t);
    document.body.appendChild(ghost);
    const it = document.querySelector(`[data-cell="${down.i}"] .item`); if (it) it.classList.add('dragging');
  }
  if (down.dragging){
    ghost.style.left = e.clientX+'px'; ghost.style.top = e.clientY+'px';
    document.querySelectorAll('.cell.target').forEach(x=>x.classList.remove('target'));
    const t = cellAt(e.clientX, e.clientY), a = S.board[down.i], b = t>=0 ? S.board[t] : null;
    if (t>=0 && t!==down.i && a && b && !a.g && !b.g && a.c===b.c && a.t===b.t && a.t<MAX_T)
      document.querySelector(`[data-cell="${t}"]`).classList.add('target');
  }
});
function endPointer(e, cancelled){
  if (!down) return;
  const d = down; down = null;
  if (ghost){ ghost.remove(); ghost = null; }
  if (d.dragging){
    const t = cancelled ? -1 : cellAt(e.clientX, e.clientY);
    if (t>=0) moveOrMerge(d.i, t); else render();
    return;
  }
  if (cancelled) return;
  const b = S.board[d.i];
  if (b && b.g){ sel = d.i; produce(d.i); return; }
  if (b){ sel = (sel===d.i) ? -1 : d.i; render(); return; }
  sel = -1; render();
}
$('board').addEventListener('pointerup', e => endPointer(e, false));
$('board').addEventListener('pointercancel', e => endPointer(e, true));

$('counter').addEventListener('click', e => {
  const b = e.target.closest('[data-serve]'); if (b) return serve(+b.dataset.serve);
  const h = e.target.closest('[data-how]'); if (h) openRecipe(+h.dataset.how);
});
$('taskBtn').onclick = doTask;
$('bookBtn').onclick = openBook;
$('helpBtn').onclick = () => { setTab('bar'); S.tut = 0; save(); tutEnter(); };
window.addEventListener('resize', () => tutPlace());
$('stEnergy').onclick = openEnergy;

$('tabBar').onclick = () => setTab('bar');
$('tabKaraoke').onclick = () => setTab('karaoke');
document.querySelectorAll('.mode').forEach(b => b.onclick = () => setMode(b.dataset.mode));
$('tabFeed').onclick = () => setTab('feed');
$('tabHome').onclick = () => setTab('home');
$('tabMap').onclick = () => setTab('map');
$('storyTxt').onclick = () => setTab('map');
$('mapSvg').addEventListener('click', e => { const n = e.target.closest('[data-lv]'); if (n) tapLevel(+n.dataset.lv); });
$('mapPanel').addEventListener('click', e => { if (e.target.closest('#mapPlay')) doTask(); });
$('feedList').addEventListener('click', e => { const b = e.target.closest('[data-like]'); if (b) like(b.dataset.like); });
$('homeList').addEventListener('click', e => { const b = e.target.closest('[data-up]'); if (b) upgradeHome(b.dataset.up); });
$('room').addEventListener('click', e => { const f = e.target.closest('[data-fx]'); if (f){ homeSel = f.dataset.fx; renderHome(); document.querySelector(`.hrow[data-row="${homeSel}"]`)?.scrollIntoView({block:'nearest', behavior:'smooth'}); } });
$('stage').addEventListener('pointerdown', e => { e.preventDefault(); cheer(e); });
$('stage').addEventListener('keydown', e => { if (e.key===' '||e.key==='Enter'){ e.preventDefault(); cheer({}); } });
$('stage').tabIndex = 0;
$('shopList').addEventListener('click', e => { const b = e.target.closest('[data-buy]'); if (b) buy(b.dataset.buy); });

/* ---------- no zooming on phones ---------- */
document.addEventListener('dblclick', e => e.preventDefault(), { passive:false });
['gesturestart','gesturechange'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive:false }));

/* ---------- boot ---------- */
function start(data){
  S = migrate((data && data.state) || load() || freshState());
  ensureGens(); fillPatrons();
  if (!S.feed.length){ unlockPost(); unlockPost(); }
  // a link ending in #tutorial always starts the guided tour
  let wantTour = false;
  try { wantTour = location.hash.replace('#','').toLowerCase() === 'tutorial'; } catch(e){}
  if (wantTour){ S.tut = 0; tab = 'bar'; try { history.replaceState(null, '', location.pathname + location.search); } catch(e){} }
  save(); render(); updateBadges();
  if (!S.me) openCharSelect(false); else maybeIntro();
  if (wantTour && S.me && S.introSeen[S.ch]) tutEnter();
  setInterval(()=>{ const before = S.energy; tickEnergy(); if (S.energy!==before){ $('vEnergy').textContent=S.energy; save(); } renderTimer(); }, 1000);
}
window.claude?.hot?.snapshot?.(() => ({ state:S }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
