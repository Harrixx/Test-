<title>Mad Gossip</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Monoton&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Caveat:wght@600&display=swap">
<style>
/* Layout: one-screen phone app with two tabs. Bar: neon sign, counter of patrons, fix-up strip, merge board, info tray. Karaoke: a stage you tap for tokens, plus a token shop. Single dark look: a harbour pub after dark. */
:root{
  --night:#170d10;      /* page ground, deep oxblood */
  --wood:#2c1914;       /* counter + panels */
  --wood-hi:#3d241b;    /* raised surfaces */
  --cell:#21130f;       /* board cells */
  --cream:#f4e6d4;      /* text */
  --muted:#b59a86;      /* secondary text */
  --neon:#ff5f9e;       /* neon pink accent */
  --amber:#ffb547;      /* coins, stars, warm light */
  --mint:#62e8c0;       /* "ready to serve" */
  --violet:#a98bff;     /* tokens */
  --line:rgba(244,230,212,.12);
  --f-sign:"Monoton", "Bricolage Grotesque", system-ui, sans-serif;
  --f-ui:"Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-hand:"Caveat", "Comic Sans MS", cursive;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--cream);font-family:var(--f-ui);font-size:15px;
  background-image:radial-gradient(120% 60% at 50% -10%, rgba(255,95,158,.12), transparent 60%);
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.app{max-width:460px;margin:0 auto;padding:10px 16px calc(84px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.view{display:flex;flex-direction:column;gap:10px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.sign{font-family:var(--f-sign);font-weight:400;font-size:22px;line-height:1;color:var(--neon);letter-spacing:.02em;margin:0;
  text-shadow:0 0 6px rgba(255,95,158,.8),0 0 18px rgba(255,95,158,.5)}
.sign.flicker{animation:flicker 3.2s infinite}
@keyframes flicker{0%,18%,22%,60%,64%,100%{opacity:1}20%,62%{opacity:.25;text-shadow:none}}
.stats{display:flex;gap:5px;flex-wrap:wrap}
.stat{display:flex;align-items:center;gap:3px;background:var(--wood);border:1px solid var(--line);border-radius:999px;padding:3px 8px 3px 6px;font-weight:600;font-variant-numeric:tabular-nums;font-size:13px}
.stat small{font-size:10px;color:var(--muted);font-weight:400;margin-left:2px}
.stat.energy{cursor:pointer}
.stat.tok{color:var(--violet)}

/* caricature avatars */
.ava{width:52px;height:52px;border-radius:50%;overflow:hidden;flex:none;box-shadow:0 0 0 2px rgba(0,0,0,.35),0 4px 10px rgba(0,0,0,.35);background:var(--wood)}
.ava svg{display:block;width:100%;height:100%}
.ava.emoji{display:grid;place-items:center;font-size:26px}

/* counter */
.counter{background:linear-gradient(var(--wood-hi),var(--wood));border:1px solid var(--line);border-radius:14px;padding:10px 6px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;
  box-shadow:inset 0 -6px 0 rgba(0,0,0,.25)}
.patron{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;position:relative;transition:transform .35s, opacity .35s}
.patron.leaving{transform:translateY(-14px);opacity:0}
.patron.arriving{animation:arrive .4s ease-out}
@keyframes arrive{from{transform:translateY(12px);opacity:0}}
.pname{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.order{display:flex;gap:3px}
.chip{position:relative;width:32px;height:32px;border-radius:9px;background:var(--cell);border:1px solid var(--line);display:grid;place-items:center;font-size:19px}
.chip.have{border-color:var(--mint);box-shadow:0 0 8px rgba(98,232,192,.35)}
.chip.have::after{content:"✓";position:absolute;right:-5px;top:-6px;background:var(--mint);color:var(--night);font-size:10px;font-weight:800;width:14px;height:14px;border-radius:50%;display:grid;place-items:center}
.serve{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:var(--wood);color:var(--muted);border:1px solid var(--line)}
.serve.ready{background:var(--mint);color:var(--night);border-color:transparent;animation:nudge 1.6s infinite}
@keyframes nudge{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.reward{font-size:10px;color:var(--amber);font-variant-numeric:tabular-nums;white-space:nowrap}

/* fix-up strip */
.story{display:flex;align-items:center;gap:10px;background:var(--wood);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.story .txt{flex:1;min-width:0}
.story .ch{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.story .task{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{font-weight:800;padding:8px 12px;border-radius:10px;background:var(--wood-hi);border:1px solid var(--line);white-space:nowrap}
.btn.go{background:var(--amber);color:var(--night);border-color:transparent}
.btn.tok{background:var(--violet);color:var(--night);border-color:transparent}
.btn[disabled]{opacity:.4;cursor:default}
.book{font-size:20px;padding:6px 8px;position:relative}
.book .dot{position:absolute;top:2px;right:2px;width:9px;height:9px;border-radius:50%;background:var(--neon);box-shadow:0 0 6px var(--neon)}

/* board */
.board{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:#0f0809;padding:6px;border-radius:14px;border:1px solid var(--line);touch-action:none}
.cell{aspect-ratio:1;max-width:100%;background:var(--cell);border-radius:9px;display:grid;place-items:center;position:relative}
.cell.sel{box-shadow:0 0 0 2px var(--amber) inset}
.cell.target{box-shadow:0 0 0 2px var(--mint) inset;background:#1d2420}
.item{font-size:min(6.8vw,28px);line-height:1;position:relative;display:grid;place-items:center;width:100%;height:100%;cursor:grab}
.item.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.18)}100%{transform:scale(1)}}
.item.dragging{opacity:.25}
.pips{position:absolute;bottom:3px;left:0;right:0;display:flex;justify-content:center;gap:2px}
.pips i{width:4px;height:4px;border-radius:50%;background:var(--amber);opacity:.85}
.cell.wanted::before{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--mint);box-shadow:0 0 5px var(--mint)}
.gen .item{background:radial-gradient(circle,rgba(255,95,158,.22),transparent 70%);border-radius:9px;box-shadow:0 0 0 1.5px rgba(255,95,158,.55) inset}
.gen .item::after{content:"TAP";position:absolute;bottom:2px;font-size:8px;font-weight:800;letter-spacing:.1em;color:var(--neon)}
.gen.locked .item{filter:grayscale(1) brightness(.55);box-shadow:0 0 0 1px var(--line) inset;background:none}
.gen.locked .item::after{content:attr(data-lock);color:var(--muted);filter:none}
.ghost{position:fixed;pointer-events:none;z-index:50;font-size:36px;transform:translate(-50%,-60%);filter:drop-shadow(0 6px 8px rgba(0,0,0,.5))}

/* info tray */
.tray{min-height:58px;background:var(--wood);border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:flex;align-items:center;gap:10px}
.tray .big{font-size:28px}
.tray .meta{flex:1;min-width:0}
.tray .nm{font-weight:600}
.tray .ladder{font-size:15px;letter-spacing:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tray .ladder b{filter:drop-shadow(0 0 4px var(--amber))}
.tray .ladder span{opacity:.35}
.tray .hint{color:var(--muted);font-size:13px}

/* karaoke */
.stage{position:relative;height:340px;border-radius:16px;overflow:hidden;border:1px solid var(--line);cursor:pointer;touch-action:manipulation;
  background:
    radial-gradient(50% 60% at 50% 38%, rgba(255,230,180,.28), transparent 70%),
    repeating-linear-gradient(90deg, #5a0f22 0 18px, #470b1b 18px 36px)}
.stage::after{content:"";position:absolute;left:0;right:0;bottom:0;height:84px;background:linear-gradient(#3a2117,#24140f);border-top:3px solid #6b3f22}
.spot{position:absolute;left:50%;top:-20px;width:220px;height:300px;transform:translateX(-50%);background:conic-gradient(from 160deg at 50% 0, transparent 0 8deg, rgba(255,240,200,.14) 8deg 32deg, transparent 32deg);pointer-events:none}
.singer{position:absolute;left:50%;top:60px;width:150px;transform:translateX(-50%);z-index:2;pointer-events:none;transform-origin:50% 100%}
.singer .ava{width:150px;height:150px;box-shadow:0 0 0 4px rgba(255,181,71,.6),0 0 40px rgba(255,181,71,.35)}
.singer.bop{animation:bop .22s ease-out}
@keyframes bop{50%{transform:translateX(-50%) scale(1.05) rotate(-3deg)}}
.mic{position:absolute;left:calc(50% + 46px);top:170px;font-size:34px;z-index:3;pointer-events:none;transform:rotate(-20deg)}
.songcard{position:absolute;left:12px;top:12px;right:12px;z-index:3;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.songcard .now{background:rgba(0,0,0,.45);border-radius:10px;padding:6px 10px;min-width:0}
.songcard .k{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--amber)}
.songcard .t{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.combo{background:rgba(0,0,0,.45);border-radius:10px;padding:6px 10px;text-align:right;flex:none}
.combo b{font-size:20px;color:var(--violet);font-variant-numeric:tabular-nums}
.crowd{position:absolute;left:0;right:0;bottom:6px;z-index:4;display:flex;justify-content:center;gap:2px;pointer-events:none}
.crowd .ava{width:56px;height:56px;margin-bottom:-14px}
.crowd .ava:nth-child(odd){animation:sway 1.4s ease-in-out infinite}
.crowd .ava:nth-child(even){animation:sway 1.4s ease-in-out infinite reverse}
@keyframes sway{50%{transform:translateY(-6px) rotate(4deg)}}
.float{position:absolute;z-index:6;pointer-events:none;font-weight:800;color:var(--violet);font-size:20px;text-shadow:0 2px 6px rgba(0,0,0,.6);animation:rise .9s ease-out forwards}
.float.note{color:var(--amber);font-size:22px}
@keyframes rise{to{transform:translateY(-80px) scale(1.2);opacity:0}}
.tapme{position:absolute;left:0;right:0;top:232px;text-align:center;z-index:3;font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--cream);opacity:.8;pointer-events:none}
.meter{height:8px;background:var(--cell);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--neon));width:0;transition:width .15s}
.meterrow{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:4px}
.shop{background:var(--wood);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.shop h2{margin:0;font-size:17px}
.shop p{margin:0;color:var(--muted);font-size:13px}
.sitem{display:flex;align-items:center;gap:10px}
.sitem .ic{font-size:26px;width:36px;text-align:center}
.sitem .d{flex:1;min-width:0}
.sitem .d b{display:block}
.sitem .d span{font-size:12px;color:var(--muted)}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(23,13,16,.94);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:6px 16px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:8px}
.tab{flex:1;max-width:200px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px;border-radius:12px;color:var(--muted);font-size:12px;font-weight:600;position:relative}
.tab .i{font-size:22px}
.tab[aria-selected="true"]{color:var(--cream);background:var(--wood)}
.tab .badge{position:absolute;top:2px;left:calc(50% + 10px);background:var(--violet);color:var(--night);font-size:10px;font-weight:800;padding:1px 6px;border-radius:999px;font-variant-numeric:tabular-nums}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--cream);color:var(--night);font-weight:600;padding:8px 14px;border-radius:999px;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1}

/* gossip note pinned after serving */
.note{position:fixed;left:50%;top:calc(90px + env(safe-area-inset-top,0px));transform:translateX(-50%) rotate(-1.5deg);width:min(360px,calc(100% - 40px));background:#fff4c9;color:#2a1a10;border-radius:4px;padding:10px 14px 10px;z-index:55;box-shadow:0 10px 30px rgba(0,0,0,.5);font-family:var(--f-hand);font-size:22px;line-height:1.15;animation:pin .3s ease-out;display:flex;gap:10px;align-items:flex-start}
.note .ava{width:44px;height:44px}
.note .who{font-family:var(--f-ui);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#8a5a3a;margin-bottom:4px;display:flex;justify-content:space-between;gap:6px}
.note .new{color:#c2185b;font-weight:800}
@keyframes pin{from{transform:translateX(-50%) rotate(-8deg) scale(.8);opacity:0}}

/* overlays */
.overlay{position:fixed;inset:0;background:rgba(10,5,7,.72);z-index:70;display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.overlay.center{align-items:center}
.scene{width:min(440px,100%);background:var(--wood-hi);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;gap:12px;cursor:pointer;animation:arrive .25s ease-out}
.scene .ava{width:72px;height:72px}
.scene .say{flex:1;min-width:0}
.scene .who{font-weight:800;color:var(--amber);font-size:13px;letter-spacing:.04em}
.scene .line{font-size:17px;line-height:1.4;margin-top:2px;text-wrap:pretty}
.scene .line.narr{font-style:italic;color:var(--muted)}
.scene .line.letter{font-family:var(--f-hand);font-size:23px;color:var(--cream)}
.scene .more{font-size:11px;color:var(--muted);text-align:right;margin-top:6px}
.card{width:min(440px,100%);max-height:80vh;overflow:auto;background:var(--wood-hi);border:1px solid var(--line);border-radius:16px;padding:16px}
.card h2{margin:0 0 4px;font-size:20px;text-wrap:balance}
.card p{margin:4px 0 12px;color:var(--muted);line-height:1.45}
.card .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.gb-who{display:flex;align-items:center;gap:10px;margin:16px 0 6px;font-weight:800}
.gb-who .ava{width:40px;height:40px}
.gb-who small{color:var(--muted);font-weight:400}
.gb-line{font-family:var(--f-hand);font-size:20px;line-height:1.2;padding:4px 0 4px 50px;color:var(--cream)}
.gb-line.locked{font-family:var(--f-ui);font-size:13px;color:var(--muted);opacity:.6}
.chapter-card{text-align:center}
.chapter-card .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--neon)}
.chapter-card h2{font-size:26px;margin:6px 0}
.reset{font-size:12px;color:var(--muted);text-decoration:underline;padding:4px;align-self:center}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<div class="app">
  <header class="top">
    <h1 class="sign" id="sign">Mad Gossip</h1>
    <div class="stats">
      <button class="stat energy" id="stEnergy" aria-label="Energy">⚡<span id="vEnergy">100</span><small id="vTimer"></small></button>
      <div class="stat" aria-label="Coins">🪙<span id="vCoins">0</span></div>
      <div class="stat" aria-label="Stars">⭐<span id="vStars">0</span></div>
      <div class="stat tok" aria-label="Tokens">🎟️<span id="vTokens">0</span></div>
    </div>
  </header>

  <div class="view" id="barView">
    <section class="counter" id="counter" aria-label="Customers at the bar"></section>
    <section class="story">
      <div class="txt">
        <div class="ch" id="chLabel"></div>
        <div class="task" id="taskLabel"></div>
      </div>
      <button class="btn go" id="taskBtn"></button>
      <button class="book" id="bookBtn" aria-label="Gossip book">📒<span class="dot" id="bookDot" hidden></span></button>
    </section>
    <section class="board" id="board" aria-label="Bar board"></section>
    <section class="tray" id="tray"></section>
    <button class="reset" id="resetBtn">Start a new game</button>
  </div>

  <div class="view" id="karaokeView" hidden>
    <section class="stage" id="stage" aria-label="Karaoke stage. Tap to cheer and earn tokens.">
      <div class="spot"></div>
      <div class="songcard">
        <div class="now"><div class="k">Now singing</div><div class="t" id="songTitle"></div></div>
        <div class="combo"><div class="k" style="font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--amber)">Cheer</div><b id="comboMult">×1</b></div>
      </div>
      <div class="singer" id="singer"></div>
      <div class="mic">🎤</div>
      <div class="tapme" id="tapme">Tap the stage to cheer</div>
      <div class="crowd" id="crowd"></div>
    </section>
    <div>
      <div class="meterrow"><span id="encoreLabel">Encore in 60 cheers</span><span>Tap fast for ×2 and ×3</span></div>
      <div class="meter"><i id="encoreBar"></i></div>
    </div>
    <section class="shop">
      <div><h2>Token shop</h2><p>The crowd tips in 🎟️ tokens. Spend them on the bar.</p></div>
      <div id="shopList" style="display:flex;flex-direction:column;gap:10px"></div>
    </section>
  </div>
</div>

<nav class="tabs" role="tablist">
  <button class="tab" role="tab" id="tabBar" aria-selected="true"><span class="i">🍺</span>Bar</button>
  <button class="tab" role="tab" id="tabKaraoke" aria-selected="false"><span class="i">🎤</span>Karaoke<span class="badge" id="tokBadge" hidden></span></button>
</nav>
<div class="toast" id="toast"></div>
<div id="layer"></div>

<script>
(() => {
'use strict';
const COLS = 7, ROWS = 9, N = COLS * ROWS;
const E_MAX = 100, E_REGEN_MS = 20000;
const SAVE_KEY = 'gossipbar.v1';

/* ---------- caricatures (drawn as SVG) ---------- */
function shade(hex, a){
  const n = parseInt(hex.slice(1),16), ch = [n>>16, n>>8&255, n&255];
  return '#' + ch.map(v => Math.max(0,Math.min(255,Math.round(a<0 ? v*(1+a) : v+(255-v)*a)))).map(v=>v.toString(16).padStart(2,'0')).join('');
}
function face(L){
  const s = L.skin, sd = shade(s,-.18), h = L.hair || '#333', ink = '#2a1712';
  const ey = 44, eyeL = 39, eyeR = 61;
  let o = `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect width="100" height="100" fill="${L.bg}"/>`;
  // hair behind the head
  if (L.hairStyle==='long') o += `<path d="M18 44 Q12 80 22 98 L78 98 Q88 80 82 44 Z" fill="${h}"/>`;
  if (L.hairStyle==='pony') o += `<path d="M72 26 Q96 46 84 86 Q80 62 68 42Z" fill="${h}"/>`;
  if (L.hairStyle==='bouffant') o += `<ellipse cx="50" cy="44" rx="42" ry="34" fill="${h}"/>`;
  // body + neck
  o += `<path d="M8 100 Q10 80 50 78 Q90 80 92 100 Z" fill="${L.shirt}"/>`;
  o += `<rect x="43" y="64" width="14" height="16" fill="${sd}"/>`;
  const acc = L.acc;
  if (acc==='dogcollar') o += `<path d="M38 79 Q50 84 62 79 L62 83 Q50 88 38 83Z" fill="#fff"/><rect x="47" y="80" width="6" height="5" fill="#fff"/>`;
  if (acc==='chain') o += `<path d="M28 84 Q50 100 72 84" stroke="#e8b830" stroke-width="3.5" fill="none" stroke-dasharray="3 1.5"/><circle cx="50" cy="93" r="5" fill="#e8b830" stroke="#a87c10"/>`;
  if (acc==='pearls') o += [30,36,42,50,58,64,70].map((x,i)=>`<circle cx="${x}" cy="${83+[0,2.5,4,5,4,2.5,0][i]}" r="2.3" fill="#f6f1e6"/>`).join('');
  if (acc==='whistle') o += `<path d="M40 79 L52 92" stroke="#f2f2f2" stroke-width="1.5"/><rect x="50" y="90" width="9" height="5" rx="2" fill="#c0c4c8"/>`;
  if (acc==='scrubs') o += `<path d="M40 79 L50 90 L60 79" stroke="${shade(L.shirt,-.3)}" stroke-width="2.5" fill="none"/>`;
  if (acc==='collarup') o += `<path d="M30 82 L42 72 L46 84Z M70 82 L58 72 L54 84Z" fill="${shade(L.shirt,.15)}"/>`;
  // ears

const SHOP = [
  { id:'energy',  ic:'⚡', name:'Power nap',          desc:'+30 energy',                                 cost:120 },
  { id:'reroll',  ic:'🔄', name:'Round on the house', desc:'Every customer orders something new',        cost:80 },
  { id:'crate',   ic:'📦', name:'Mystery delivery',   desc:'A random level 3 item lands on the board',  cost:200 },
  { id:'upgrade', ic:'✨', name:'Golden glass',       desc:'Upgrade the item selected on the bar by one level', cost:250 },
  { id:'star',    ic:'⭐', name:'Rave review',        desc:'+1 star for the fix-up list',                cost:400 },
];

/* ---------- state ---------- */
let S;
function freshState(){
  const board = Array(N).fill(null);
  [[49,'brew',0],[50,'brew',0],[51,'fruit',0],[44,'fruit',0],[53,'snack',0],[46,'snack',0],[54,'coffee',0],[47,'coffee',0]].forEach(([i,c,t])=>board[i]={c,t});
  return { board, energy:E_MAX, eTs:Date.now(), coins:20, stars:0, tokens:0, served:0,
    ch:0, task:0, introSeen:{}, patrons:[], heard:{}, bookNew:false,
    kara:{ who:'dina', song:0, cheers:0 } };
}
function load(){
  try { const raw = localStorage.getItem(SAVE_KEY); if (raw) return JSON.parse(raw); } catch(e){}
  return null;
}
function save(){ try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch(e){} }
function migrate(s){
  while (s.board.length < N) s.board.push(null);
  s.tokens ??= 0;
  s.kara ??= { who:'dina', song:0, cheers:0 };
  s.patrons = (s.patrons||[]).filter(p => PEOPLE[p.who]);
  return s;
}

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const rnd = n => Math.floor(Math.random()*n);
const pick = a => a[rnd(a.length)];
const itemOf = it => CHAINS[it.c].items[it.t];
const genOf = it => CHAINS[it.g].gen;
const unlocked = c => CHAINS[c].unlock <= S.ch;
const speaker = k => k==='rosa' ? ROSA : PEOPLE[k];
function avatar(p){ return `<div class="ava">${face(p.look)}</div>`; }
let toastT;
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),2000); }

/* ---------- generators ---------- */
function ensureGens(announce){
  for (const c of Object.keys(CHAINS)){
    let i = S.board.findIndex(b => b && b.g===c);
    if (i < 0){
      const home = CHAINS[c].home;
      i = S.board[home] ? nearestEmpty(home) : home;
      if (i < 0) continue; // board full; try again next time
      S.board[i] = { g:c };
    }
    const was = S.board[i].locked;
    S.board[i].locked = !unlocked(c);
    if (announce && was && !S.board[i].locked) toast(`New on the menu: ${CHAINS[c].gen[1]} unlocked`);
  }
}

/* ---------- energy ---------- */
function tickEnergy(){
  const now = Date.now();
  if (S.energy >= E_MAX){ S.eTs = now; return; }
  const gained = Math.floor((now - S.eTs)/E_REGEN_MS);
  if (gained > 0){ S.energy = Math.min(E_MAX, S.energy + gained); S.eTs += gained*E_REGEN_MS; if (S.energy>=E_MAX) S.eTs = now; }
}

/* ---------- patrons & orders ---------- */
const SEATS = 4;
function townsfolk(){ return Object.keys(PEOPLE).filter(k => PEOPLE[k].from <= S.ch); }
function availablePeople(){
  const here = new Set(S.patrons.map(p=>p.who));
  return townsfolk().filter(k => !here.has(k));
}
function makeOrder(){
  const cap = Math.min(MAX_T, 1 + Math.floor(S.served/3));
  const count = S.served < 3 ? 1 : (Math.random() < .45 ? 2 : 1);
  const chains = Object.keys(CHAINS).filter(unlocked);
  const order = [];
  for (let i=0;i<count;i++){
    const c = pick(chains);
    const t = Math.max(1, Math.min(cap, 1 + rnd(cap) - (Math.random()<.4 && cap>2 ? 1 : 0)));
    order.push({c,t});
  }
  const val = order.reduce((s,o)=>s + (1<<o.t), 0);
  return { order, coins: 4 + val*3, stars: val >= 12 ? 2 : 1 };
}
function newPatron(){
  const pool = availablePeople(); if (!pool.length) return null;
  return { who: pick(pool), ...makeOrder(), fresh:true };
}
function fillPatrons(){ while (S.patrons.length < SEATS){ const p = newPatron(); if(!p) break; S.patrons.push(p); } }

function findCells(order){
  const used = new Set(), cells = [];
  for (const o of order){
    let found = -1;
    for (let i=0;i<N;i++){ const b=S.board[i]; if (b && !b.g && b.c===o.c && b.t===o.t && !used.has(i)){ found=i; break; } }
    if (found<0) return null;
    used.add(found); cells.push(found);
  }
  return cells;
}

/* ---------- rendering ---------- */
let sel = -1, popAt = -1, tab = 'bar';

function renderStats(){
  $('vEnergy').textContent = S.energy;
  $('vCoins').textContent = S.coins;
  $('vStars').textContent = S.stars;
  $('vTokens').textContent = S.tokens;
  renderTimer();
}
function render(){
  tickEnergy();
  renderStats();
  $('sign').classList.toggle('flicker', S.ch===0 && S.task<2);
  if (tab==='karaoke'){ renderKaraoke(); return; }

  const wanted = new Set();
  $('counter').innerHTML = S.patrons.map((p,i)=>{
    const who = PEOPLE[p.who];
    const cells = findCells(p.order);
    const chips = p.order.map(o=>{
      const ok = S.board.some(b=>b && !b.g && b.c===o.c && b.t===o.t);
      if (ok) S.board.forEach((b,j)=>{ if(b && !b.g && b.c===o.c && b.t===o.t) wanted.add(j); });
      const [e,n] = CHAINS[o.c].items[o.t];
      return `<div class="chip ${ok?'have':''}" title="${n}">${e}</div>`;
    }).join('');
    return `<div class="patron ${p.fresh?'arriving':''}" data-i="${i}">
      ${avatar(who)}<div class="pname">${who.name}</div>
      <div class="order">${chips}</div>
      <button class="serve ${cells?'ready':''}" data-serve="${i}" ${cells?'':'aria-disabled="true"'}>${cells?'Serve':'Waiting'}</button>
      <div class="reward">🪙${p.coins} · ⭐${p.stars}</div></div>`;
  }).join('');
  S.patrons.forEach(p=>delete p.fresh);

  if (S.ch < CHAPTERS.length){
    const ch = CHAPTERS[S.ch], t = ch.tasks[S.task];
    $('chLabel').textContent = `Chapter ${S.ch+1} · ${ch.title} · ${S.task+1}/${ch.tasks.length}`;
    $('taskLabel').textContent = t.name;
    $('taskBtn').textContent = `⭐ ${t.cost}`;
    $('taskBtn').classList.toggle('go', S.stars >= t.cost);
  } else {
    $('chLabel').textContent = 'The Gull is saved';
    $('taskLabel').textContent = 'Keep pouring. Keep listening.';
    $('taskBtn').textContent = 'Replay';
    $('taskBtn').classList.remove('go');
  }
  $('bookDot').hidden = !S.bookNew;

  const html = [];
  for (let i=0;i<N;i++){
    const b = S.board[i];
    let inner = '', cls = 'cell';
    if (b && b.g){
      cls += ' gen' + (b.locked ? ' locked' : '');
      inner = `<div class="item" data-lock="CH ${CHAINS[b.g].unlock+1}">${genOf(b)[0]}</div>`;
    } else if (b){
      inner = `<div class="item ${i===popAt?'pop':''}">${itemOf(b)[0]}<span class="pips">${'<i></i>'.repeat(b.t+1)}</span></div>`;
      if (wanted.has(i)) cls += ' wanted';
    }
    if (i===sel) cls += ' sel';
    html.push(`<div class="${cls}" data-cell="${i}">${inner}</div>`);
  }
  $('board').innerHTML = html.join('');
  popAt = -1;
  renderTray();
}

function renderTimer(){
  if (S.energy >= E_MAX){ $('vTimer').textContent=''; return; }
  const left = Math.max(0, E_REGEN_MS - (Date.now()-S.eTs));
  $('vTimer').textContent = `${Math.ceil(left/1000)}s`;
}

const HINTS = [
  'Tap a glowing machine to make something. Each tap uses 1 ⚡.',
  'Drag two matching items together to merge them into something better.',
  'A green dot means a customer wants that item. Hit Serve.',
  'Spend ⭐ on the fix-up list to hear what happens next.',
  'Out of energy? Cheer the singers on the Karaoke tab to earn 🎟️ tokens.',
];
function renderTray(){
  const b = sel>=0 ? S.board[sel] : null;
  if (!b){
    $('tray').innerHTML = `<div class="meta"><div class="hint">${HINTS[Math.min(S.served, HINTS.length-1)]}</div></div>`;
    return;
  }
  if (b.g){
    const [e,n] = genOf(b);
    const ladder = CHAINS[b.g].items.map(x=>x[0]).join('');
    const sub = b.locked ? `<div class="hint">Unlocks in chapter ${CHAINS[b.g].unlock+1}</div>` : `<div class="ladder">${ladder}</div>`;
    $('tray').innerHTML = `<div class="big">${e}</div><div class="meta"><div class="nm">${n}</div>${sub}</div>`;
    return;
  }
  const [e,n] = itemOf(b);
  const ladder = CHAINS[b.c].items.map((x,t)=> t===b.t ? `<b>${x[0]}</b>` : t<b.t ? x[0] : `<span>${x[0]}</span>`).join('');
  const val = 1<<b.t;
  $('tray').innerHTML = `<div class="big">${e}</div>
    <div class="meta"><div class="nm">${n} <span class="hint">· level ${b.t+1}${b.t===MAX_T?' (top)':''}</span></div><div class="ladder">${ladder}</div></div>
    <button class="btn" id="sellBtn">Sell 🪙${val}</button>`;
  $('sellBtn').onclick = () => { S.coins += val; S.board[sel]=null; sel=-1; save(); render(); };
}

/* ---------- bar actions ---------- */
function nearestEmpty(from){
  const fr = Math.floor(from/COLS), fc = from%COLS;
  let best=-1, bd=1e9;
  for (let i=0;i<N;i++){
    if (S.board[i]) continue;
    const d=Math.hypot(Math.floor(i/COLS)-fr, i%COLS-fc);
    if (d<bd){ bd=d; best=i; }
  }
  return best;
}
function produce(i){
  const g = S.board[i];
  if (g.locked){ toast(`The ${genOf(g)[1]} opens in chapter ${CHAINS[g.g].unlock+1}.`); render(); return; }
  tickEnergy();
  if (S.energy <= 0){ openEnergy(); return; }
  const to = nearestEmpty(i);
  if (to < 0){ toast('The board is full. Merge or sell something.'); return; }
  if (S.energy >= E_MAX) S.eTs = Date.now();
  S.energy--;
  S.board[to] = { c:g.g, t: Math.random()<.12 ? 1 : 0 };
  popAt = to; save(); render();
}
function moveOrMerge(from, to){
  if (from===to){ render(); return; }
  const a = S.board[from], b = S.board[to];
  if (a && b && !a.g && !b.g && a.c===b.c && a.t===b.t && a.t<MAX_T){
    S.board[to] = { c:a.c, t:a.t+1 }; S.board[from] = null;
    popAt = to; sel = to;
    if (a.t+1 === MAX_T) toast(`${itemOf(S.board[to])[1]}! Top of the menu.`);
  } else {
    S.board[to] = a; S.board[from] = b; sel = to;
  }
  save(); render();
}
function serve(i){
  const p = S.patrons[i];
  const cells = findCells(p.order);
  if (!cells){ toast(`${PEOPLE[p.who].name} is still waiting on that.`); return; }
  cells.forEach(c=>{ S.board[c]=null; if (c===sel) sel=-1; });
  S.coins += p.coins; S.stars += p.stars; S.served++;
  S.energy = Math.min(E_MAX + 50, S.energy + 2);
  const who = PEOPLE[p.who];
  const heard = S.heard[p.who] || (S.heard[p.who] = []);
  const unheard = who.gossip.map((_,k)=>k).filter(k=>!heard.includes(k));
  const k = unheard.length ? pick(unheard) : rnd(who.gossip.length);
  const isNew = !heard.includes(k);
  if (isNew){ heard.push(k); S.bookNew = true; }
  showNote(who, who.gossip[k], isNew);
  const el = document.querySelector(`.patron[data-i="${i}"]`);
  if (el) el.classList.add('leaving');
  S.patrons.splice(i,1);
  const np = newPatron(); if (np) S.patrons.splice(i,0,np);
  save();
  setTimeout(render, 320);
}
let noteT;
function showNote(who, text, isNew){
  document.querySelectorAll('.note').forEach(n=>n.remove());
  const n = document.createElement('div');
  n.className = 'note';
  n.innerHTML = `${avatar(who)}<div><div class="who"><span>${who.name} leans in…</span>${isNew?'<span class="new">New gossip</span>':''}</div>${text}</div>`;
  n.onclick = () => n.remove();
  document.body.appendChild(n);
  clearTimeout(noteT); noteT = setTimeout(()=>n.remove(), 4500);
}

/* ---------- karaoke ---------- */
const ENCORE = 60;
let combo = 0, lastTap = 0, karaSaveT;
function mult(){ return combo >= 30 ? 3 : combo >= 10 ? 2 : 1; }
function renderKaraoke(){
  const k = S.kara;
  if (!PEOPLE[k.who] || PEOPLE[k.who].from > S.ch) k.who = 'dina';
  const singer = PEOPLE[k.who];
  if ($('singer').dataset.who !== k.who){
    $('singer').dataset.who = k.who;
    $('singer').innerHTML = avatar(singer);
    const crowd = townsfolk().filter(x=>x!==k.who).sort(()=>Math.random()-.5).slice(0,6);
    $('crowd').innerHTML = crowd.map(x=>avatar(PEOPLE[x])).join('');
  }
  $('songTitle').textContent = `${singer.name}: “${SONGS[k.song % SONGS.length]}”`;
  $('comboMult').textContent = '×' + mult();
  $('encoreLabel').textContent = `Encore bonus in ${ENCORE - k.cheers} cheers`;
  $('encoreBar').style.width = (k.cheers/ENCORE*100) + '%';
  renderShop();
}
function renderShop(){
  $('shopList').innerHTML = SHOP.map(it=>{
    let desc = it.desc;
    if (it.id==='upgrade'){
      const b = sel>=0 ? S.board[sel] : null;
      desc = b && !b.g && b.t<MAX_T ? `Turn your ${itemOf(b)[1]} into ${CHAINS[b.c].items[b.t+1][1]}` : 'Select an item on the Bar tab first';
    }
    const can = S.tokens >= it.cost && shopUsable(it.id);
    return `<div class="sitem"><div class="ic">${it.ic}</div><div class="d"><b>${it.name}</b><span>${desc}</span></div>
      <button class="btn tok" data-buy="${it.id}" ${can?'':'disabled'}>🎟️ ${it.cost}</button></div>`;
  }).join('');
}
function shopUsable(id){
  if (id==='upgrade'){ const b = sel>=0 ? S.board[sel] : null; return !!(b && !b.g && b.t<MAX_T); }
  if (id==='crate') return S.board.some(b=>!b);
  return true;
}
function buy(id){
  const it = SHOP.find(x=>x.id===id);
  if (!it || S.tokens < it.cost || !shopUsable(id)) return;
  S.tokens -= it.cost;
  if (id==='energy'){ S.energy += 30; toast('+30 ⚡ energy'); }
  if (id==='star'){ S.stars += 1; toast('+1 ⭐ star'); }
  if (id==='reroll'){ S.patrons = S.patrons.map(p=>({ who:p.who, ...makeOrder(), fresh:true })); toast('New orders at the bar'); }
  if (id==='crate'){
    const c = pick(Object.keys(CHAINS).filter(unlocked));
    const to = nearestEmpty(N-1);
    S.board[to] = { c, t:2 }; popAt = to; sel = to;
    toast(`Delivery: ${itemOf(S.board[to])[1]}`);
  }
  if (id==='upgrade'){ const b = S.board[sel]; S.board[sel] = { c:b.c, t:b.t+1 }; popAt = sel; toast(`Upgraded to ${itemOf(S.board[sel])[1]}`); }
  save(); render();
}
function cheer(e){
  const now = performance.now();
  combo = (now - lastTap < 450) ? combo + 1 : 0;
  lastTap = now;
  const m = mult();
  S.tokens += m;
  S.kara.cheers++;
  const r = $('stage').getBoundingClientRect();
  const x = (e.clientX ?? r.left + r.width/2) - r.left, y = (e.clientY ?? r.top + r.height/2) - r.top;
  floatAt(x, y, `+${m}🎟️`, '');
  if (Math.random() < .5) floatAt(x + (Math.random()*60-30), y - 10, pick(['♪','♫','♬']), 'note');
  const sg = $('singer'); sg.classList.remove('bop'); void sg.offsetWidth; sg.classList.add('bop');
  $('tapme').hidden = true;
  if (S.kara.cheers >= ENCORE){
    S.tokens += 25;
    toast(`Encore! The crowd tips 25 🎟️`);
    S.kara.cheers = 0;
    S.kara.song++;
    S.kara.who = pick(townsfolk().filter(k=>k!==S.kara.who));
  }
  renderStats();
  renderKaraoke();
  updateBadge();
  clearTimeout(karaSaveT); karaSaveT = setTimeout(save, 400);
}
function floatAt(x, y, text, cls){
  const f = document.createElement('div');
  f.className = 'float ' + cls; f.textContent = text;
  f.style.left = (x-18)+'px'; f.style.top = (y-20)+'px';
  $('stage').appendChild(f);
  setTimeout(()=>f.remove(), 900);
}
function updateBadge(){
  const cheapest = Math.min(...SHOP.map(s=>s.cost));
  $('tokBadge').hidden = tab==='karaoke' || S.tokens < cheapest;
  $('tokBadge').textContent = S.tokens;
}
function setTab(t){
  tab = t;
  $('barView').hidden = t!=='bar';
  $('karaokeView').hidden = t!=='karaoke';
  $('tabBar').setAttribute('aria-selected', t==='bar');
  $('tabKaraoke').setAttribute('aria-selected', t==='karaoke');
  if (t==='karaoke'){ $('singer').dataset.who=''; combo = 0; }
  updateBadge();
  render();
  window.scrollTo(0,0);
}

/* ---------- overlays ---------- */
function closeLayer(){ $('layer').innerHTML=''; }
function playScene(lines, done){
  let k = 0;
  const step = () => {
    if (k >= lines.length){ closeLayer(); done && done(); return; }
    const [who, text] = lines[k++];
    let ava = '', name = '', cls = 'line';
    if (who===null){ cls += ' narr'; }
    else if (who==='letter'){ ava = `<div class="ava emoji" style="background:${ROSA.look.bg}">✉️</div>`; name = 'A letter from Rosa'; cls += ' letter'; }
    else { const s = speaker(who); ava = avatar(s); name = s.name; }
    $('layer').innerHTML = `<div class="overlay" id="sceneOv"><div class="scene" role="dialog" aria-live="polite" tabindex="0">${ava}
      <div class="say">${name?`<div class="who">${name}</div>`:''}<div class="${cls}">${text}</div>
      <div class="more">${k<lines.length?'Tap to continue':'Tap to close'}</div></div></div></div>`;
    const ov = $('sceneOv'); ov.onclick = step;
    ov.querySelector('.scene').focus();
    ov.onkeydown = e => { if (e.key==='Enter'||e.key===' '){ e.preventDefault(); step(); } };
  };
  step();
}
function chapterCard(kicker, title, sub, btn, done){
  $('layer').innerHTML = `<div class="overlay center"><div class="card chapter-card">
    <div class="k">${kicker}</div><h2>${title}</h2><p>${sub}</p>
    <div class="row" style="justify-content:center"><button class="btn go" id="ccBtn">${btn}</button></div></div></div>`;
  $('ccBtn').onclick = () => { closeLayer(); done && done(); };
  $('ccBtn').focus();
}
function maybeIntro(){
  if (S.ch >= CHAPTERS.length || S.introSeen[S.ch]) return;
  const ch = CHAPTERS[S.ch];
  chapterCard(`Chapter ${S.ch+1}`, ch.title, `${ch.tasks.length} fix-ups to go. Earn ⭐ by serving customers.`, 'Open up', () => {
    playScene(ch.intro, () => { S.introSeen[S.ch]=true; save(); render(); });
  });
}
function doTask(){
  if (S.ch >= CHAPTERS.length){
    const all = CHAPTERS.flatMap((c,i)=>[[null, `Chapter ${i+1}: ${c.title}`], ...c.intro, ...c.tasks.flatMap(t=>t.scene)]);
    playScene(all); return;
  }
  const ch = CHAPTERS[S.ch], t = ch.tasks[S.task];
  if (S.stars < t.cost){ toast(`You need ${t.cost - S.stars} more ⭐. Serve a customer.`); return; }
  S.stars -= t.cost; S.task++;
  const finished = S.task >= ch.tasks.length;
  save(); render();
  playScene(t.scene, () => {
    if (!finished) return;
    const wasLast = S.ch === CHAPTERS.length-1;
    S.ch++; S.task = 0; S.coins += 50; S.energy = Math.max(S.energy, E_MAX);
    ensureGens(true); fillPatrons(); save(); render();
    if (wasLast) chapterCard('The end', 'The Gull is saved', 'You finished the story. Customers keep coming, and there is still gossip to collect in the book.', 'Keep pouring');
    else chapterCard(`Chapter ${S.ch} complete`, CHAPTERS[S.ch-1].title, 'Bonus: 🪙50 and a full tank of ⚡. New customers are in town.', 'Next chapter', maybeIntro);
  });
}
function openEnergy(){
  const cost = 40;
  $('layer').innerHTML = `<div class="overlay center"><div class="card">
    <h2>Out of steam?</h2>
    <p>Energy refills by 1 every ${E_REGEN_MS/1000} seconds, and serving a customer gives back 2. You can buy 50 ⚡ for 🪙${cost}, or earn 🎟️ tokens on the Karaoke tab and buy it there.</p>
    <div class="row"><button class="btn" id="eNo">Not now</button><button class="btn tok" id="eKara">Go to Karaoke</button><button class="btn go" id="eYes" ${S.coins<cost?'disabled':''}>Buy 50 ⚡</button></div></div></div>`;
  $('eNo').onclick = closeLayer;
  $('eKara').onclick = () => { closeLayer(); setTab('karaoke'); };
  $('eYes').onclick = () => { if (S.coins<cost) return; S.coins-=cost; S.energy+=50; save(); closeLayer(); render(); };
}
function openBook(){
  S.bookNew = false; save(); render();
  const total = Object.values(PEOPLE).reduce((s,p)=>s+p.gossip.length,0);
  const got = Object.values(S.heard).reduce((s,a)=>s+a.length,0);
  const body = Object.entries(PEOPLE).map(([k,p])=>{
    const heard = S.heard[k] || [];
    const lines = p.gossip.map((g,i)=> heard.includes(i) ? `<div class="gb-line">“${g}”</div>` : '').join('');
    const left = p.gossip.length - heard.length;
    const lockTxt = p.from > S.ch ? `Arrives in chapter ${p.from+1}.` : (left ? `${left} more to hear. Serve ${p.name} again.` : '');
    return `<div class="gb-who">${avatar(p)}<span>${p.name} <small>· ${p.role}</small></span></div>${lines}${lockTxt?`<div class="gb-line locked">${lockTxt}</div>`:''}`;
  }).join('');
  $('layer').innerHTML = `<div class="overlay center"><div class="card">
    <h2>The Gossip Book</h2><p>${got} of ${total} rumours heard. Everything said over the bar ends up in here.</p>
    ${body}
    <div class="row" style="margin-top:14px"><button class="btn go" id="bkClose">Close</button></div></div></div>`;
  $('bkClose').onclick = closeLayer;
}
function confirmReset(){
  $('layer').innerHTML = `<div class="overlay center"><div class="card">
    <h2>Start a new game?</h2><p>Your board, coins, stars, tokens, story progress and gossip book will be wiped.</p>
    <div class="row"><button class="btn" id="rNo">Keep playing</button><button class="btn go" id="rYes">Start again</button></div></div></div>`;
  $('rNo').onclick = closeLayer;
  $('rYes').onclick = () => { S = freshState(); ensureGens(); fillPatrons(); sel=-1; save(); closeLayer(); render(); maybeIntro(); };
}

/* ---------- input: tap & drag on the board ---------- */
let down = null, ghost = null;
const cellAt = (x,y) => { const el = document.elementFromPoint(x,y); const c = el && el.closest('[data-cell]'); return c ? +c.dataset.cell : -1; };
$('board').addEventListener('pointerdown', e => {
  const c = e.target.closest('[data-cell]'); if (!c) return;
  const i = +c.dataset.cell;
  down = { i, x:e.clientX, y:e.clientY, dragging:false };
  if (S.board[i]) $('board').setPointerCapture(e.pointerId);
});
$('board').addEventListener('pointermove', e => {
  if (!down || !S.board[down.i]) return;
  if (!down.dragging && Math.hypot(e.clientX-down.x, e.clientY-down.y) > 7){
    down.dragging = true;
    const b = S.board[down.i];
    ghost = document.createElement('div'); ghost.className='ghost';
    ghost.textContent = b.g ? genOf(b)[0] : itemOf(b)[0];
    document.body.appendChild(ghost);
    const it = document.querySelector(`[data-cell="${down.i}"] .item`); if (it) it.classList.add('dragging');
  }
  if (down.dragging){
    ghost.style.left = e.clientX+'px'; ghost.style.top = e.clientY+'px';
    document.querySelectorAll('.cell.target').forEach(x=>x.classList.remove('target'));
    const t = cellAt(e.clientX, e.clientY), a = S.board[down.i], b = t>=0 ? S.board[t] : null;
    if (t>=0 && t!==down.i && a && b && !a.g && !b.g && a.c===b.c && a.t===b.t && a.t<MAX_T)
      document.querySelector(`[data-cell="${t}"]`).classList.add('target');
  }
});
function endPointer(e, cancelled){
  if (!down) return;
  const d = down; down = null;
  if (ghost){ ghost.remove(); ghost = null; }
  if (d.dragging){
    const t = cancelled ? -1 : cellAt(e.clientX, e.clientY);
    if (t>=0) moveOrMerge(d.i, t); else render();
    return;
  }
  if (cancelled) return;
  const b = S.board[d.i];
  if (b && b.g){ sel = d.i; produce(d.i); return; }
  if (b){ sel = (sel===d.i) ? -1 : d.i; render(); return; }
  sel = -1; render();
}
$('board').addEventListener('pointerup', e => endPointer(e, false));
$('board').addEventListener('pointercancel', e => endPointer(e, true));

$('counter').addEventListener('click', e => { const b = e.target.closest('[data-serve]'); if (b) serve(+b.dataset.serve); });
$('taskBtn').onclick = doTask;
$('bookBtn').onclick = openBook;
$('stEnergy').onclick = openEnergy;
$('resetBtn').onclick = confirmReset;
$('tabBar').onclick = () => setTab('bar');
$('tabKaraoke').onclick = () => setTab('karaoke');
$('stage').addEventListener('pointerdown', e => { e.preventDefault(); cheer(e); });
$('stage').addEventListener('keydown', e => { if (e.key===' '||e.key==='Enter'){ e.preventDefault(); cheer({}); } });
$('stage').tabIndex = 0;
$('shopList').addEventListener('click', e => { const b = e.target.closest('[data-buy]'); if (b) buy(b.dataset.buy); });

/* ---------- boot ---------- */
function start(data){
  S = migrate((data && data.state) || load() || freshState());
  ensureGens(); fillPatrons(); save(); render(); updateBadge(); maybeIntro();
  setInterval(()=>{ const before = S.energy; tickEnergy(); if (S.energy!==before){ $('vEnergy').textContent=S.energy; save(); } renderTimer(); }, 1000);
}
window.claude?.hot?.snapshot?.(() => ({ state:S }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
