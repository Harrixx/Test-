<title>Six-Week Lift Log</title>
<meta name="theme-color" content="#B0306A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lift Log">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column; sticky week picker on top, rest timer docked at the bottom. */
:root {
  --bg: #F3F0F5; --surface: #FFFFFF; --ink: #1E1624; --muted: #6E6378; --line: #E2DCE7;
  --accent: #B0306A; --accent-ink: #FFFFFF; --accent-soft: #F7E1EB; --good: #2B7A57; --good-soft: #DDF1E6;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Figtree", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141016; --surface: #1F1923; --ink: #F2ECF4; --muted: #A99EB1; --line: #342B3A;
  --accent: #F0679F; --accent-ink: #1A0D14; --accent-soft: #3A1F2D; --good: #6CCB9C; --good-soft: #193328; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #141016; --surface: #1F1923; --ink: #F2ECF4; --muted: #A99EB1; --line: #342B3A;
  --accent: #F0679F; --accent-ink: #1A0D14; --accent-soft: #3A1F2D; --good: #6CCB9C; --good-soft: #193328; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 400 16px/1.45 var(--body); -webkit-tap-highlight-color: transparent }
.app { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 0 140px }
button, input, textarea { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; line-height: 1.1 }
.num { font-variant-numeric: tabular-nums }
.label { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }
.muted { color: var(--muted) }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 14px 10px; display: grid; gap: 10px; border-bottom: 1px solid var(--line) }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px }
.brand { font-family: var(--display); font-weight: 800; font-size: 22px; letter-spacing: -.01em }
.brand b { color: var(--accent) }
.nav { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px }
.nav a { text-decoration: none; color: var(--muted); font-weight: 600; font-size: 14px; padding: 6px 12px; border-radius: 999px }
.nav a[aria-current="page"] { background: var(--ink); color: var(--bg) }
.weeks { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px }
.weeks button { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 6px 0; font-weight: 600; font-size: 14px; display: grid; line-height: 1.15 }
.weeks button small { font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 700 }
.weeks button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink) }
.weeks button[aria-pressed="true"] small { color: var(--accent-ink); opacity: .8 }
.weeks button.full:not([aria-pressed="true"]) { border-color: var(--good); color: var(--good) }

/* Home */
.stack { display: grid; gap: 14px; padding-top: 18px }
.hello h1 { font-size: 30px; font-weight: 800 }
.hello p { margin: 6px 0 0 }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px }
.sess { display: grid; gap: 10px; text-decoration: none; color: inherit }
.sess h2 { font-size: 22px; font-weight: 800 }
.sess .row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px }
.sess ul { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px }
.sess li { font-size: 13px; padding: 3px 9px; border-radius: 999px; background: var(--bg); color: var(--muted) }
.sess.next { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) }
.pill { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--bg); color: var(--muted); white-space: nowrap }
.pill.go { background: var(--accent); color: var(--accent-ink) }
.pill.done { background: var(--good-soft); color: var(--good) }
.pill.part { background: var(--accent-soft); color: var(--accent) }
.meter { height: 6px; border-radius: 99px; background: var(--bg); overflow: hidden }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 99px }
.meter.done i { background: var(--good) }

/* Session */
.shead { display: grid; gap: 6px; padding-top: 18px }
.shead a { color: var(--muted); text-decoration: none; font-weight: 600; font-size: 14px }
.shead h1 { font-size: 32px; font-weight: 800 }
.note { display: inline-block; font-size: 13px; font-weight: 600; color: var(--accent); background: var(--accent-soft); padding: 3px 10px; border-radius: 999px; justify-self: start }
.block { display: grid; gap: 10px; padding-top: 22px }
.check { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px }
.check .box { flex: none; width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--line); display: grid; place-items: center }
.check .box svg { opacity: 0 }
.check[aria-pressed="true"] .box svg { opacity: 1 }
.check[aria-pressed="true"] .box { background: var(--good); border-color: var(--good); color: var(--bg) }
.check[aria-pressed="true"] .t { text-decoration: line-through; color: var(--muted) }
.check .t { flex: 1; min-width: 0 }
.check .t b { display: block; font-weight: 600 }
.ex { display: grid; gap: 12px }
.ex.complete { border-color: var(--good) }
.exhead { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px }
.exhead h3 { font-family: var(--body); font-size: 18px; font-weight: 700; line-height: 1.25 }
.target { font-weight: 700; white-space: nowrap; font-size: 15px }
.target span { color: var(--muted); font-weight: 500 }
.last { font-size: 13px; color: var(--muted); margin-top: 2px }
.last b { color: var(--ink); font-weight: 600 }
.sets { display: grid; gap: 8px }
.set { display: grid; grid-template-columns: 44px 1fr 1fr 48px; gap: 8px; align-items: center }
.set .n { font-size: 13px; font-weight: 700; color: var(--muted) }
.field { position: relative }
.field input { width: 100%; min-width: 0; height: 46px; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 0 34px 0 12px; font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums }
.field span { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: 12px; color: var(--muted); pointer-events: none }
.tick { height: 46px; border-radius: 10px; border: 2px solid var(--line); background: transparent; display: grid; place-items: center; color: var(--muted) }
.tick[aria-pressed="true"] { background: var(--good); border-color: var(--good); color: var(--bg) }
.set.isdone input { border-color: transparent; background: var(--good-soft) }
.finish { width: 100%; border: 0; border-radius: var(--r); padding: 16px; font-weight: 700; font-size: 17px; background: var(--accent); color: var(--accent-ink) }
.finish.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent) }
.center { text-align: center }

/* Progress */
.tablewrap { overflow-x: auto; margin-inline: -16px; padding-inline: 16px }
table { border-collapse: collapse; width: 100%; min-width: 460px; font-size: 14px }
th, td { padding: 9px 6px; border-bottom: 1px solid var(--line); text-align: right; font-variant-numeric: tabular-nums }
th:first-child, td:first-child { text-align: left; padding-left: 0; max-width: 150px }
thead th { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }
th.cur { color: var(--accent) }
td.up { color: var(--good); font-weight: 700 }
td.empty { color: var(--line) }
.tools { display: flex; flex-wrap: wrap; gap: 8px }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 14px; font-weight: 600; font-size: 14px }
.btn.danger { color: var(--accent); border-color: var(--accent) }
textarea { width: 100%; min-height: 120px; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px; font-size: 12px; font-family: ui-monospace, Menlo, monospace }
.msg { font-size: 14px; font-weight: 600; color: var(--good); min-height: 1.2em }

/* Rest timer */
.timer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--ink); color: var(--bg); padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)) }
.timer .in { max-width: 528px; margin: 0 auto; display: flex; align-items: center; gap: 12px }
.timer .clock { font-family: var(--display); font-weight: 800; font-size: 34px; font-variant-numeric: tabular-nums; min-width: 92px }
.timer .clock.over { color: var(--accent) }
.timer .lbl { flex: 1; min-width: 0; font-size: 13px; line-height: 1.25; opacity: .8 }
.timer button { border: 1px solid currentColor; background: transparent; color: inherit; border-radius: 10px; padding: 8px 10px; font-weight: 700; font-size: 14px }
.timer .prog { position: absolute; left: 0; top: 0; height: 3px; background: var(--accent) }
@media (prefers-reduced-motion: no-preference) { .meter i, .timer .prog { transition: width .3s linear } }
</style>

<div class="app">
  <header class="top">
    <div class="bar">
      <div class="brand">Lift<b>Log</b></div>
      <nav class="nav"><a href="#home" id="navHome">Workouts</a><a href="#progress" id="navProg">Progress</a></nav>
    </div>
    <div class="weeks" id="weeks" role="group" aria-label="Choose week"></div>
  </header>
  <main id="view"></main>
</div>

<div class="timer" id="timer" hidden>
  <div class="prog" id="tProg"></div>
  <div class="in">
    <div class="clock" id="tClock">1:30</div>
    <div class="lbl" id="tLbl">Rest</div>
    <button type="button" id="tAdd">+15s</button>
    <button type="button" id="tSkip">Done</button>
  </div>
</div>

<script>
/* ---- The plan (from the spreadsheet). Edit here to change exercises. ----
   Each exercise: [name, reps, sets]. */
const WARMUP = { what: "Bike or StairMaster", time: "15 minutes", note: "Build up the speed each week" };
const WEEKS = 6;
const SESSIONS = [
  { id: "s1", name: "Session 1", focus: "Glutes + hamstrings", note: "Heavy weights if possible",
    ex: [["Barbell hip thrust", "6 to 10", 4], ["Romanian deadlift", "8 to 10", 3], ["Bulgarian split squat", "8 to 12 each leg", 3],
         ["Seated/lying leg curl (machine)", "10 to 15", 3], ["Cable glute kickback", "12 to 15 each leg", 3], ["Hip abduction (machine)", "10 to 15", 3]],
    core: ["Reverse crunch × 12–15", "Dead bug × 10 each side", "Plank × 30–45 sec"] },
  { id: "s2", name: "Session 2", focus: "Quads & glutes",
    ex: [["Back squat", "6 to 10", 4], ["Leg press", "8 to 12", 3], ["Walking lunges, dumbbell in each hand", "10 each leg", 3],
         ["Leg extension (machine)", "10 to 15", 3], ["Hip thrust or glute bridge", "10 to 12", 3], ["Hip abduction (machine)", "15 to 20", 3]],
    core: ["Hanging/knee raises × 10–15", "Bicycle crunch × 12 each side", "Side plank × 30 sec each side"] },
  { id: "s3", name: "Session 3", focus: "Glutes, hamstrings & legs",
    ex: [["Hip thrust", "8 to 12", 4], ["Romanian deadlift", "8 to 12", 3], ["Reverse lunges, dumbbell in each hand", "10 each leg", 3],
         ["Leg press", "10 to 12", 3], ["Leg curl (machine)", "10 to 15", 3], ["Cable kickback", "12 to 15 each leg", 3], ["Hip abduction (machine)", "15 to 25", 2]],
    core: ["Cable crunch × 12–15", "Reverse crunch × 12–15", "Plank shoulder taps × 10 each side"] }
];
const CORE_ROUNDS = 3;

/* ---- Storage ---- */
const KEY = "liftlog.v1";
let S = { week: 1, rest: 90, logs: {} };
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const sess = id => SESSIONS.find(s => s.id === id);
const TICK = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function getLog(sid, w, create) {
  const k = sid + "|" + w;
  if (!S.logs[k] && create) {
    const s = sess(sid);
    S.logs[k] = { warm: false, core: Array(CORE_ROUNDS).fill(false), done: null,
      sets: s.ex.map(e => Array.from({ length: e[2] }, () => ({ kg: "", reps: "", done: false }))) };
  }
  return S.logs[k];
}
function counts(sid, w) {
  const s = sess(sid), l = getLog(sid, w);
  const total = s.ex.reduce((a, e) => a + e[2], 0);
  const done = l ? l.sets.flat().filter(x => x.done).length : 0;
  return { total, done, finished: !!(l && l.done), date: l && l.done };
}
const num = v => { const n = parseFloat(String(v).replace(",", ".")); return isNaN(n) ? null : n; };
function topSet(sid, w, i) {
  const l = getLog(sid, w); if (!l || !l.sets[i]) return null;
  let best = null;
  for (const x of l.sets[i]) { const kg = num(x.kg); if (kg !== null && (!best || kg > best.kg)) best = { kg, reps: x.reps }; }
  return best;
}
function lastTime(sid, w, i) {
  for (let p = w - 1; p >= 1; p--) { const t = topSet(sid, p, i); if (t) return { ...t, week: p }; }
  return null;
}
const fmtKg = n => (Math.round(n * 100) / 100).toString();
const fmtDate = iso => new Date(iso).toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });

/* ---- Week picker ---- */
function renderWeeks() {
  $("#weeks").innerHTML = Array.from({ length: WEEKS }, (_, i) => {
    const w = i + 1, full = SESSIONS.every(s => counts(s.id, w).finished);
    return `<button type="button" data-week="${w}" aria-pressed="${w === S.week}" class="${full ? "full" : ""}"><small>Week</small><span class="num">${full && w !== S.week ? "✓" : w}</span></button>`;
  }).join("");
}

/* ---- Home ---- */
function renderHome() {
  const w = S.week;
  const next = SESSIONS.find(s => !counts(s.id, w).finished);
  const doneCount = SESSIONS.filter(s => counts(s.id, w).finished).length;
  let html = `<section class="hello"><h1>Week ${w}</h1><p class="muted">${
    doneCount === SESSIONS.length ? (w < WEEKS ? "All three sessions done. Nice work. Move on to week " + (w + 1) + " when you're ready." : "That's the full six weeks done. Check your Progress tab.")
    : `${doneCount} of ${SESSIONS.length} sessions done. Warm up for ${WARMUP.time} first, then log each set as you go.`}</p></section>`;
  if (doneCount === SESSIONS.length && w < WEEKS) html += `<button class="finish" type="button" data-week="${w + 1}">Start week ${w + 1}</button>`;
  for (const s of SESSIONS) {
    const c = counts(s.id, w);
    const pill = c.finished ? `<span class="pill done">Done · ${fmtDate(c.date)}</span>`
      : c.done ? `<span class="pill part num">${c.done}/${c.total} sets</span>`
      : s === next ? `<span class="pill go">Up next</span>` : `<span class="pill">Not started</span>`;
    html += `<a class="card sess${s === next ? " next" : ""}" href="#${s.id}">
      <div class="row"><span class="label">${s.name}</span>${pill}</div>
      <h2>${esc(s.focus)}</h2>
      <ul>${s.ex.map(e => `<li>${esc(e[0].replace(/ \(machine\)|, dumbbell in each hand/i, ""))}</li>`).join("")}</ul>
      <div class="meter${c.finished ? " done" : ""}"><i style="width:${c.finished ? 100 : Math.round(c.done / c.total * 100)}%"></i></div>
    </a>`;
  }
  $("#view").innerHTML = `<div class="stack">${html}</div>`;
}

/* ---- Session ---- */
function renderSession(sid) {
  const s = sess(sid), w = S.week, l = getLog(sid, w, true);
  let html = `<div class="shead"><a href="#home">← All workouts</a><span class="label">${s.name} · Week ${w}</span><h1>${esc(s.focus)}</h1>${s.note ? `<span class="note">${esc(s.note)}</span>` : ""}</div>`;
  html += `<section class="block"><span class="label">Warm up</span>
    <button type="button" class="check" data-warm aria-pressed="${l.warm}"><span class="box">${TICK}</span>
    <span class="t"><b>${WARMUP.what} · ${WARMUP.time}</b><span class="muted">${WARMUP.note}</span></span></button></section>`;
  html += `<section class="block"><span class="label">Exercises · track your weights</span>`;
  s.ex.forEach((e, i) => {
    const lt = lastTime(sid, w, i), sets = l.sets[i], all = sets.every(x => x.done);
    html += `<article class="card ex${all ? " complete" : ""}" data-ex="${i}">
      <div class="exhead"><div><h3>${esc(e[0])}</h3>
        <div class="last">${lt ? `Week ${lt.week} best: <b class="num">${fmtKg(lt.kg)} kg${lt.reps ? " × " + esc(lt.reps) : ""}</b>` : w === 1 ? "First week: find a weight you can do with good form" : "No weight logged before"}</div></div>
        <div class="target num">${e[2]} <span>×</span> ${esc(e[1])}</div></div>
      <div class="sets">${sets.map((x, j) => `
        <div class="set${x.done ? " isdone" : ""}" data-set="${j}">
          <span class="n">Set ${j + 1}</span>
          <label class="field"><input id="kg-${sid}-${w}-${i}-${j}" inputmode="decimal" autocomplete="off" aria-label="Set ${j + 1} weight in kg" data-f="kg" value="${esc(x.kg)}" placeholder="${lt ? fmtKg(lt.kg) : "–"}"><span>kg</span></label>
          <label class="field"><input id="reps-${sid}-${w}-${i}-${j}" inputmode="numeric" autocomplete="off" aria-label="Set ${j + 1} reps" data-f="reps" value="${esc(x.reps)}" placeholder="–"><span>reps</span></label>
          <button type="button" class="tick" data-tick aria-pressed="${x.done}" aria-label="Set ${j + 1} done">${TICK}</button>
        </div>`).join("")}</div>
    </article>`;
  });
  html += `</section><section class="block"><span class="label">Core finisher · ${CORE_ROUNDS} rounds</span>
    <div class="card muted" style="font-size:15px">${s.core.map(esc).join("<br>")}</div>
    ${l.core.map((d, r) => `<button type="button" class="check" data-core="${r}" aria-pressed="${d}"><span class="box">${TICK}</span><span class="t"><b>Round ${r + 1}</b></span></button>`).join("")}
  </section><section class="block">
    ${l.done ? `<p class="center muted">Finished ${fmtDate(l.done)}</p><button type="button" class="finish ghost" data-undo>Mark as not finished</button>`
             : `<button type="button" class="finish" data-finish>Finish ${s.name.toLowerCase()}</button>`}
  </section>`;
  $("#view").innerHTML = html;
}

/* ---- Progress ---- */
let resetArmed = false;
function renderProgress() {
  let html = `<section class="hello"><h1>Progress</h1><p class="muted">Your heaviest set for each exercise, week by week. Green means you went up.</p></section>`;
  for (const s of SESSIONS) {
    html += `<section class="card"><span class="label">${s.name}</span><h2 style="font-size:20px;margin:2px 0 8px">${esc(s.focus)}</h2>
      <div class="tablewrap"><table><thead><tr><th>Exercise</th>${Array.from({ length: WEEKS }, (_, i) => `<th class="${i + 1 === S.week ? "cur" : ""}">W${i + 1}</th>`).join("")}</tr></thead><tbody>`;
    s.ex.forEach((e, i) => {
      let prev = null;
      html += `<tr><td>${esc(e[0])}</td>`;
      for (let w = 1; w <= WEEKS; w++) {
        const t = topSet(s.id, w, i);
        if (!t) { html += `<td class="empty">·</td>`; continue; }
        html += `<td class="${prev !== null && t.kg > prev ? "up" : ""}">${fmtKg(t.kg)}</td>`;
        prev = t.kg;
      }
      html += `</tr>`;
    });
    html += `</tbody></table></div><p class="label" style="margin:10px 0 0">Weights in kg</p></section>`;
  }
  html += `<section class="card" style="display:grid;gap:10px"><span class="label">Backup</span>
    <p class="muted" style="margin:0;font-size:14px">Your log is saved on this phone only. Copy a backup now and then and keep it in Notes, so nothing is lost if the browser data is cleared.</p>
    <div class="tools"><button class="btn" type="button" id="copyBk">Copy backup</button><button class="btn" type="button" id="restoreBk">Restore from pasted backup</button></div>
    <textarea id="bk" aria-label="Backup text" placeholder="Paste a backup here, then tap Restore"></textarea>
    <div class="msg" id="bkMsg" role="status"></div>
    <span class="label" style="margin-top:6px">Start again</span>
    <div class="tools"><button class="btn danger" type="button" id="reset">${resetArmed ? "Tap again to clear all six weeks" : "Clear log for a new 6-week block"}</button></div>
  </section>`;
  $("#view").innerHTML = `<div class="stack">${html}</div>`;
}

/* ---- Router ---- */
function route() {
  const h = (location.hash || "#home").slice(1);
  $("#navHome").setAttribute("aria-current", h === "progress" ? "false" : "page");
  $("#navProg").setAttribute("aria-current", h === "progress" ? "page" : "false");
  renderWeeks();
  if (sess(h)) renderSession(h);
  else if (h === "progress") renderProgress();
  else renderHome();
}
function rerenderKeepScroll() { const y = scrollY; route(); scrollTo(0, y); }
addEventListener("hashchange", () => { resetArmed = false; route(); scrollTo(0, 0); });

/* ---- Events ---- */
document.addEventListener("input", ev => {
  const inp = ev.target.closest("input[data-f]"); if (!inp) return;
  const sid = location.hash.slice(1), i = +inp.closest("[data-ex]").dataset.ex, j = +inp.closest("[data-set]").dataset.set;
  getLog(sid, S.week, true).sets[i][j][inp.dataset.f] = inp.value.trim();
  save();
});
document.addEventListener("click", ev => {
  const t = ev.target;
  const wk = t.closest("[data-week]");
  if (wk) { S.week = +wk.dataset.week; save(); rerenderKeepScroll(); return; }
  const sid = location.hash.slice(1);
  const l = sess(sid) ? getLog(sid, S.week, true) : null;
  if (t.closest("[data-warm]")) { l.warm = !l.warm; save(); rerenderKeepScroll(); return; }
  const core = t.closest("[data-core]");
  if (core) { const r = +core.dataset.core; l.core[r] = !l.core[r]; save(); rerenderKeepScroll(); if (l.core[r] && r < CORE_ROUNDS - 1) startRest(60, "Rest before round " + (r + 2)); return; }
  if (t.closest("[data-tick]")) {
    const i = +t.closest("[data-ex]").dataset.ex, j = +t.closest("[data-set]").dataset.set, set = l.sets[i][j];
    set.done = !set.done;
    if (set.done) {
      // Fill blanks from the set above, or from last week's best.
      const above = l.sets[i][j - 1], lt = lastTime(sid, S.week, i);
      if (!set.kg) set.kg = above && above.kg ? above.kg : lt ? fmtKg(lt.kg) : "";
      if (!set.reps && above && above.reps) set.reps = above.reps;
      const ex = sess(sid).ex, lastSet = j === l.sets[i].length - 1;
      startRest(S.rest, lastSet ? (ex[i + 1] ? "Next: " + ex[i + 1][0] : "Core finisher next") : `Rest · then set ${j + 2} of ${ex[i][0]}`);
    }
    save(); rerenderKeepScroll(); return;
  }
  if (t.closest("[data-finish]")) { l.done = new Date().toISOString(); save(); stopRest(); location.hash = "home"; return; }
  if (t.closest("[data-undo]")) { l.done = null; save(); rerenderKeepScroll(); return; }
  if (t.id === "copyBk") {
    const txt = JSON.stringify(S), box = $("#bk"); box.value = txt;
    const ok = () => $("#bkMsg").textContent = "Backup copied. Paste it into Notes to keep it safe.";
    const fb = () => { box.focus(); box.select(); $("#bkMsg").textContent = "Backup is in the box. Select it all and copy."; };
    try { navigator.clipboard.writeText(txt).then(ok, fb); } catch (e) { fb(); }
    return;
  }
  if (t.id === "restoreBk") {
    try {
      const d = JSON.parse($("#bk").value);
      if (!d || typeof d.logs !== "object") throw 0;
      S = Object.assign({ week: 1, rest: 90, logs: {} }, d); save();
      route(); $("#bkMsg").textContent = "Backup restored.";
    } catch (e) { $("#bkMsg").textContent = "That text isn't a Lift Log backup. Copy the whole backup and try again."; }
    return;
  }
  if (t.id === "reset") {
    if (!resetArmed) { resetArmed = true; rerenderKeepScroll(); return; }
    resetArmed = false; S.logs = {}; S.week = 1; save(); location.hash = "home"; route();
  }
});

/* ---- Rest timer ---- */
let tEnd = 0, tLen = 0, tInt = null, beeped = false, wake = null;
function startRest(sec, label) {
  tLen = sec; tEnd = Date.now() + sec * 1000; beeped = false;
  $("#tLbl").textContent = label; $("#timer").hidden = false;
  clearInterval(tInt); tInt = setInterval(tickRest, 250); tickRest();
  try { navigator.wakeLock && navigator.wakeLock.request("screen").then(w => wake = w, () => {}); } catch (e) {}
}
function stopRest() { clearInterval(tInt); $("#timer").hidden = true; try { wake && wake.release(); } catch (e) {} wake = null; }
function tickRest() {
  const left = Math.round((tEnd - Date.now()) / 1000), a = Math.abs(left);
  $("#tClock").textContent = (left < 0 ? "+" : "") + Math.floor(a / 60) + ":" + String(a % 60).padStart(2, "0");
  $("#tClock").classList.toggle("over", left <= 0);
  $("#tProg").style.width = Math.max(0, Math.min(100, (1 - left / tLen) * 100)) + "%";
  if (left <= 0 && !beeped) { beeped = true; $("#tLbl").textContent = "Time's up. " + $("#tLbl").textContent.replace(/^Rest · then /, ""); beep(); }
  if (left < -120) stopRest();
}
function beep() {
  try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {}
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    [0, .25].forEach(d => { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = 880; o.connect(g); g.connect(ac.destination);
      g.gain.setValueAtTime(.2, ac.currentTime + d); g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + d + .2); o.start(ac.currentTime + d); o.stop(ac.currentTime + d + .22); });
  } catch (e) {}
}
$("#tAdd").onclick = () => { tEnd += 15000; tLen += 15; beeped = false; tickRest(); };
$("#tSkip").onclick = stopRest;

route();
</script>
