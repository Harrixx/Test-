<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Six-Week Lift Log</title>
<meta name="theme-color" content="#B0306A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lift Log">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column; sticky header (brand, tabs, week picker), rest timer docked at the bottom, sheets slide up. */
:root {
  --bg: #F3F0F5; --surface: #FFFFFF; --ink: #1E1624; --muted: #6E6378; --line: #E2DCE7;
  --accent: #B0306A; --accent-ink: #FFFFFF; --accent-soft: #F7E1EB; --good: #2B7A57; --good-soft: #DDF1E6;
  --fig: #2A1F31; --fig2: #B3A7BC; --eq: #D6CEDD; --scrim: rgba(30, 22, 36, .45);
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Figtree", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141016; --surface: #1F1923; --ink: #F2ECF4; --muted: #A99EB1; --line: #342B3A;
  --accent: #F0679F; --accent-ink: #1A0D14; --accent-soft: #3A1F2D; --good: #6CCB9C; --good-soft: #193328;
  --fig: #EDE4F0; --fig2: #6F6478; --eq: #3D3344; --scrim: rgba(0, 0, 0, .6); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #141016; --surface: #1F1923; --ink: #F2ECF4; --muted: #A99EB1; --line: #342B3A;
  --accent: #F0679F; --accent-ink: #1A0D14; --accent-soft: #3A1F2D; --good: #6CCB9C; --good-soft: #193328;
  --fig: #EDE4F0; --fig2: #6F6478; --eq: #3D3344; --scrim: rgba(0, 0, 0, .6); color-scheme: dark }

* { box-sizing: border-box }
[hidden] { display: none !important }
body { background: var(--bg); color: var(--ink); font: 400 16px/1.45 var(--body); -webkit-tap-highlight-color: transparent }
.app { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 0 140px }
button, input, textarea, select { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; line-height: 1.1 }
.num { font-variant-numeric: tabular-nums }
.label { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }
.muted { color: var(--muted) }
.link { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 700; text-decoration: none; cursor: pointer; text-align: left }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 12px 10px; display: grid; gap: 10px; border-bottom: 1px solid var(--line) }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px }
.brand { font-family: var(--display); font-weight: 800; font-size: 22px; letter-spacing: -.01em }
.brand b { color: var(--accent) }
.me { display: flex; align-items: center; gap: 10px; min-width: 0 }
.sync { font-size: 12px; color: var(--muted); white-space: nowrap }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--surface); border: 1px solid var(--line); display: grid; place-items: center; color: var(--ink); font-weight: 700; text-decoration: none; flex: none }
.avatar[aria-current="page"] { background: var(--ink); color: var(--bg) }
.nav { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px }
.nav a { text-align: center; text-decoration: none; color: var(--muted); font-weight: 600; font-size: 14px; padding: 7px 4px; border-radius: 999px }
.nav a[aria-current="page"] { background: var(--ink); color: var(--bg) }
.weeks { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none }
.weeks button { flex: 1 0 50px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 6px 0; font-weight: 600; font-size: 14px; display: grid; line-height: 1.15 }
.weeks button small { font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 700 }
.weeks button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink) }
.weeks button[aria-pressed="true"] small { color: var(--accent-ink); opacity: .8 }
.weeks button.full:not([aria-pressed="true"]) { border-color: var(--good); color: var(--good) }

/* Shared blocks */
.stack { display: grid; gap: 14px; padding-top: 18px }
.hello h1 { font-size: 30px; font-weight: 800 }
.hello p { margin: 6px 0 0 }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px }
.card h2 { font-size: 21px; font-weight: 800 }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 14px; font-weight: 600; font-size: 14px; text-decoration: none; color: var(--ink); display: inline-flex; align-items: center; justify-content: center; gap: 6px }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink) }
.btn.danger { color: var(--accent); border-color: var(--accent) }
.btn.wide { width: 100% }
.tools { display: flex; flex-wrap: wrap; gap: 8px }
.finish { width: 100%; border: 0; border-radius: var(--r); padding: 16px; font-weight: 700; font-size: 17px; background: var(--accent); color: var(--accent-ink); text-align: center; text-decoration: none; display: block }
.finish.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent) }
.center { text-align: center }
.pill { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--bg); color: var(--muted); white-space: nowrap }
.pill.go { background: var(--accent); color: var(--accent-ink) }
.pill.done { background: var(--good-soft); color: var(--good) }
.pill.part { background: var(--accent-soft); color: var(--accent) }
.note { display: inline-block; font-size: 13px; font-weight: 600; color: var(--accent); background: var(--accent-soft); padding: 3px 10px; border-radius: 999px; justify-self: start }
.tip { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 0 }
.tip b { color: var(--accent); margin-right: 4px }
.welcome { display: grid; gap: 8px; border-color: var(--accent) }
.welcome .row { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start }
.x { background: none; border: 0; color: var(--muted); font-size: 22px; line-height: 1; padding: 0 4px }

/* Train */
.sess { display: grid; gap: 10px; text-decoration: none; color: inherit }
.sess h2 { font-size: 22px }
.sess .row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px }
.sess ul { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px }
.sess li { font-size: 13px; padding: 3px 9px; border-radius: 999px; background: var(--bg); color: var(--muted) }
.sess.next { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) }
.meter { height: 6px; border-radius: 99px; background: var(--bg); overflow: hidden }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 99px }
.meter.done i { background: var(--good) }
.tcard { display: grid; gap: 8px }
.tcard .meta { display: flex; flex-wrap: wrap; gap: 6px }

/* Session */
.shead { display: grid; gap: 6px; padding-top: 18px }
.shead a { color: var(--muted); text-decoration: none; font-weight: 600; font-size: 14px }
.shead h1 { font-size: 32px; font-weight: 800 }
.block { display: grid; gap: 10px; padding-top: 22px }
.check { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px }
.check .box { flex: none; width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--line); display: grid; place-items: center }
.check .box svg { opacity: 0 }
.check[aria-pressed="true"] .box svg { opacity: 1 }
.check[aria-pressed="true"] .box { background: var(--good); border-color: var(--good); color: var(--bg) }
.check[aria-pressed="true"] .t { text-decoration: line-through; color: var(--muted) }
.check .t { flex: 1; min-width: 0 }
.check .t b { display: block; font-weight: 600 }
.ex { display: grid; gap: 12px }
.ex.complete { border-color: var(--good) }
.exhead { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px }
.exhead h3, .coreh { font-family: var(--body); font-size: 18px; font-weight: 700; line-height: 1.25 }
.target { font-weight: 700; white-space: nowrap; font-size: 15px }
.target span { color: var(--muted); font-weight: 500 }
.last { font-size: 13px; color: var(--muted); margin-top: 2px }
.last b { color: var(--ink); font-weight: 600 }
.sets { display: grid; gap: 8px }
.set { display: grid; grid-template-columns: 44px 1fr 1fr 48px; gap: 8px; align-items: center }
.set .n { font-size: 13px; font-weight: 700; color: var(--muted) }
.field { position: relative }
.field input { width: 100%; min-width: 0; height: 46px; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 0 34px 0 12px; font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums }
.field span { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: 12px; color: var(--muted); pointer-events: none }
.tick { height: 46px; border-radius: 10px; border: 2px solid var(--line); background: transparent; display: grid; place-items: center; color: var(--muted) }
.tick[aria-pressed="true"] { background: var(--good); border-color: var(--good); color: var(--bg) }
.set.isdone input { border-color: transparent; background: var(--good-soft) }

/* Exercise figures + how-to */
.demo { background: var(--bg); border-radius: 10px; padding: 4px; display: block }
.demo svg { display: block; width: 100%; height: auto; max-height: 170px }
.demo .floor { stroke: var(--eq); stroke-width: 2 }
.demo .fg, .demo .fg2 { fill: none; stroke-linecap: round; stroke-linejoin: round }
.demo .fg { stroke: var(--fig) } .demo .fg2 { stroke: var(--fig2) }
.demo .hd { fill: var(--fig) }
.demo .eqf { fill: var(--eq) }
.demo .eq { stroke: var(--eq); stroke-width: 3; stroke-linecap: round }
.demo .eq.pad { stroke-width: 8 }
.demo .wt { fill: var(--accent) }
.demo .wtl { stroke: var(--accent); stroke-width: 6; stroke-linecap: round }
.demo .cab { stroke: var(--accent); stroke-width: 1.5; opacity: .8 }
.demo .band { stroke-width: 3 }
.how summary { font-weight: 700; color: var(--accent); cursor: pointer; padding: 4px 0; list-style-position: inside }
.how ol, .guide ol, .guide ul { margin: 8px 0; padding-left: 22px; display: grid; gap: 6px }
.how p { margin: 8px 0 0; font-size: 15px }
.how .label { margin-right: 6px }

/* Plans + editor */
.plan.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) }
.plan { display: grid; gap: 10px }
.plan .row { display: flex; justify-content: space-between; gap: 10px; align-items: baseline }
.fl { display: grid; gap: 6px; font-weight: 600; font-size: 14px; min-width: 0 }
.fl .hint { font-weight: 400; color: var(--muted); font-size: 13px }
.in { width: 100%; min-width: 0; height: 46px; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 0 12px; font-size: 16px }
select.in { padding-right: 8px }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.grid3 { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 10px }
.ed-sess { display: grid; gap: 12px }
.erow { display: grid; grid-template-columns: 60px 1fr; gap: 10px; align-items: start; padding-block: 10px; border-top: 1px solid var(--line) }
.erow .thumb { padding: 2px; border-radius: 8px }
.erow .body { display: grid; gap: 8px; min-width: 0 }
.erow .name { font-weight: 700; line-height: 1.25 }
.erow .nrow { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px }
.erow .ctrl { display: grid; grid-template-columns: 1fr 72px; gap: 8px }
.erow .ctrl.core { grid-template-columns: 1fr }
.mini button:disabled { opacity: .35 }
.mini { display: flex; gap: 4px }
.mini button { width: 36px; height: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); display: grid; place-items: center; color: var(--muted) }
.small-in { height: 40px; font-size: 15px }

/* Library */
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-weight: 600; font-size: 14px; color: var(--muted) }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg) }
.lib-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px }
.lcard { display: grid; gap: 6px; align-content: start; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 8px; min-width: 0 }
.lcard b { font-size: 15px; line-height: 1.2 }
.lcard small { color: var(--muted); font-size: 12px; line-height: 1.3 }
.empty { padding: 20px; text-align: center; color: var(--muted) }

/* Learn */
.gcard { display: grid; gap: 4px; text-decoration: none; color: inherit }
.gcard h2 { font-size: 20px }
.guide { display: grid; gap: 18px; padding-top: 18px }
.guide h1 { font-size: 30px; font-weight: 800 }
.guide h2 { font-size: 20px; font-weight: 800; margin-bottom: 6px }
.guide p { margin: 0 0 8px; max-width: 65ch }
.calc { display: grid; gap: 12px }
.results { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.tile { background: var(--bg); border-radius: 12px; padding: 12px }
.tile b { display: block; font-family: var(--display); font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums }
.tile.hl { background: var(--accent-soft) }
.tile.hl b { color: var(--accent) }
.tile small { color: var(--muted); font-size: 13px }

/* Progress */
.tablewrap { overflow-x: auto; margin-inline: -16px; padding-inline: 16px }
table { border-collapse: collapse; width: 100%; min-width: 440px; font-size: 14px }
th, td { padding: 9px 6px; border-bottom: 1px solid var(--line); text-align: right; font-variant-numeric: tabular-nums }
th:first-child, td:first-child { text-align: left; padding-left: 0; max-width: 150px }
thead th { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }
th.cur { color: var(--accent) }
td.up { color: var(--good); font-weight: 700 }
td.empty { color: var(--line) }
textarea { width: 100%; min-height: 110px; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px; font-size: 12px; font-family: ui-monospace, Menlo, monospace }
.msg { font-size: 14px; font-weight: 600; min-height: 1.2em; margin: 0 }
.msg.ok { color: var(--good) } .msg.err { color: var(--accent) }

/* Sign-in */
.auth { min-height: 100%; display: grid; place-items: center; padding-inline: 16px; padding-block: 32px }
.auth-in { width: 100%; max-width: 400px; display: grid; gap: 18px }
.auth .brand { font-size: 40px }
.auth .card { display: grid; gap: 14px }
.auth h2 { font-size: 24px }
.auth form { display: grid; gap: 12px }
.auth .swap { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 14px }

/* Sheet + toast */
.sheet { position: fixed; inset: 0; z-index: 20; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center }
.sheet-in { width: 100%; max-width: 560px; max-height: 92%; overflow-y: auto; background: var(--bg); border-radius: 18px 18px 0 0; padding: 14px 16px calc(24px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; align-content: start }
.sheet-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; position: sticky; top: -14px; background: var(--bg); padding-block: 4px }
.sheet-top h2 { font-size: 22px }
.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 30; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: 14px; max-width: calc(100% - 32px) }

/* Rest timer */
.timer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--ink); color: var(--bg); padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)) }
.timer .in2 { max-width: 528px; margin: 0 auto; display: flex; align-items: center; gap: 12px }
.timer .clock { font-family: var(--display); font-weight: 800; font-size: 34px; font-variant-numeric: tabular-nums; min-width: 92px }
.timer .clock.over { color: var(--accent) }
.timer .lbl { flex: 1; min-width: 0; font-size: 13px; line-height: 1.25; opacity: .8 }
.timer button { border: 1px solid currentColor; background: transparent; color: inherit; border-radius: 10px; padding: 8px 10px; font-weight: 700; font-size: 14px }
.timer .prog { position: absolute; left: 0; top: 0; height: 3px; background: var(--accent) }
@media (prefers-reduced-motion: no-preference) { .meter i, .timer .prog { transition: width .3s linear } }
</style>
</head>
<body>

<section class="auth" id="auth" hidden>
  <div class="auth-in">
    <div><div class="brand">Lift<b>Log</b></div><p class="muted" style="margin:6px 0 0">Workout plans, animated how-tos and your progress in one place. Made for beginners.</p></div>
    <div class="card" id="authBody"></div>
  </div>
</section>

<div class="app" id="app" hidden>
  <header class="top">
    <div class="bar">
      <div class="brand">Lift<b>Log</b></div>
      <div class="me"><span class="sync" id="sync" role="status"></span><a class="avatar" id="avatar" href="#account" aria-label="Your account">?</a></div>
    </div>
    <nav class="nav" aria-label="Main">
      <a href="#home" data-nav="home">Train</a><a href="#plans" data-nav="plans">Plans</a><a href="#learn" data-nav="learn">Learn</a><a href="#progress" data-nav="progress">Progress</a>
    </nav>
    <div class="weeks" id="weeks" role="group" aria-label="Choose week"></div>
  </header>
  <main id="view"></main>
</div>

<div class="sheet" id="sheet" hidden><div class="sheet-in" id="sheetIn" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div></div>
<div class="toast" id="toast" hidden></div>

<div class="timer" id="timer" hidden>
  <div class="prog" id="tProg"></div>
  <div class="in2">
    <div class="clock" id="tClock">1:30</div>
    <div class="lbl" id="tLbl">Rest</div>
    <button type="button" id="tAdd">+15s</button>
    <button type="button" id="tSkip">Done</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="exercises.js"></script>
<script src="guides.js"></script>
<script>
/* ================= Setup ================= */
const CFG = window.LIFTLOG_CONFIG || {};
const CLOUD = !!(CFG.supabaseUrl && CFG.supabaseKey);   // no config = everything stays on this device
let sb = null;
try { if (CLOUD && window.supabase) sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey); } catch (e) {}
const HERE = location.origin + location.pathname;

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Math.random().toString(36).slice(2, 8);
const clone = o => JSON.parse(JSON.stringify(o));
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
const TICK = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const UP = '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 9l4-4 4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
const DOWN = '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 5l4 4 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
const DEL = '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 3l8 8M11 3l-8 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
const PERSON = '<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="6" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M2.8 16c.8-3.2 3.3-5 6.2-5s5.4 1.8 6.2 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';

/* ================= Plans + state ================= */
// Plan: { id, name, weeks, warmup:{what,time,note}, sessions:[{ id, name, focus, note, rounds, ex:[{id,k,name,reps,sets}], core:[{id,k,name,reps}] }] }
function planFromTemplate(t, fixedIds) {
  return {
    id: fixedIds ? t.id : uid(), name: t.name, weeks: 6, warmup: clone(t.warmup),
    sessions: t.sessions.map((s, i) => {
      const sid = fixedIds ? "s" + (i + 1) : uid();
      return { id: sid, name: s.name, focus: s.focus || "", note: s.note || "", rounds: 3,
        ex: s.ex.map((e, j) => ({ id: fixedIds ? sid + "e" + j : uid(), k: e[0], name: e[3] || "", reps: e[1], sets: e[2] })),

function blankState() { return { v: 2, savedAt: 0, rest: 90, active: null, plans: [], weekBy: {}, logs: {}, hideWelcome: false, calc: {} }; }

let S = blankState(), KEY = null, USER = null;
function loadLocal(id) {

}
function writeLocal() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function save() { S.savedAt = Date.now(); writeLocal(); if (sb && USER) queuePush(); }

const plan = () => S.plans.find(p => p.id === S.active) || null;
const planById = id => S.plans.find(p => p.id === id);

const exName = e => e.name || (LIB[e.k] ? LIB[e.k].name : e.k);

function getLog(p, s, w, create) {

const fmtKg = n => (Math.round(n * 100) / 100).toString();
const fmtDate = iso => new Date(iso).toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });

/* ================= Cloud sync (Supabase) ================= */
let pushTimer = null, pushing = false, dirty = false;
function setSync(t) { $("#sync").textContent = t; }
function queuePush() { dirty = true; setSync("Saving…"); clearTimeout(pushTimer); pushTimer = setTimeout(push, 800); }
async function push() {
  if (!USER || pushing) return;
  pushing = true; dirty = false;
  let error;
  try { ({ error } = await sb.from("lift_logs").upsert({ user_id: USER.id, state: clone(S), updated_at: new Date().toISOString() })); } catch (e) { error = e; }
  pushing = false;
  if (error) { dirty = true; setSync("Offline · will retry"); clearTimeout(pushTimer); pushTimer = setTimeout(push, 15000); return; }
  if (dirty) queuePush(); else setSync("Saved");
}
async function pull() {
  let data, error;
  try { ({ data, error } = await sb.from("lift_logs").select("state").eq("user_id", USER.id).maybeSingle()); } catch (e) { error = e; }
  if (error) { setSync("Offline"); return; }
  const remote = data && data.state;
  if (remote && (remote.savedAt || 0) > (S.savedAt || 0)) { S = normalize(remote); writeLocal(); rerender(); setSync("Saved"); }
  else if (S.savedAt && (!remote || (remote.savedAt || 0) < S.savedAt)) push();
  else setSync("Saved");
}
addEventListener("online", () => { if (USER && dirty) push(); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && USER && !dirty && !pushing) pull(); });

const friendly = e => { const m = (e && e.message) || String(e); const hit = AUTH_ERRORS.find(([re]) => re.test(m)); return hit ? hit[1] : m; };

function showAuth(mode, msg, ok) {

  const body = {
    loading: `<p class="muted center" style="margin:0">Loading…</p>`,
    broken: `<h2>Can't load sign-in</h2><p class="muted" style="margin:0">Check your internet connection, then reload the page.</p><button class="btn primary" type="button" onclick="location.reload()">Reload</button>`,
    login: `<h2>Log in</h2><form data-auth="login" novalidate>${f("aEmail", "Email", "email", `autocomplete="email" value="${email}" required`)}${f("aPass", "Password", "password", 'autocomplete="current-password" required')}${note}<button class="btn primary wide" type="submit">Log in</button></form>

    signup: `<h2>Create your account</h2><form data-auth="signup" novalidate>${f("aName", "Your first name", "text", 'autocomplete="given-name" required')}${f("aEmail", "Email", "email", `autocomplete="email" value="${email}" required`)}${f("aPass", 'Password <span class="hint">At least 8 characters</span>', "password", 'autocomplete="new-password" minlength="8" required')}${note}<button class="btn primary wide" type="submit">Create account</button></form>

}
async function authSubmit(form) {
  const kind = form.dataset.auth, btn = form.querySelector("button[type=submit]");
  const email = ($("#aEmail") || {}).value?.trim(), pass = ($("#aPass") || {}).value || "", name = ($("#aName") || {}).value?.trim();

  if (kind === "signup" && !name) return showAuth(kind, "Enter your first name.");
  if ((kind === "signup" || kind === "reset") && pass.length < 8) return showAuth(kind, "Your password needs at least 8 characters.");
  if (kind === "login" && !pass) return showAuth(kind, "Enter your password.");

  try {
    if (kind === "login") { const { error } = await sb.auth.signInWithPassword({ email, password: pass }); if (error) throw error; }
    if (kind === "signup") {
      const { data, error } = await sb.auth.signUp({ email, password: pass, options: { data: { name }, emailRedirectTo: HERE } });

}

/* ---- Nutrition calculator (Mifflin-St Jeor) ---- */
function calcHTML() {
  const c = Object.assign({ wu: "kg", hu: "cm", sex: "f", act: "1.375", goal: "maintain" }, S.calc);
  const opt = (v, cur, t) => `<option value="${v}"${String(cur) === v ? " selected" : ""}>${t}</option>`;
  return `<section class="card calc" id="calc"><span class="label">Your numbers</span><h2>Nutrition calculator</h2>
    <div class="grid2"><label class="fl" for="cWu">Weight in<select class="in" id="cWu" data-c="wu">${opt("kg", c.wu, "kg")}${opt("st", c.wu, "stone & lb")}</select></label>
      <div class="grid2" style="align-items:end"><label class="fl" for="cW1">${c.wu === "st" ? "st" : "kg"}<input class="in num" id="cW1" data-c="w1" inputmode="decimal" value="${esc(c.w1)}"></label>
      ${c.wu === "st" ? `<label class="fl" for="cW2">lb<input class="in num" id="cW2" data-c="w2" inputmode="decimal" value="${esc(c.w2)}"></label>` : "<span></span>"}</div></div>
    <div class="grid2"><label class="fl" for="cHu">Height in<select class="in" id="cHu" data-c="hu">${opt("cm", c.hu, "cm")}${opt("ft", c.hu, "feet & inches")}</select></label>
      <div class="grid2" style="align-items:end"><label class="fl" for="cH1">${c.hu === "ft" ? "ft" : "cm"}<input class="in num" id="cH1" data-c="h1" inputmode="decimal" value="${esc(c.h1)}"></label>
      ${c.hu === "ft" ? `<label class="fl" for="cH2">in<input class="in num" id="cH2" data-c="h2" inputmode="decimal" value="${esc(c.h2)}"></label>` : "<span></span>"}</div></div>
    <div class="grid2"><label class="fl" for="cAge">Age<input class="in num" id="cAge" data-c="age" inputmode="numeric" value="${esc(c.age)}"></label>
      <label class="fl" for="cSex">Formula for<select class="in" id="cSex" data-c="sex">${opt("f", c.sex, "Female body")}${opt("m", c.sex, "Male body")}</select></label></div>
    <label class="fl" for="cAct">How active are you?<select class="in" id="cAct" data-c="act">${opt("1.2", c.act, "Mostly sitting, little exercise")}${opt("1.375", c.act, "Light: training 1 to 3 days a week")}${opt("1.55", c.act, "Moderate: training 3 to 5 days a week")}${opt("1.725", c.act, "Very active: hard training or a physical job")}</select></label>
    <label class="fl" for="cGoal">Your goal<select class="in" id="cGoal" data-c="goal">${opt("lose", c.goal, "Lose fat slowly")}${opt("maintain", c.goal, "Stay the same, get stronger")}${opt("build", c.goal, "Build muscle")}</select></label>
    <div id="calcOut" aria-live="polite"></div>
    <p class="muted" style="margin:0;font-size:13px">Estimates only, from the Mifflin-St Jeor formula. Treat them as a starting point, and adjust by how you feel and how your weight changes over a few weeks. Saved to your account.</p></section>`;
}
function calcUpdate() {
  const out = $("#calcOut"); if (!out) return;
  const c = Object.assign({ wu: "kg", hu: "cm", sex: "f", act: "1.375", goal: "maintain" }, S.calc);
  const kg = c.wu === "st" ? (num(c.w1) || 0) * 6.35029 + (num(c.w2) || 0) * 0.453592 : num(c.w1);
  const cm = c.hu === "ft" ? (num(c.h1) || 0) * 30.48 + (num(c.h2) || 0) * 2.54 : num(c.h1);
  const age = num(c.age);
  if (!kg || !cm || !age || kg < 30 || kg > 300 || cm < 120 || cm > 230 || age < 16 || age > 99) {
    out.innerHTML = `<p class="tile muted" style="margin:0">Fill in your weight, height and age to see your numbers.${age && age < 16 ? " This calculator is for adults. Under 18s should talk to a GP or school nurse about food." : ""}</p>`; return;
  }
  const bmr = 10 * kg + 6.25 * cm - 5 * age + (c.sex === "m" ? 5 : -161), maint = bmr * parseFloat(c.act);
  const target = c.goal === "lose" ? maint * 0.85 : c.goal === "build" ? maint * 1.07 : maint;
  const r50 = n => Math.round(n / 50) * 50, floor = c.sex === "m" ? 1500 : 1200;
  const low = target < floor;
  out.innerHTML = `<div class="results">
    <div class="tile hl"><small>Daily calories for your goal</small><b>${r50(Math.max(target, floor)).toLocaleString("en-GB")}</b><small>kcal</small></div>
    <div class="tile hl"><small>Protein</small><b>${Math.round(kg * 1.6)} g</b><small>a day (up to ${Math.round(kg * 2.2)} g is fine)</small></div>
    <div class="tile"><small>Maintenance</small><b>${r50(maint).toLocaleString("en-GB")}</b><small>kcal to stay the same</small></div>
    <div class="tile"><small>Water</small><b>${(kg * 0.033).toFixed(1)} L</b><small>a day, more when training</small></div></div>
    ${low ? `<p class="tip" style="margin-top:10px">We don't suggest going below ${floor.toLocaleString("en-GB")} kcal a day without support from a GP or dietitian, so that's shown instead.</p>` : ""}
    <p style="margin:10px 0 0">That's about <b>${Math.round(kg * 1.6 / 4)} g of protein</b> at each of 4 meals and snacks.</p>`;
}

function renderProgress() {

  let sessions = 0, sets = 0, kg = 0;
  for (const k in S.logs) if (k.startsWith(p.id + "|")) { const l = S.logs[k]; if (l.done) sessions++; for (const e in l.sets) for (const x of l.sets[e]) if (x.done) { sets++; kg += (num(x.kg) || 0) * (num(x.reps) || 0); } }
  let html = `<section class="hello"><span class="label">${esc(p.name)}</span><h1>Progress</h1><p class="muted">Your heaviest set for each exercise, week by week. Green means you went up.</p></section>
    <div class="results"><div class="tile hl"><small>Sessions done</small><b class="num">${sessions}</b></div><div class="tile hl"><small>Sets logged</small><b class="num">${sets}</b></div>
    <div class="tile" style="grid-column:1/-1"><small>Total weight lifted (kg × reps)</small><b class="num">${Math.round(kg).toLocaleString("en-GB")} kg</b></div></div>`;

    if (!s.ex.length) continue;

      <div class="tablewrap"><table><thead><tr><th>Exercise</th>${Array.from({ length: p.weeks }, (_, i) => `<th class="${i + 1 === weekOf(p) ? "cur" : ""}">W${i + 1}</th>`).join("")}</tr></thead><tbody>`;
    for (const e of s.ex) {
      let prev = null;
      html += `<tr><td>${esc(exName(e))}</td>`;
      for (let w = 1; w <= p.weeks; w++) {
        const t = topSet(p, s, w, e);

      html += `</tr>`;
    }
    html += `</tbody></table></div><p class="label" style="margin:10px 0 0">Weights in kg</p></section>`;
  }
  $("#view").innerHTML = `<div class="stack">${html}</div>`;
}

/* ---- Router ---- */
function route() {
  if ($("#app").hidden) return;
  const h = (location.hash || "#home").slice(1), i = h.indexOf("-");
  const page = i < 0 ? h : h.slice(0, i), arg = i < 0 ? "" : h.slice(i + 1);
  const tab = { sess: "home", plan: "plans", guide: "learn", library: "learn" }[page] || page;
  document.querySelectorAll("[data-nav]").forEach(a => a.setAttribute("aria-current", a.dataset.nav === tab ? "page" : "false"));
  $("#avatar").setAttribute("aria-current", page === "account" ? "page" : "false");
  $("#avatar").innerHTML = USER ? esc(displayName().charAt(0).toUpperCase()) : PERSON;
  renderWeeks(plan(), ["home", "sess", "progress"].includes(page) || !["plans", "plan", "learn", "guide", "library", "account"].includes(page));
  ({ sess: () => renderSession(arg), plans: renderPlans, plan: () => renderEditor(arg), learn: renderLearn, guide: () => renderGuide(arg),
     library: renderLibrary, progress: renderProgress, account: renderAccount }[page] || renderHome)();
  mountDemos($("#view"));
}
function rerender() { const y = scrollY; route(); scrollTo(0, y); }
addEventListener("hashchange", () => { armed = null; closeSheet(); route(); scrollTo(0, 0); });

/* ================= Events ================= */
document.addEventListener("toggle", ev => { const d = ev.target; if (d.dataset && d.dataset.how) d.open ? OPEN.add(d.dataset.how) : OPEN.delete(d.dataset.how); }, true);
document.addEventListener("submit", ev => { const f = ev.target.closest("form[data-auth]"); if (f) { ev.preventDefault(); authSubmit(f); } });
document.addEventListener("keydown", ev => { if (ev.key === "Escape") closeSheet(); });
$("#sheet").addEventListener("click", ev => { if (ev.target.id === "sheet") closeSheet(); });

document.addEventListener("input", ev => {
  const t = ev.target;
  if (t.id === "libSearch" || t.id === "pickSearch") { (t.id === "pickSearch" ? PICKF : LIBF).q = t.value; refreshGrid(); return; }
  if (t.dataset.c) { S.calc = Object.assign({}, S.calc, { [t.dataset.c]: t.value }); save(); if (t.tagName === "SELECT" && /^(wu|hu)$/.test(t.dataset.c)) rerender(); else calcUpdate(); return; }
  const p = plan();
  if (t.dataset.f) {   // a set's kg or reps
    const e = t.closest("[data-eid]").dataset.eid, j = +t.closest("[data-set]").dataset.set, s = sessOf(p, location.hash.slice(6));
    getLog(p, s, weekOf(p), true).sets[e][j][t.dataset.f] = t.value.trim(); save(); return;
  }
  const ep = planById(location.hash.slice(6)); if (!ep || !location.hash.startsWith("#plan-")) return;
  if (t.dataset.pf) {
    const f = t.dataset.pf;
    if (f === "weeks") { const n = parseInt(t.value, 10); if (n >= 1) ep.weeks = clamp(n, 1, 16); }
    else if (f.startsWith("wu.")) ep.warmup[f.slice(3)] = t.value;
    else ep[f] = t.value;
    save(); return;
  }
  const s = ep.sessions.find(x => x.id === (t.closest("[data-sid]") || {}).dataset?.sid); if (!s) return;
  if (t.dataset.sf) { if (t.dataset.sf === "rounds") { const n = parseInt(t.value, 10); if (n >= 0) s.rounds = clamp(n, 0, 6); } else s[t.dataset.sf] = t.value; save(); return; }
  if (t.dataset.xf) {
    const r = t.closest("[data-eid]"), list = r.dataset.kind === "core" ? s.core : s.ex, e = list.find(x => x.id === r.dataset.eid);
    if (t.dataset.xf === "sets") { const n = parseInt(t.value, 10); if (n >= 1) e.sets = clamp(n, 1, 10); } else e.reps = t.value;
    save();
  }
});
document.addEventListener("change", ev => { if (ev.target.matches("[data-pf=weeks], [data-xf=sets], [data-sf=rounds]")) rerender(); });

document.addEventListener("click", async ev => {
  const t = ev.target, on = sel => t.closest(sel);
  let el;
  if (on("[data-amode]")) return showAuth(on("[data-amode]").dataset.amode);
  if (on("[data-close]")) return closeSheet();
  if ((el = on("[data-info]"))) { ev.preventDefault(); return infoSheet(el.dataset.info); }
  if ((el = on("[data-grp]"))) { (!$("#sheet").hidden ? PICKF : LIBF).g = el.dataset.grp; return refreshGrid(); }
  if ((el = on("[data-pick]")) && pickTarget) {
    const p = planById(pickTarget.pid), s = sessOf(p, pickTarget.sid), k = el.dataset.pick;
    if (pickTarget.kind === "core") s.core.push({ id: uid(), k, name: "", reps: "10–15" });
    else s.ex.push({ id: uid(), k, name: "", reps: LIB[k].g === "Cardio" ? "30 sec" : "8 to 12", sets: 3 });
    save(); closeSheet(); rerender(); toast(LIB[k].name + " added"); return;
  }
  if ((el = on("[data-week]"))) { const p = plan(); S.weekBy[p.id] = +el.dataset.week; save(); return rerender(); }
  if (on("[data-hidewelcome]")) { S.hideWelcome = true; save(); return rerender(); }
  if ((el = on("[data-usetemplate]"))) {
    const tpl = TEMPLATES.find(x => x.id === el.dataset.usetemplate), p = planFromTemplate(tpl, false);
    S.plans.push(p); S.active = p.id; S.weekBy[p.id] = 1; save(); toast("Now following " + p.name); location.hash = "home"; return;
  }
  if (on("[data-newblank]")) {
    ev.preventDefault();
    const p = { id: uid(), name: "My plan", weeks: 6, warmup: { what: "Exercise bike", time: "10 minutes", note: "Easy pace, then a little faster" },
      sessions: [{ id: uid(), name: "Day 1", focus: "", note: "", rounds: 2, ex: [], core: [] }] };
    S.plans.push(p); if (!S.active) S.active = p.id; save(); location.hash = "plan-" + p.id; return;
  }
  if ((el = on("[data-useplan]"))) { S.active = el.dataset.useplan; save(); toast("Now following " + plan().name); location.hash = "home"; return; }
  if ((el = on("[data-copyplan]"))) {
    const src = planById(el.dataset.copyplan), p = clone(src); p.id = uid(); p.name = "Copy of " + src.name;
    S.plans.push(p); save(); location.hash = "plan-" + p.id; return;
  }
  if ((el = on("[data-delplan]"))) {
    const id = el.dataset.delplan;
    if (armed !== "del-" + id) { armed = "del-" + id; return rerender(); }
    armed = null; S.plans = S.plans.filter(p => p.id !== id);
    for (const k in S.logs) if (k.startsWith(id + "|")) delete S.logs[k];
    delete S.weekBy[id]; S = normalize(S); save(); toast("Plan deleted"); return rerender();
  }
  // Plan editor
  const ep = location.hash.startsWith("#plan-") ? planById(location.hash.slice(6)) : null;
  if (ep) {
    const s = ep.sessions.find(x => x.id === (t.closest("[data-sid]") || {}).dataset?.sid);
    if (on("[data-addsess]")) { ep.sessions.push({ id: uid(), name: "Day " + (ep.sessions.length + 1), focus: "", note: "", rounds: 2, ex: [], core: [] }); save(); return rerender(); }
    if (s && (el = on("[data-add]"))) return pickerSheet(ep.id, s.id, el.dataset.add);
    if (s && on("[data-delsess]")) {
      if (armed !== "sess-" + s.id) { armed = "sess-" + s.id; return rerender(); }
      armed = null; ep.sessions = ep.sessions.filter(x => x !== s); save(); return rerender();
    }
    const r = t.closest(".erow");
    if (s && r) {
      const list = r.dataset.kind === "core" ? s.core : s.ex, i = list.findIndex(x => x.id === r.dataset.eid);
      if ((el = on("[data-move]"))) { const j = i + +el.dataset.move; if (j >= 0 && j < list.length) { [list[i], list[j]] = [list[j], list[i]]; save(); rerender(); } return; }
      if (on("[data-remove]")) { list.splice(i, 1); save(); return rerender(); }
    }
  }
  // Session
  const p = plan(), s = location.hash.startsWith("#sess-") && sessOf(p, location.hash.slice(6));
  if (s) {
    const w = weekOf(p), l = getLog(p, s, w, true);
    if (on("[data-warm]")) { l.warm = !l.warm; save(); return rerender(); }
    if ((el = on("[data-core]"))) { const r = +el.dataset.core; l.core[r] = !l.core[r]; save(); rerender(); if (l.core[r] && r < s.rounds - 1) startRest(60, "Rest before round " + (r + 2)); return; }
    if (on("[data-tick]")) {
      const eid = t.closest("[data-eid]").dataset.eid, j = +t.closest("[data-set]").dataset.set;
      const i = s.ex.findIndex(e => e.id === eid), e = s.ex[i], set = l.sets[eid][j];
      set.done = !set.done;
      if (set.done) {
        // Fill blanks from the set above, or from last week's best.
        const above = l.sets[eid][j - 1], lt = lastTime(p, s, w, e);
        if (!set.kg) set.kg = above && above.kg ? above.kg : lt ? fmtKg(lt.kg) : "";
        if (!set.reps && above && above.reps) set.reps = above.reps;
        const lastSet = j === e.sets - 1, nx = s.ex[i + 1];
        startRest(S.rest, lastSet ? (nx ? "Next: " + exName(nx) : s.core.length ? "Core finisher next" : "Last set done") : `Rest · then set ${j + 2} of ${exName(e)}`);
      }
      save(); return rerender();
    }
    if (on("[data-finish]")) { l.done = new Date().toISOString(); save(); stopRest(); toast("Session saved. Well done!"); location.hash = "home"; return; }
    if (on("[data-undo]")) { l.done = null; save(); return rerender(); }
  }
  // Account
  if (on("[data-signout]")) return signOut();
  if (on("[data-changepw]")) {
    const { error } = await sb.auth.resetPasswordForEmail(USER.email, { redirectTo: HERE });
    const m = $("#acctMsg"); if (m) { m.className = "msg " + (error ? "err" : "ok"); m.textContent = error ? friendly(error) : "We've emailed you a link to choose a new password."; }
    return;
  }
  if (on("[data-resetplan]")) {
    if (armed !== "reset") { armed = "reset"; return rerender(); }
    armed = null; const id = S.active; for (const k in S.logs) if (k.startsWith(id + "|")) delete S.logs[k];
    S.weekBy[id] = 1; save(); toast("Log cleared"); location.hash = "home"; return;
  }
  if (t.id === "copyBk") {
    const txt = JSON.stringify(S), box = $("#bk"); box.value = txt;
    const ok = () => { $("#bkMsg").className = "msg ok"; $("#bkMsg").textContent = "Backup copied. Paste it into Notes to keep it safe."; };
    const fb = () => { box.focus(); box.select(); $("#bkMsg").className = "msg"; $("#bkMsg").textContent = "Backup is in the box. Select it all and copy."; };
    try { navigator.clipboard.writeText(txt).then(ok, fb); } catch (e) { fb(); }
    return;
  }
  if (t.id === "restoreBk") {
    try {
      let d = JSON.parse($("#bk").value);
      if (!d || typeof d.logs !== "object") throw 0;
      if (!d.v) d = migrateV1(d);
      S = normalize(d); save(); rerender(); $("#bkMsg").className = "msg ok"; $("#bkMsg").textContent = "Backup restored.";
    } catch (e) { $("#bkMsg").className = "msg err"; $("#bkMsg").textContent = "That text isn't a Lift Log backup. Copy the whole backup and try again."; }
  }
});

/* ================= Rest timer ================= */
let tEnd = 0, tLen = 0, tInt = null, beeped = false, wake = null;
function startRest(sec, label) {
  tLen = sec; tEnd = Date.now() + sec * 1000; beeped = false;
  $("#tLbl").textContent = label; $("#timer").hidden = false;
  clearInterval(tInt); tInt = setInterval(tickRest, 250); tickRest();
  try { navigator.wakeLock && navigator.wakeLock.request("screen").then(w => wake = w, () => {}); } catch (e) {}
}
function stopRest() { clearInterval(tInt); $("#timer").hidden = true; try { wake && wake.release(); } catch (e) {} wake = null; }
function tickRest() {
  const left = Math.round((tEnd - Date.now()) / 1000), a = Math.abs(left);
  $("#tClock").textContent = (left < 0 ? "+" : "") + Math.floor(a / 60) + ":" + String(a % 60).padStart(2, "0");
  $("#tClock").classList.toggle("over", left <= 0);
  $("#tProg").style.width = Math.max(0, Math.min(100, (1 - left / tLen) * 100)) + "%";
  if (left <= 0 && !beeped) { beeped = true; $("#tLbl").textContent = "Time's up. " + $("#tLbl").textContent.replace(/^Rest · then /, ""); beep(); }
  if (left < -120) stopRest();
}
function beep() {
  try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {}
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    [0, .25].forEach(d => { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = 880; o.connect(g); g.connect(ac.destination);
      g.gain.setValueAtTime(.2, ac.currentTime + d); g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + d + .2); o.start(ac.currentTime + d); o.stop(ac.currentTime + d + .22); });
  } catch (e) {}
}
$("#tAdd").onclick = () => { tEnd += 15000; tLen += 15; beeped = false; tickRest(); };
$("#tSkip").onclick = stopRest;

/* ================= Start ================= */
if (!CLOUD) { loadLocal("local"); showApp(); }
else if (!sb) showAuth("broken");
else { showAuth("loading"); sb.auth.onAuthStateChange((ev, session) => setTimeout(() => onAuth(ev, session), 0)); }
</script>
